/* ════════════════════════════════════════════════════════════════════════════
   STORE
   ════════════════════════════════════════════════════════════════════════════ */
function useStore() {
  const [hist, setHist] = useState([]);
  const [favs, setFavs] = useState([]);
  const [wl, setWl] = useState([]);
  const [pls, setPls] = useState([]);
  const [subs, setSubs] = useState([]);
  const [cfg, setCfg] = useState(bootCfg);
  const [sync, setSync] = useState({ state: "boot", at: 0, error: "", caps: CAPS, key: "" });

  const R = useRef({});                       // latest state, for toggle decisions
  R.current = { hist, favs, wl, pls, subs, cfg };
  const cfgRef = useRef(cfg); cfgRef.current = cfg;
  const q = useRef({ map: new Map(), timer: null, busy: false, dead: 0 });
  const alive = useRef(true);
  useEffect(() => () => { alive.current = false; }, []);

  /* ── write queue: every change is batched into one POST ───────────────────
     On failure the batch goes back into the queue and retries with backoff, so
     nothing is silently lost while the tab is open. */
  const flush = useCallback(async function run() {
    const qq = q.current;
    if (qq.timer) { clearTimeout(qq.timer); qq.timer = null; }
    if (qq.busy || !qq.map.size) return;
    const relative = !baseOf(cfgRef.current);   // same-origin: app served by the worker itself
    const ops = [];
    for (const slot of qq.map.values()) {
      if (slot.kind === "cfg") ops.push({ kind: "cfg", upsert: [{ id: "cfg", pos: 1, data: R.current.cfg }] });
      else ops.push({ kind: slot.kind, upsert: [...slot.upsert.values()], del: [...slot.del], clear: !!slot.clear });
    }
    qq.map.clear();
    qq.busy = true;
    try {
      const r = await apiSyncPush(cfgRef.current, profileKey(), ops);
      if (!r || r.ok === false) throw new Error((r && r.error) || "cloud store write failed");
      qq.dead = 0;
      if (alive.current) setSync((s) => ({ ...s, state: "ok", at: Date.now(), error: "", written: (s.written || 0) + (r.written || 0) }));
    } catch (e) {
      const back = q.current.map;
      for (const op of ops) {
        const slot = ensureSlot(back, op.kind);
        if (op.clear) { slot.clear = true; continue; }
        for (const it of op.upsert || []) if (!slot.del.has(it.id)) slot.upsert.set(it.id, it);
        for (const id of op.del || []) { slot.del.add(id); slot.upsert.delete(id); }
      }
      qq.dead = (qq.dead || 0) + 1;
      // no engine configured = the page is probably static hosting: keep working
      // in memory, and say so instead of showing a permanent error
      if (alive.current) setSync((s) => relative ? { ...s, state: "local", error: "" } : { ...s, state: "error", error: e.message });
      if (!relative && qq.dead <= 6) qq.timer = setTimeout(run, Math.min(60000, qq.dead * 5000));
    } finally { qq.busy = false; }
  }, []);

  const schedule = useCallback(() => {
    const qq = q.current;
    if (qq.timer) clearTimeout(qq.timer);
    qq.timer = setTimeout(flush, 400);
  }, [flush]);

  const put = useCallback((kind, items) => {
    if (!items || !items.length) return;
    const slot = ensureSlot(q.current.map, kind);
    slot.clear = false;
    for (const it of items) {
      if (!it || !it.id) continue;
      slot.upsert.set(it.id, it);
      slot.del.delete(it.id);
    }
    schedule();
  }, [schedule]);

  const drop = useCallback((kind, ids) => {
    if (!ids || !ids.length) return;
    const slot = ensureSlot(q.current.map, kind);
    slot.clear = false;
    for (const id of ids) { slot.del.add(id); slot.upsert.delete(id); }
    schedule();
  }, [schedule]);

  const wipe = useCallback((kind) => {
    const slot = ensureSlot(q.current.map, kind);
    slot.upsert.clear(); slot.del.clear(); slot.clear = true;
    schedule();
  }, [schedule]);

  /* ── first paint: one GET pulls the whole profile ─────────────────────── */
  const load = useCallback(async (c) => {
    profileKey();
    const relative = !baseOf(c);
    setSync((s) => ({ ...s, state: "loading", key: profileKey() }));
    try {
      const r = await apiSyncGet(c, profileKey());
      if (!r || r.ok === false) throw new Error((r && r.error) || "cloud store read failed");
      const s0 = r.store || {};
      setHist((s0.history || []).slice(0, CAPS.history));
      setFavs((s0.likes || []).slice(0, CAPS.likes));
      setWl((s0.watchlater || []).slice(0, CAPS.watchlater));
      setPls((s0.playlists || []).slice(0, CAPS.playlists));
      setSubs((s0.subs || []).slice(0, CAPS.subs));
      if (s0.cfg && typeof s0.cfg === "object") {
        const { engineUrl: _e, accessKey: _a, ...rest } = s0.cfg;   // bootstrap stays per-device
        setCfg((c0) => ({ ...c0, ...rest }));
      }
      setSync({ state: "ok", at: Date.now(), error: "", caps: r.caps || CAPS, key: profileKey(), backend: r.backend || "layerbase", stale: !!r.stale, warning: r.warning || "" });
    } catch (e) {
      setSync((s) => relative
        ? { ...s, state: "local", error: "", key: profileKey() }
        : { ...s, state: "error", error: e.message, key: profileKey() });
    }
  }, []);

  const loadedSig = useRef("");
  useEffect(() => {
    const sig = (baseOf(cfg) || "(same-origin)") + "|" + String(cfg.accessKey || "");
    if (sig === loadedSig.current) return;
    loadedSig.current = sig;
    load(cfg);
  }, [cfg.engineUrl, cfg.accessKey, load]);

  /* flush whenever the tab goes away, so a quick close does not lose a click */
  useEffect(() => {
    const onHide = () => { flush(); };
    window.addEventListener("pagehide", onHide);
    document.addEventListener("visibilitychange", onHide);
    return () => {
      window.removeEventListener("pagehide", onHide);
      document.removeEventListener("visibilitychange", onHide);
    };
  }, [flush]);

  /* ── history ─────────────────────────────────────────────────────────── */
  const addHist = useCallback((v) => {
    if (!v || !v.videoId) return;
    const prev = (R.current.hist || []).find((x) => x.videoId === v.videoId);
    const item = { ...v, watchedAt: Date.now(), ...(prev && prev.pos ? { pos: prev.pos, dur: prev.dur || v.lengthSeconds || 0 } : {}) };
    setHist((h) => [item, ...h.filter((x) => x.videoId !== v.videoId)].slice(0, CAPS.history));
    put("history", [{ id: v.videoId, pos: Date.now(), data: item }]);
  }, [put]);
  const clrHist = useCallback(() => { setHist([]); wipe("history"); }, [wipe]);
  const rmHist = useCallback((id) => { setHist((h) => h.filter((v) => v.videoId !== id)); drop("history", [id]); }, [drop]);

  /* ── likes ───────────────────────────────────────────────────────────── */
  const togFav = useCallback((v) => {
    if (!v || !v.videoId) return;
    const has = (R.current.favs || []).some((x) => x.videoId === v.videoId);
    if (has) {
      setFavs((f) => f.filter((x) => x.videoId !== v.videoId));
      drop("likes", [v.videoId]);
    } else {
      setFavs((f) => [v, ...f.filter((x) => x.videoId !== v.videoId)].slice(0, CAPS.likes));
      put("likes", [{ id: v.videoId, pos: Date.now(), data: v }]);
    }
  }, [drop, put]);
  const isFav = (id) => (R.current.favs || []).some((v) => v.videoId === id);

  /* ── watch later ─────────────────────────────────────────────────────── */
  const togWL = useCallback((v) => {
    if (!v || !v.videoId) return;
    const has = (R.current.wl || []).some((x) => x.videoId === v.videoId);
    if (has) {
      setWl((w) => w.filter((x) => x.videoId !== v.videoId));
      drop("watchlater", [v.videoId]);
    } else {
      setWl((w) => [v, ...w.filter((x) => x.videoId !== v.videoId)].slice(0, CAPS.watchlater));
      put("watchlater", [{ id: v.videoId, pos: Date.now(), data: v }]);
    }
  }, [drop, put]);
  const isWL = (id) => (R.current.wl || []).some((v) => v.videoId === id);

  /* ── playlists ───────────────────────────────────────────────────────── */
  const mkPL = useCallback((nm, video) => {
    const pl = { id: uid(), name: nm, videos: video && video.videoId ? [video] : [], createdAt: Date.now() };
    setPls((p) => [...p, pl].slice(-CAPS.playlists));
    put("playlists", [{ id: pl.id, pos: pl.createdAt, data: pl }]);
    return pl;
  }, [put]);
  const rmPL = useCallback((id) => { setPls((p) => p.filter((x) => x.id !== id)); drop("playlists", [id]); }, [drop]);
  const addToPL = useCallback((plId, v) => {
    if (!plId || !v || !v.videoId) return;
    const before = (R.current.pls || []).find((x) => x.id === plId);
    if (!before) return;
    const next = { ...before, videos: [...(before.videos || []).filter((x) => x.videoId !== v.videoId), v] };
    setPls((list) => list.map((p) => (p.id === plId ? next : p)));
    put("playlists", [{ id: next.id, pos: next.createdAt, data: next }]);
  }, [put]);
  const removeFromPL = useCallback((plId, videoId) => {
    const before = (R.current.pls || []).find((x) => x.id === plId);
    if (!before) return;
    const next = { ...before, videos: (before.videos || []).filter((x) => x.videoId !== videoId) };
    setPls((list) => list.map((p) => (p.id === plId ? next : p)));
    put("playlists", [{ id: next.id, pos: next.createdAt, data: next }]);
  }, [put]);
  const isInPL = (plId, videoId) => {
    const p = (R.current.pls || []).find((x) => x.id === plId);
    return !!(p && (p.videos || []).some((v) => v.videoId === videoId));
  };

  /* ── resume position (YouTube-style "continue watching") ──────────────── */
  const savePos = useCallback((videoId, pos, dur) => {
    if (!videoId || !isFinite(pos) || pos < 3) return;
    setHist((h) => {
      const i = h.findIndex((v) => v.videoId === videoId);
      if (i < 0) return h;
      const item = { ...h[i], pos, dur: dur || h[i].dur || 0 };
      const copy = h.slice(); copy[i] = item;
      const { watchedAt, ...rest } = item;
      put("history", [{ id: videoId, pos: watchedAt || Date.now(), data: item }]);
      return copy;
    });
  }, [put]);

  /* ── subscriptions (metadata in the DB, videos still from feeds) ──────── */
  const addSub = useCallback((ch) => {
    if (!ch || !ch.channelId) return;
    if ((R.current.subs || []).some((x) => x.channelId === ch.channelId)) return;
    const item = { channelId: ch.channelId, name: ch.name || ch.channelId, avatar: ch.avatar || "", addedAt: Date.now() };
    setSubs((s) => [...s, item].slice(-CAPS.subs));
    put("subs", [{ id: item.channelId, pos: item.addedAt, data: item }]);
  }, [put]);
  const removeSub = useCallback((id) => { setSubs((s) => s.filter((x) => x.channelId !== id)); drop("subs", [id]); }, [drop]);
  const isSub = (id) => !!id && (R.current.subs || []).some((x) => x.channelId === id);
  const setSubsRaw = useCallback((list) => {
    const clean = (Array.isArray(list) ? list : [])
      .filter((x) => x && x.channelId)
      .slice(-CAPS.subs)
      .map((x) => ({ ...x, addedAt: x.addedAt || Date.now() }));
    setSubs(clean);
    put("subs", clean.map((x, i) => ({ id: x.channelId, pos: (x.addedAt || Date.now()) + i, data: x })));
  }, [put]);

  /* ── settings: cookie bootstrap + cloud row ──────────────────────────── */
  const updCfg = useCallback((patch) => {
    setCfg((c) => {
      const n = { ...c, ...patch };
      cookSet("sv_cfg", n, 3650);
      return n;
    });
    put("cfg", [{ id: "cfg", pos: 1, data: null }]);
  }, [put]);

  /* ── maintenance helpers used by Settings ────────────────────────────── */
  const reload = useCallback(() => load(cfgRef.current), [load]);
  const snapshot = useCallback(() => ({
    app: "streamvoid", version: 1, key: profileKey(), exportedAt: new Date().toISOString(), caps: CAPS,
    store: { history: R.current.hist, likes: R.current.favs, watchlater: R.current.wl, playlists: R.current.pls, subs: R.current.subs, cfg: R.current.cfg },
  }), []);
  const restore = useCallback(async (data) => {
    const store = (data && data.store) || data || {};
    const r = await apiSyncImport(cfgRef.current, profileKey(), store);
    if (r && r.ok === false) throw new Error(r.error || "import failed");
    await load(cfgRef.current);
    return r;
  }, [load]);
  const wipeAll = useCallback(async () => {
    setHist([]); setFavs([]); setWl([]); setPls([]); setSubs([]);
    q.current.map.clear();
    for (const k of ["history", "likes", "watchlater", "playlists", "subs"]) {
      try { await apiSyncClear(cfgRef.current, profileKey(), k); } catch { /* best effort */ }
    }
    setSync((s) => ({ ...s, state: baseOf(cfgRef.current) ? "ok" : "local", at: Date.now() }));
  }, []);

  return {
    hist, addHist, clrHist, rmHist, savePos, favs, togFav, isFav, wl, togWL, isWL, pls, mkPL, rmPL, addToPL, removeFromPL, isInPL,
    subs, addSub, removeSub, isSub, setSubsRaw, cfg, updCfg,
    sync, reload, snapshot, restore, wipeAll, profileKey, profileLink, caps: CAPS, cfg,
  };
}

/* ════════════════════════════════════════════════════════════════════════════
   CUSTOM PLAYER — YouTube-accurate chrome
   48px controls · double-tap skip · nested settings (speed / quality / zoom)
   ════════════════════════════════════════════════════════════════════════════ */
const SkipIco = ({ dir, size = 24 }) => (

        : "M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"}
    />
  </svg>

const ZOOM_MODES = [
  { k: "fit", l: "Fit to screen", d: "Poora video, letterbox ke saath" },
  { k: "fill", l: "Fill width", d: "Frame bhar do — kinare crop honge" },
  { k: "1.25", l: "Zoom 125%" },
  { k: "1.5", l: "Zoom 150%" },
  { k: "2", l: "Zoom 200%" },
];

/* Recovery memory lives outside the component: a refresh re-mounts the player,
   and the ladder must continue where it left off (stage, quality, position). */
const REC = { id: "", stage: 0, stable: false, qi: 0, at: 0 };

function CPlayer({ video, formats, st, onNext, poster, onRefresh }) {
  const wrapRef = useRef(null), vidRef = useRef(null), hideT = useRef(null);
  const tapT = useRef(null), tapAt = useRef(0);
  const [qi, setQi] = useState(REC.id && video && REC.id === video.videoId ? REC.qi || 0 : 0);
  const [playing, setPlaying] = useState(false);
  const [time, setTime] = useState(0), [dur, setDur] = useState(0), [buf, setBuf] = useState(0);
  const [vol, setVol] = useState(st.cfg.volume ?? 1), [muted, setMuted] = useState(!!st.cfg.muted);
  const [full, setFull] = useState(false), [theater, setTheater] = useState(!!st.cfg.theater);
  const [ui, setUi] = useState(true), [hoverX, setHoverX] = useState(null), [drag, setDrag] = useState(false);
  const [menu, setMenu] = useState(null), [rate, setRate] = useState(st.cfg.rate || 1);
  const [zoom, setZoom] = useState(st.cfg.zoom || "fit");
  const [pitch, setPitch] = useState(st.cfg.pitch !== false);
  const [waiting, setWaiting] = useState(true), [err, setErr] = useState(""), [flash, setFlash] = useState(null);
  const [skipFx, setSkipFx] = useState(null);
  const [recovering, setRecovering] = useState("");   // visible "self-healing" state
  const [stable, setStable] = useState(REC.id && video && REC.id === video.videoId ? !!REC.stable : false);
  const rec = useRef({ stage: REC.id && video && REC.id === video.videoId ? REC.stage || 0 : 0 });
  const tick = useRef({ t: 0, at: Date.now() });
  const lastEsc = useRef(0);
  const pendingSeek = useRef(REC.id && video && REC.id === video.videoId && REC.at > 0 ? REC.at : null);
  const refreshTries = useRef(0);
  const firstRender = useRef(true);
  const barRef = useRef(null);
  const histRef = useRef(st.hist || []); histRef.current = st.hist || [];

  const list = formats && formats.length ? formats : [];
  const cur = list[Math.min(qi, list.length - 1)];
  const stableSrc = stable && video && video.videoId && baseOf(st.cfg)
    ? `${baseOf(st.cfg)}/mp4/${video.videoId}.mp4${cur ? "?itag=" + cur.itag : ""}`
    : "";
  const src = stableSrc || (cur ? mediaUrl(st.cfg, cur.url) : "");

  useEffect(() => {
    if (firstRender.current) { firstRender.current = false; return; }
    const el = vidRef.current;
    if (!el) return;
    pendingSeek.current = el.currentTime || 0;
    setWaiting(true);
  }, [qi]);

  useEffect(() => { REC.qi = qi; }, [qi]);

  // a new video starts a new ladder; a re-mount (refresh) continues the old one
  useEffect(() => {
    const id = (video && video.videoId) || "";
    if (REC.id === id) return;
    REC.id = id; REC.stage = 0; REC.stable = false; REC.qi = 0; REC.at = 0;
    rec.current.stage = 0;
    setStable(false);
  }, [video && video.videoId]);

  useEffect(() => {
    const el = vidRef.current;
    if (!el) return;
    el.volume = muted ? 0 : vol;
    el.muted = muted;
    try { el.playbackRate = rate; } catch {}
    try {
      el.preservesPitch = pitch;
      el.mozPreservesPitch = pitch;
      el.webkitPreservesPitch = pitch;
    } catch {}
    st.updCfg({ volume: vol, muted, rate, zoom, pitch });
  }, [vol, muted, rate, zoom, pitch]);

  /* resume position: written every 5s, on pause and when the tab goes away */
  useEffect(() => {
    const el = vidRef.current;
    const id = video && video.videoId;
    if (!el || !id || typeof st.savePos !== "function") return;
    const persist = () => {
      if (el.currentTime > 3 && el.duration && isFinite(el.duration)) st.savePos(id, el.currentTime, el.duration);
    };
    const iv = setInterval(() => { if (!el.paused) persist(); }, 5000);
    el.addEventListener("pause", persist);
    el.addEventListener("ended", persist);
    window.addEventListener("pagehide", persist);
    return () => {
      clearInterval(iv);
      el.removeEventListener("pause", persist);
      el.removeEventListener("ended", persist);
      window.removeEventListener("pagehide", persist);
      if (!el.ended) persist();
    };
  }, [video && video.videoId]);

  useEffect(() => {
    const onFs = () => setFull(!!(document.fullscreenElement && wrapRef.current && document.fullscreenElement === wrapRef.current));
    document.addEventListener("fullscreenchange", onFs);
    return () => document.removeEventListener("fullscreenchange", onFs);
  }, []);

  const bump = useCallback(() => {
    setUi(true);
    clearTimeout(hideT.current);
    hideT.current = setTimeout(() => setUi(false), 3200);
  }, []);
  useEffect(() => { bump(); return () => { clearTimeout(hideT.current); clearTimeout(tapT.current); }; }, [bump]);

  const toggle = useCallback(() => {
    const el = vidRef.current;
    if (!el) return;
    if (el.paused || el.ended) { const p = el.play(); if (p && p.catch) p.catch(() => {}); setFlash("play"); }
    else { el.pause(); setFlash("pause"); }
    setTimeout(() => setFlash(null), 420);
    bump();
  }, [bump]);

  const seekTo = useCallback((t) => {
    const el = vidRef.current;
    if (!el || !isFinite(t)) return;
    const d = el.duration || dur;
    el.currentTime = Math.max(0, Math.min(d || t, t));
    setTime(el.currentTime);
    bump();
  }, [dur, bump]);

  const showSkip = useCallback((dir, secs = 10) => {
    setSkipFx({ dir, secs, id: Date.now() });
    clearTimeout(showSkip._t);
    showSkip._t = setTimeout(() => setSkipFx(null), 700);
  }, []);

  const skip = useCallback((s) => {
    const el = vidRef.current;
    seekTo((el?.currentTime || 0) + s);
    showSkip(s < 0 ? -1 : 1, Math.abs(s));
  }, [seekTo, showSkip]);

  const setV = (v) => { const nv = Math.max(0, Math.min(1, Number(v))); setVol(nv); setMuted(nv === 0); };

  const toggleFull = useCallback(() => {
    const w = wrapRef.current;
    if (!w) return;
    if (document.fullscreenElement) document.exitFullscreen?.();
    else {
      const p = w.requestFullscreen?.();
      if (p && p.catch) p.catch(() => {});
    }
  }, []);

  const toggleTheater = () => { const t = !theater; setTheater(t); st.updCfg({ theater: t }); };

  const bumpRate = useCallback((dir) => {
    setRate((r) => {
      const i = SPEEDS.indexOf(r);
      const at = i < 0 ? SPEEDS.indexOf(1) : i;
      return SPEEDS[Math.max(0, Math.min(SPEEDS.length - 1, at + dir))];
    });
    bump();
  }, [bump]);

  const cycleZoom = useCallback(() => {
    setZoom((z) => {
      const i = ZOOM_MODES.findIndex((x) => x.k === z);
      return ZOOM_MODES[(i + 1) % ZOOM_MODES.length].k;
    });
    bump();
  }, [bump]);

  const zoomLabel = (ZOOM_MODES.find((z) => z.k === zoom) || ZOOM_MODES[0]).l;
  const zoomStyle =
    zoom === "fit" ? { objectFit: "contain" }
      : zoom === "fill" ? { objectFit: "cover" }
        : { objectFit: "cover", transform: `scale(${Number(zoom) || 1})`, transformOrigin: "center center" };

  const shareVideo = async () => {
    const url = YTW(video.videoId);
    try {
      if (navigator.share) await navigator.share({ title: video.title, url });
      else { await navigator.clipboard.writeText(url); alert("Link copied"); }
    } catch {}
  };

  /* ── keyboard ──────────────────────────────────────────────────────────── */
  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || e.target.isContentEditable) return;
      const el = vidRef.current;
      if (!el) return;
      const k = e.key.toLowerCase();
      if (k === " " || k === "k") { e.preventDefault(); toggle(); }
      else if (k === "j") skip(-10);
      else if (k === "l") skip(10);
      else if (k === "arrowright") { e.preventDefault(); skip(5); }
      else if (k === "arrowleft") { e.preventDefault(); skip(-5); }
      else if (k === "arrowup") { e.preventDefault(); setV(vol + 0.1); }
      else if (k === "arrowdown") { e.preventDefault(); setV(vol - 0.1); }
      else if (k === "m") setMuted((m) => !m);
      else if (k === "f") toggleFull();
      else if (k === "t") toggleTheater();
      else if (k === "escape" && menu) setMenu(null);
      else if (k === ">" || k === ".") bumpRate(1);
      else if (k === "<" || k === ",") bumpRate(-1);
      else if (k === "z") cycleZoom();
      else if (k === "n" && onNext) onNext();
      else if (/^[0-9]$/.test(k)) seekTo(((el.duration || 0) * Number(k)) / 10);
      bump();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [toggle, skip, vol, onNext, bump, seekTo, bumpRate, cycleZoom, toggleFull, menu]);

  /* ── stage taps: 1 tap = play/pause, double tap = ±10s, centre = fullscreen ─ */
  const stageTap = (e) => {
    if (menu) { setMenu(null); return; }
    const stage = e.currentTarget;
    const r = stage.getBoundingClientRect ? stage.getBoundingClientRect() : { left: 0, width: 1 };
    const rel = ((e.clientX || 0) - r.left) / (r.width || 1);
    const now = Date.now();
    if (now - tapAt.current < 300) {
      clearTimeout(tapT.current);
      tapAt.current = 0;
      if (rel < 0.35) skip(-10);
      else if (rel > 0.65) skip(10);
      else toggleFull();
      return;
    }
    tapAt.current = now;
    clearTimeout(tapT.current);
    tapT.current = setTimeout(() => { toggle(); }, 250);
  };

  const pct = dur > 0 ? (time / dur) * 100 : 0;
  const bufPct = dur > 0 ? (buf / dur) * 100 : 0;
  const posFromEvent = (e) => {
    const b = barRef.current;
    if (!b) return 0;
    const r = b.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  };
  const fmtErr = (el) => {
    const c = el && el.error;
    if (!c) return "Playback error";
    if (c.code === 4) return "Format not supported by this browser";
    if (c.code === 2) return "Network error while loading the stream";
    if (c.code === 3) return "Stream decode error";
    return "Playback error (" + c.code + ")";
  };

  /* ── the "never stops" ladder ──────────────────────────────────────────────
     A stall or a dead signature walks through four self-heals before the UI is
     allowed to show an error. Position is carried across every step.
       0 → nudge the element (reload same URL, keep position)
       1 → drop to the next (lower) quality
       2 → ask the page to re-resolve the whole video (fresh signed URLs)
       3 → switch to /mp4/<id>.mp4?itag= — no signature, resolves per request
       4 → only now: show the error panel                                  */
  const escalate = useCallback((why) => {
    if (st.cfg.autoRecover === false) { setErr(fmtErr(vidRef.current)); setWaiting(false); return; }
    const el = vidRef.current;
    const at = (el && el.currentTime) || 0;
    const stage = rec.current.stage;
    rec.current.stage = stage + 1;
    REC.stage = rec.current.stage;
    REC.at = at;
    pendingSeek.current = at;
    if (stage === 0) {
      setRecovering("Reconnecting…");
      try { if (el) el.load(); } catch {}
      return;
    }
    if (stage === 1 && list.length > 1 && qi < list.length - 1) {
      setRecovering("Lower quality…");
      setQi((i) => Math.min(i + 1, list.length - 1));
      return;
    }
    if (stage === 2 && onRefresh) {
      setRecovering("Fresh stream…");
      refreshTries.current += 1;
      onRefresh();
      return;
    }
    if (stage === 3 && video && video.videoId && baseOf(st.cfg)) {
      setRecovering("Stable stream…");
      REC.stable = true;
      setStable(true);
      return;
    }
    setRecovering("");
    setErr(fmtErr(vidRef.current) || "Stream ruk gaya");
    setWaiting(false);
  }, [list.length, qi, onRefresh, video, st.cfg]);

  // stall watchdog: no progress while playing for ~9s = escalate (once per stall)
  useEffect(() => {
    const iv = setInterval(() => {
      const el = vidRef.current;
      if (!el) return;
      const now = Date.now();
      if (el.paused || el.ended) { tick.current = { t: el.currentTime || 0, at: now }; return; }
      if ((el.currentTime || 0) > tick.current.t + 0.3) {
        tick.current = { t: el.currentTime, at: now };
        if (rec.current.stage) { rec.current.stage = 0; setRecovering(""); }
        return;
      }
      if (now - tick.current.at > 9000 && now - lastEsc.current > 14000) {
        lastEsc.current = now;
        tick.current.at = now;
        escalate("stall");
      }
    }, 2000);
    return () => clearInterval(iv);
  }, [escalate]);

  // back online / back on the tab → pick the stream back up by itself
  useEffect(() => {
    const resume = () => {
      const el = vidRef.current;
      if (!el) return;
      if (err) { rec.current.stage = Math.min(rec.current.stage, 1); escalate("reconnect"); return; }
      if (el.paused && !el.ended && st.cfg.autoplay) { const pr = el.play(); if (pr && pr.catch) pr.catch(() => {}); }
    };
    const onVis = () => { if (!document.hidden) resume(); };
    window.addEventListener("online", resume);
    document.addEventListener("visibilitychange", onVis);
    return () => { window.removeEventListener("online", resume); document.removeEventListener("visibilitychange", onVis); };
  }, [err, escalate, st.cfg.autoplay]);

  // a stalled element that never fires 'playing' still gets caught
  useEffect(() => {
    const el = vidRef.current;
    if (!el) return;
    const onStall = () => {
      tick.current = { t: el.currentTime || 0, at: Date.now() };
      const t = setTimeout(() => {
        if (!vidRef.current) return;
        if (el.paused || el.ended) return;
        if ((el.currentTime || 0) <= tick.current.t + 0.3) escalate("stalled");
      }, 9000);
      return t;
    };
    let timer = null;
    const h = () => { clearTimeout(timer); timer = onStall(); };
    el.addEventListener("stalled", h);
    el.addEventListener("waiting", h);
    return () => { clearTimeout(timer); el.removeEventListener("stalled", h); el.removeEventListener("waiting", h); };
  }, [escalate, src]);
  const hideUI = !ui && playing && !menu;

  return (
    <div className={"cp" + (ui ? "" : " cp-hide-cursor")} ref={wrapRef} tabIndex={0}
      onMouseMove={bump} onMouseLeave={() => { setUi(false); setMenu(null); }}>

      <video
        ref={vidRef} src={src} poster={poster} playsInline preload="metadata" controls={false}
        style={zoomStyle}
        onPlay={() => { setPlaying(true); refreshTries.current = 0; }}
        onPause={() => setPlaying(false)}
        onTimeUpdate={(e) => setTime(e.currentTarget.currentTime)}
        onDurationChange={(e) => setDur(e.currentTarget.duration || 0)}
        onLoadedMetadata={(e) => {
          setDur(e.currentTarget.duration || 0);
          setTime(e.currentTarget.currentTime || 0);
          setWaiting(false);
          let resume = pendingSeek.current;
          if (resume == null) {
            const saved = (histRef.current || []).find((x) => x.videoId === video.videoId);
            const total = e.currentTarget.duration || (saved && saved.dur) || 0;
            if (saved && saved.pos > 5 && (!total || saved.pos < total - 10)) resume = saved.pos;
          }
          if (resume != null) { try { e.currentTarget.currentTime = resume; } catch {} pendingSeek.current = null; }
          if (st.cfg.autoplay) { const p = e.currentTarget.play(); if (p && p.catch) p.catch(() => {}); }
        }}
        onProgress={(e) => { const b = e.currentTarget.buffered; if (b.length) setBuf(b.end(b.length - 1)); }}
        onWaiting={() => setWaiting(true)}
        onPlaying={() => {
          setWaiting(false); setErr(""); setRecovering("");
          rec.current.stage = 0; REC.stage = 0; REC.at = 0;
          tick.current = { t: vidRef.current?.currentTime || 0, at: Date.now() };
        }}
        onCanPlay={() => setWaiting(false)}
        onEnded={() => {
          setPlaying(false);
          if (!st.cfg.autoplay) return;
          if (onNext) { onNext(); return; }
          // nothing left to play → loop this one instead of stopping dead
          if (st.cfg.endless !== false) {
            const el = vidRef.current;
            if (el) { try { el.currentTime = 0; const pr = el.play(); if (pr && pr.catch) pr.catch(() => {}); } catch {} }
          }
        }}
        onError={() => {
          // a dead stream is a ladder, not an error: nudge → quality → refresh → stable URL
          pendingSeek.current = vidRef.current?.currentTime || pendingSeek.current || 0;
          setWaiting(true); setErr("");
          escalate("error");
        }}
      />

      {/* tap layer: single / double tap behaviour */}
      <div className="cp-stage" onClick={stageTap} />

      {/* double-tap ripple */}
      {skipFx && (
        <div className={"cp-skip-fx " + (skipFx.dir < 0 ? "left" : "right")} key={skipFx.id}>
          <div className="cp-skip-ring">
            <SkipIco dir={skipFx.dir} size={34} />
          </div>
          <div className="cp-skip-txt">{skipFx.secs} seconds</div>
        </div>
      )}

      {/* top gradient: title + actions */}
      <div className={"cp-top" + (hideUI ? " hidden" : "")}>
        <div className="cp-title">{video.title}</div>
        <div className="cp-top-actions">
          <button className="cp-top-btn" title="Save to Watch later" onClick={(e) => { e.stopPropagation(); st.togWL(video); }}>
            <Icon d={I.save} size={22} />
          </button>
          <button className="cp-top-btn" title="Share" onClick={(e) => { e.stopPropagation(); shareVideo(); }}>
            <Icon d={I.share} size={22} />
          </button>
          <a className="cp-top-btn" href={YTW(video.videoId)} target="_blank" rel="noreferrer" title="Open on YouTube">
            <Icon d={I.more} size={22} />
          </a>
        </div>
      </div>

      {waiting && !err && <div className="cp-big"><div className="cp-spin" /></div>}

      {recovering && (
        <div className="cp-recover" role="status">
          <span className="cp-recover-dot" />
          <span>{recovering} <span style={{ opacity: 0.6 }}>auto-fix</span></span>
        </div>
      )}

      {!playing && !waiting && !err && (
        <div className="cp-big">
          <button className="cp-bigplay" onClick={(e) => { e.stopPropagation(); toggle(); }} aria-label="Play">
            <Icon d={I.play} size={40} />
          </button>
        </div>
      )}
      {flash && <div className="cp-big"><div className="cp-big-icon"><Icon d={flash === "play" ? I.play : I.pause} /></div></div>}

      {err && (
        <div className="cp-err" onClick={(e) => e.stopPropagation()}>
          <Icon d={I.warn} size={34} cls="pl-ico-svg" />
          <div style={{ fontSize: 16, fontWeight: 500, color: "#fff" }}>Video play nahi ho paya</div>
          <div style={{ fontSize: 13, color: "#aaa", maxWidth: 420, lineHeight: 1.6 }}>{err}</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", justifyContent: "center" }}>
            <button className="cp-pill" onClick={() => { setErr(""); setWaiting(true); vidRef.current?.load(); }}>Retry</button>
            {list.length > 1 && <button className="cp-pill ghost" onClick={() => setQi((qi + 1) % list.length)}>Try another quality</button>}
            <a className="cp-pill ghost" href={YTW(video.videoId)} target="_blank" rel="noreferrer">Open on YouTube</a>
          </div>
        </div>
      )}

      {/* ── bottom chrome ─────────────────────────────────────────────────── */}
      <div className={"cp-ui" + (hideUI ? " hidden" : "")} onClick={(e) => e.stopPropagation()}>
        <div className="cp-bar" ref={barRef}
          onMouseMove={(e) => setHoverX(posFromEvent(e))} onMouseLeave={() => setHoverX(null)}
          onPointerDown={(e) => { try { e.currentTarget.setPointerCapture?.(e.pointerId); } catch {} setDrag(true); seekTo(posFromEvent(e) * dur); }}
          onPointerMove={(e) => { if (drag) seekTo(posFromEvent(e) * dur); }}
          onPointerUp={(e) => { setDrag(false); seekTo(posFromEvent(e) * dur); }}>
          <div className="cp-bar-track">
            <div className="cp-buf" style={{ width: bufPct + "%" }} />
            <div className="cp-played" style={{ width: pct + "%" }} />
            <div className="cp-knob" style={{ left: pct + "%" }} />
          </div>
          {hoverX != null && <div className="cp-tip" style={{ left: hoverX * 100 + "%" }}>{fd(hoverX * dur)}</div>}
        </div>

        <div className="cp-row">
          <button className="cp-btn" onClick={() => skip(-10)} title="Back 10s (j)"><SkipIco dir={-1} /></button>
          <button className="cp-btn cp-btn-main" onClick={toggle} title={playing ? "Pause (k)" : "Play (k)"}>
            <Icon d={playing ? I.pause : I.play} size={26} />
          </button>
          <button className="cp-btn" onClick={() => skip(10)} title="Forward 10s (l)"><SkipIco dir={1} /></button>
          {onNext && <button className="cp-btn" onClick={onNext} title="Next (n)"><Icon d={I.next} size={24} /></button>}

          <div className="cp-vol-wrap">
            <button className="cp-btn" onClick={() => setMuted(!muted)} title="Mute (m)"><Icon d={muted || vol === 0 ? I.mute : I.vol} size={24} /></button>
            <div className="cp-vol"><input type="range" min="0" max="1" step="0.02" value={muted ? 0 : vol} onChange={(e) => setV(e.target.value)} aria-label="Volume" /></div>
          </div>

          <span className="cp-time">{fd(time)} <span className="cp-time-sep">/</span> {fd(dur)}</span>

          {rate !== 1 && <span className="cp-badge">{rate}×</span>}
          {zoom !== "fit" && <span className="cp-badge">{zoom === "fill" ? "Fill" : zoom + "×"}</span>}

          <div className="cp-spacer" />

          <button className={"cp-btn" + (menu ? " on" : "")} onClick={() => setMenu(menu ? null : "main")} title="Settings">
            <Icon d={I.gear} size={24} />
          </button>
          <button className="cp-btn" onClick={cycleZoom} title={"Zoom: " + zoomLabel + " (z)"}><Icon d={I.zoom} size={23} /></button>
          <button className="cp-btn" onClick={toggleTheater} title="Theater (t)"><Icon d={I.theater} size={24} /></button>
          <button className="cp-btn" onClick={toggleFull} title="Fullscreen (f)"><Icon d={full ? I.fsExit : I.fs} size={24} /></button>
        </div>

        {/* ── settings panel (YouTube-style, nested) ──────────────────────── */}
        {menu && (
          <div className="cp-menu" onClick={(e) => e.stopPropagation()}>
            {menu === "main" && (
              <>
                <div className="cp-menu-title">Settings</div>
                <button className="cp-mi" onClick={() => setMenu("speed")}>
                  <span className="cp-mi-lbl">Playback speed</span>
                  <span className="cp-mi-val">{rate === 1 ? "Normal" : rate + "×"}</span>
                </button>
                <button className="cp-mi" onClick={() => setMenu("quality")}>
                  <span className="cp-mi-lbl">Quality</span>
                  <span className="cp-mi-val">{cur ? cur.quality : "Auto"}</span>
                </button>
                <button className="cp-mi" onClick={() => setMenu("zoom")}>
                  <span className="cp-mi-lbl">Zoom</span>
                  <span className="cp-mi-val">{zoomLabel}</span>
                </button>
                <button className="cp-mi" onClick={() => setPitch((v) => !v)}>
                  <span className="cp-mi-lbl">Preserve pitch</span>
                  <span className="cp-switch" data-on={pitch ? "1" : "0"}><span className="cp-switch-dot" /></span>
                </button>
                <div className="cp-menu-foot">&lt; &gt; speed · z zoom · j/l ±10s</div>
              </>
            )}

            {menu === "speed" && (
              <>
                <div className="cp-menu-head">
                  <button className="cp-back" onClick={() => setMenu("main")} aria-label="Back">←</button>
                  <span>Playback speed</span>
                </div>
                <div className="cp-speed-grid">
                  {SPEEDS.map((r) => (
                    <button key={r} className={"cp-speed" + (r === rate ? " sel" : "")} onClick={() => setRate(r)}>
                      {r === 1 ? "Normal" : r + "×"}
                    </button>
                  ))}
                </div>
                <button className="cp-mi" onClick={() => setPitch((v) => !v)}>
                  <span className="cp-mi-lbl">Preserve pitch</span>
                  <span className="cp-switch" data-on={pitch ? "1" : "0"}><span className="cp-switch-dot" /></span>
                </button>
                <div className="cp-menu-foot">{pitch ? "Awaaz natural rahegi har speed par" : "Varispeed — pitch bhi badhega"}</div>
              </>
            )}

            {menu === "quality" && (
              <>
                <div className="cp-menu-head">
                  <button className="cp-back" onClick={() => setMenu("main")} aria-label="Back">←</button>
                  <span>Quality</span>
                </div>
                <button className={"cp-mi" + (qi === 0 ? " sel" : "")} onClick={() => { setQi(0); setMenu("main"); }}>
                  {qi === 0 ? <Icon d={I.check} size={18} /> : <span className="cp-check-space" />}
                  <span className="cp-mi-lbl">Auto <span className="cp-mi-sub">{cur ? cur.quality : ""}</span></span>
                </button>
                {list.map((f, i) => (
                  <button key={f.itag || i} className={"cp-mi" + (i === qi ? " sel" : "")} onClick={() => { setQi(i); setMenu("main"); }}>
                    {i === qi ? <Icon d={I.check} size={18} /> : <span className="cp-check-space" />}
                    <span className="cp-mi-lbl">{f.quality}{f.itag ? <span className="cp-mi-sub">itag {f.itag}</span> : null}</span>
                  </button>
                ))}
                <div className="cp-menu-foot">{list.length} muxed stream{list.length === 1 ? "" : "s"} available</div>
              </>
            )}

            {menu === "zoom" && (
              <>
                <div className="cp-menu-head">
                  <button className="cp-back" onClick={() => setMenu("main")} aria-label="Back">←</button>
                  <span>Zoom</span>
                </div>
                {ZOOM_MODES.map((z) => (
                  <button key={z.k} className={"cp-mi" + (z.k === zoom ? " sel" : "")} onClick={() => { setZoom(z.k); setMenu("main"); }}>
                    {z.k === zoom ? <Icon d={I.check} size={18} /> : <span className="cp-check-space" />}
                    <span className="cp-mi-lbl">{z.l}{z.d ? <span className="cp-mi-sub">{z.d}</span> : null}</span>
                  </button>
                ))}
                <div className="cp-menu-foot">z key se cycle karein</div>
              </>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════

function AddSubModal({ st, engine, onClose, onAdded }) {
  const [q, setQ] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [found, setFound] = useState(null);

  const lookup = async () => {
    const val = q.trim();
    if (!val) return;
    if (engine !== "ok") { setErr("Engine connect nahi hai — pehle worker URL set karein."); return; }
    setBusy(true); setErr(""); setFound(null);
    try {
      const r = await apiChannel(st.cfg, val);
      if (!r || !r.channelId) throw new Error("channel nahi mila");
      setFound(r);
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };
  const save = () => {
    if (!found) return;
    st.addSub(found);
    onAdded && onAdded(found);
    onClose();
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h3>Subscribe to a channel</h3>
        <p>Channel URL, @handle, ya <code>UC…</code> id paste karein. Videos channel feed se aayengi — koi login nahi, koi notification nahi.</p>
        <input autoFocus placeholder="https://youtube.com/@LofiGirl  ·  @mkbhd  ·  UCxxxxxxx" value={q}
          onChange={(e) => setQ(e.target.value)} onKeyDown={(e) => e.key === "Enter" && lookup()} />
        <div className="modal-err">{err}</div>
        {found && (
          <div className="sub-row" style={{ borderBottom: "none" }}>
            <Av name={found.name} src={found.avatar} size={40} />
            <div><div className="sr-name">{found.name || found.channelId}</div><div className="sr-id">{found.channelId}</div></div>
          </div>
        )}
        <div className="modal-row">
          <button className="btn-ghost" onClick={onClose}>Cancel</button>
          {!found && <button className="btn-pri" disabled={busy} onClick={lookup}>{busy ? "Looking up…" : "Find channel"}</button>}
          {found && <button className="btn-pri" onClick={save}>Subscribe</button>}
        </div>
      </div>
    </div>
  );
}

function EngineBar({ status, onSetup }) {
  if (status === "ok") return null;
  return (
    <div className="engine-bar">
      <span className="warn-ico">
        {status === "checking" ? <span className="cp-spin" style={{ width: 18, height: 18, borderWidth: 2 }} /> : <Icon d={I.warn} size={18} />}
      </span>
      <div style={{ flex: 1, minWidth: 200 }}>
        <div className="engine-bar-t">{status === "checking" ? "Engine check ho raha hai…" : "YouTube engine connected nahi hai"}</div>
        <div className="engine-bar-s">Search/playback ke liye worker.js deploy karke URL daalein</div>
      </div>
      <button className="engine-bar-btn" onClick={onSetup}>Setup</button>
    </div>
  );
}

function SetupGate({ st, onRetry, busy }) {
  const [url, setUrl] = useState(st.cfg.engineUrl || "");
  const [key, setKey] = useState(st.cfg.accessKey || "");
  const [copied, setCopied] = useState("");
  const copyWorker = async () => {
    try {
      const r = await fetch("./worker.js");
      await navigator.clipboard.writeText(await r.text());
      setCopied("Worker code copied — Cloudflare → Workers → paste → Deploy");
    } catch { setCopied("Copy nahi hua — repo me worker.js se manually copy karein"); }
  };
  return (
    <div className="setup">
      <div className="setup-card">
        <div className="setup-badge">ONE-TIME SETUP · 2 MIN</div>
        <h1 className="setup-h1">YouTube engine connect karein</h1>
        <p className="setup-p">Browser se YouTube direct nahi khulta (CORS + IP-bound URLs). Ek <b>Cloudflare Worker</b> ye handle karta hai — free, serverless.</p>
        <ol className="setup-steps">
          <li><a href="https://dash.cloudflare.com/?to=/:account/workers-and-pages" target="_blank" rel="noreferrer">dash.cloudflare.com</a> → Workers &amp; Pages → <b>Create Worker</b></li>
          <li><button className="setup-link" onClick={copyWorker}>worker.js copy karein</button> → paste → <b>Deploy</b></li>
          <li>Worker URL yahan daalein</li>
        </ol>
        {copied && <div className="setup-note ok">{copied}</div>}
        <div className="setup-row">
          <input className="setup-input" type="password" placeholder="Access key (only if SV_KEY set)" value={key}
            onChange={(e) => setKey(e.target.value)} onKeyDown={(e) => e.key === "Enter" && st.updCfg({ accessKey: key.trim() })} />
        </div>
        <div className="setup-row">
          <input className="setup-input" placeholder="https://your-worker.workers.dev" value={url}
            onChange={(e) => setUrl(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && st.updCfg({ engineUrl: url.trim(), accessKey: key.trim() })} />
          <button className="setup-btn" disabled={busy} onClick={() => st.updCfg({ engineUrl: url.trim(), accessKey: key.trim() })}>
            {busy ? "Checking…" : "Connect"}
          </button>
        </div>
        <div className="setup-row" style={{ justifyContent: "space-between" }}>
          <button className="setup-link" onClick={onRetry}>↻ Retry</button>
          <a className="setup-link" href="./worker.js" target="_blank" rel="noreferrer">View worker.js</a>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════

const CHIPS = ["All", "Music", "Gaming", "Live", "News", "Sports", "Learning", "Movies", "Podcasts", "Cricket", "Comedy", "Science", "Technology", "Cooking", "Travel"];
const CHIP_QUERY = {
  Music: "music", Gaming: "gaming", Live: "live news", News: "news today", Sports: "sports highlights",
  Learning: "learn something new", Movies: "movie trailers", Podcasts: "podcast", Cricket: "cricket highlights",
  Comedy: "standup comedy", Science: "science documentary", Technology: "tech review", Cooking: "recipe", Travel: "travel vlog",
};

function HomePage({ onPlay, st, engine, onChannel, onShorts, onSearch, trending }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [warn, setWarn] = useState("");
  const [chip, setChip] = useState("All");
  const [nonce, setNonce] = useState(0);
  const [region, setRegion] = useState(st.cfg.region || "IN");

  useEffect(() => {
    let dead = false;
    setLoading(true); setWarn("");
    (async () => {
      if (engine !== "ok") { if (!dead) { setItems([]); setLoading(false); } return; }
      try {
        let list;
        if (chip === "All") {
          const d = await apiTrending(st.cfg, region);
          list = d.items || [];
        } else {
          const d = await apiSearch(st.cfg, CHIP_QUERY[chip] || chip);
          list = d.items || [];
          if (chip === "Live") list = list.filter((v) => v.live);
        }
        if (!dead) setItems(list);
      } catch (e) { if (!dead) setWarn(e.message); }
      if (!dead) setLoading(false);
    })();
    return () => { dead = true; };
  }, [chip, nonce, engine, st.cfg.engineUrl, region]);

  const head = trending ? <div className="search-top"><span className="search-top-t">Trending</span>
    <span className="chip" style={{ background: "var(--bg3)", color: "var(--t2)" }}>{region === "IN" ? "India" : region}</span></div> : null;

  const grid = (list) => (
    <div className="vgrid">
      {list.map((v, i) => (
        <div key={v.videoId || i} style={{ animationDelay: `${Math.min(i, 16) * 0.02}s` }}>
          <VCard v={v} onPlay={onPlay} st={st} onChannel={onChannel} />
        </div>
      ))}
    </div>
  );

  return (
    <div>
      {head}
      <div className="chips-bar">
        {CHIPS.map((c) => <button key={c} className={"chip" + (chip === c ? " act" : "")} onClick={() => setChip(c)}>{c}</button>)}
      </div>
      {warn && (
        <div className="inline-warn"><span className="warn-ico"><Icon d={I.warn} size={18} /></span><span style={{ flex: 1 }}>{warn}</span>
          <button className="cp-pill" onClick={() => setNonce((n) => n + 1)}>Retry</button></div>
      )}
      {chip === "All" && <RecShelf st={st} engine={engine} onPlay={onPlay} />}
      {loading ? <Skels /> : items.length === 0 ? (
        <div className="err-box"><div className="err-ico"><Icon d={I.feedback} size={40} /></div><div className="err-msg">Kuch nahi mila — engine connect karein ya chips try karein</div></div>
      ) : (
        <>
          {grid(items.slice(0, 8))}
          {chip === "All" && <ShortsShelf st={st} engine={engine} onOpen={() => onShorts()} />}
          {items.length > 8 && grid(items.slice(8))}
        </>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   SUBSCRIPTIONS (RSS)

function SubsPage({ st, engine, onPlay, onChannel, onAddSub, refreshKey }) {
  const [feed, setFeed] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");
  const [nonce, setNonce] = useState(0);
  const ids = useMemo(() => st.subs.map((s) => s.channelId), [st.subs]);

  useEffect(() => {
    let dead = false;
    if (!ids.length) { setFeed({ items: [], channels: [], errors: [] }); setLoading(false); return; }
    if (engine !== "ok") { setErr("engine-offline"); setLoading(false); return; }
    setLoading(true); setErr("");
    apiRss(st.cfg, ids)
      .then((d) => {
        if (dead) return;
        setFeed(d);
        setLoading(false);
        // keep channel names/avatars fresh
        (d.channels || []).forEach((ch) => {
          const local = st.subs.find((s) => s.channelId === ch.channelId);
          if (local && ch.name && (local.name !== ch.name || !local.avatar)) {
            st.setSubsRaw(st.subs.map((s) => (s.channelId === ch.channelId ? { ...s, name: ch.name || s.name } : s)));
          }
        });
      })
      .catch((e) => { if (!dead) { setErr(e.message); setLoading(false); } });
    return () => { dead = true; };
  }, [ids.join(","), engine, st.cfg.engineUrl, nonce, refreshKey]);

  const grouped = useMemo(() => {
    const groups = [];
    const map = new Map();
    (feed && feed.items ? feed.items : []).forEach((v) => {
      const k = dayKey(v.published);
      if (!map.has(k)) { map.set(k, []); groups.push(k); }
      map.get(k).push(v);
    });
    return groups.map((k) => ({ day: k, items: map.get(k) }));
  }, [feed]);

  const itemById = useMemo(() => {
    const m = new Map();
    (feed && feed.items ? feed.items : []).forEach((v) => { if (v.authorId) m.set(v.videoId, v); });
    return m;
  }, [feed]);

  return (
    <div>
      <div className="ch-rail">
        {st.subs.map((s) => {
          const name = s.name || s.channelId;
          return (
            <div key={s.channelId} className="ch-card" onClick={() => onChannel(s.channelId, name)}>
              <div className="ch-av">{s.avatar ? <img src={s.avatar} alt="" onError={(e) => { e.currentTarget.remove(); }} /> : (name || "?")[0].toUpperCase()}</div>
              <div className="ch-name" title={name}>{name}</div>
            </div>
          );
        })}
        <div className="ch-card new" onClick={onAddSub}>
          <div className="ch-av">＋</div>
          <div className="ch-name">Add channel</div>
        </div>
      </div>

      <div className="sub-head">
        <h2>Subscriptions</h2>
        <div className="sub-actions">
          <button className="sub-chip" onClick={() => setNonce((n) => n + 1)}>↻ Refresh</button>
          <a className="sub-chip" href={YTW("")} onClick={(e) => e.preventDefault()} style={{ display: "none" }} />
          <button className="sub-chip pri" onClick={onAddSub}>＋ Subscribe</button>
        </div>
      </div>

      {err === "engine-offline" && <div className="inline-warn" style={{ marginTop: 8 }}><span className="warn-ico"><Icon d={I.warn} size={18} /></span><span>Engine connect karein — channel feeds worker se aati hain</span></div>}
      {err && err !== "engine-offline" && (
        <div className="inline-warn" style={{ marginTop: 8 }}><span className="warn-ico"><Icon d={I.warn} size={18} /></span><span style={{ flex: 1 }}>{err}</span>
          <button className="cp-pill" onClick={() => setNonce((n) => n + 1)}>Retry</button></div>
      )}
      {feed && feed.errors && feed.errors.length > 0 && (
        <div className="inline-warn" style={{ marginTop: 8 }}>
          <span className="warn-ico"><Icon d={I.warn} size={18} /></span><span style={{ flex: 1 }}>{feed.errors.length} channel feed(s) load nahi hui — baaki dikha rahe hain</span>
        </div>
      )}

      {!st.subs.length ? (
        <div className="lib-empty">
          <div className="lib-empty-ico"><Icon d={I.rss} size={54} /></div>
          <div className="lib-empty-title">Koi subscription nahi</div>
          <div className="lib-empty-sub">Channel add karein — unki nayi videos yahan aayengi, bina login ke</div>
          <button className="btn-pri" onClick={onAddSub}>＋ Subscribe to a channel</button>
        </div>
      ) : loading ? <Skels n={8} /> : (
        <>
          {grouped.map((g) => (
            <div key={g.day}>
              <div className="day-head">{g.day}</div>
              <div className="vlist" style={{ padding: "0 24px" }}>
                {g.items.map((v) => (
                  <div key={v.videoId} className="lib-row">
                    <VCard v={v} onPlay={onPlay} layout="list" st={st} onChannel={onChannel} />
                    <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", paddingTop: 12, gap: 4 }}>
                      <span className="sr-id" style={{ fontSize: 11, color: "var(--t3)" }}>{ago(v.published)}</span>
                      {v.viewCount > 0 && <span className="sr-id" style={{ fontSize: 11, color: "var(--t3)" }}>{fv(v.viewCount)} views</span>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

function ShortCard({ v, idx, active, muted, data, st, onChannel, onAddSub, onOpenWatch, onLike, onToggleMute, cardRef }) {
  const vidRef = useRef(null);
  const meta = { ...v, ...((data && data.video) || {}) };
  const subscribed = st.isSub(meta.authorId);
  const fav = st.isFav(v.videoId);
  const share = async () => {
    const url = YTW(v.videoId);
    try {
      if (navigator.share) await navigator.share({ title: meta.title, url });
      else { await navigator.clipboard.writeText(url); alert("Link copied"); }
    } catch {}
  };
  return (
    <div className="short-card" data-idx={idx} ref={cardRef}>
      <div className="short-stage">
        {data && data.src ? (
          <video
            ref={vidRef}
            className="short-video"
            src={data.src}
            poster={v.thumbnail}
            loop
            playsInline
            muted={muted || !active}
            autoPlay={active}
            preload={Math.abs(idx - active) <= 1 ? "auto" : "none"}
            onClick={() => { const el = vidRef.current; if (!el) return; if (el.paused) el.play().catch(() => {}); else el.pause(); }}
          />
        ) : (
          <img className="short-poster" src={v.thumbnail} alt="" />
        )}
        {data && data.status === "loading" && <div className="short-spin" />}
        {data && data.status === "error" && (
          <div className="short-err">
            <div>Stream nahi mila</div>
            <a href={YTW(v.videoId)} target="_blank" rel="noreferrer" className="cp-pill">Open on YouTube</a>
          </div>
        )}

        <div className="short-ov">
          <div className="short-who">
            <button className="short-av" onClick={() => meta.authorId && onChannel(meta.authorId, meta.author)} title={meta.author}>
              <Av name={meta.author} src={meta.avatar} size={38} />
            </button>
            <div className="short-txt">
              <div className="short-ch">{meta.author || "Shorts"}</div>
              <div className="short-title">{meta.title}</div>
              {meta.viewCount > 0 && <div className="short-views">{fv(meta.viewCount)} views</div>}
            </div>
            <button
              className={"sub-btn short-sub" + (subscribed ? " on" : "")}
              onClick={() => {
                if (subscribed) st.removeSub(meta.authorId);
                else if (meta.authorId) st.addSub({ channelId: meta.authorId, name: meta.author });
                else onAddSub();
              }}
            >
              {subscribed ? "Subscribed" : "Subscribe"}
            </button>
          </div>
        </div>

        <div className="short-side">
          <button className={"short-btn" + (fav ? " on" : "")} title="Like" onClick={() => onLike(meta)}>
            <Icon d={I.like} size={22} />
          </button>
          <button className="short-btn" title={muted ? "Unmute" : "Mute"} onClick={() => onToggleMute()}>
            <Icon d={muted ? I.mute : I.vol} size={22} />
          </button>
          <button className="short-btn" title="Watch page" onClick={() => onOpenWatch(meta)}>
            <Icon d={I.play} size={22} />
          </button>
          <button className="short-btn" title="Share" onClick={share}>
            <Icon d={I.share} size={20} />
          </button>
        </div>
      </div>
    </div>
  );
}

function ShortsPage({ st, engine, onPlay, onChannel, onAddSub }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [warn, setWarn] = useState("");
  const [active, setActive] = useState(0);
  const [muted, setMuted] = useState(true);
  const [nonce, setNonce] = useState(0);
  const [data, setData] = useState({});   // videoId -> {status, src, video}
  const [mode, setMode] = useState("streamvoid");   // streamvoid | shortsfire
  const feedRef = useRef(null);
  const cardRefs = useRef([]);

  useEffect(() => {
    let dead = false;
    setLoading(true); setWarn(""); setActive(0); setData({});
    if (engine !== "ok") {
      if (!dead) { setItems([]); setLoading(false); if (engine === "down") setWarn("Engine connect nahi hai — Settings me worker URL daalein"); }
      return () => { dead = true; };
    }
    apiShorts(st.cfg, st.cfg.region)
      .then((d) => {
        if (dead) return;
        const list = d.items || [];
        setItems(list);
        if (!list.length) setWarn("Shorts nahi mile — Retry karein");
      })
      .catch((e) => { if (!dead) setWarn(e.message); })
      .then(() => { if (!dead) setLoading(false); });
    return () => { dead = true; };
  }, [engine, st.cfg.engineUrl, st.cfg.region, nonce]);

  // resolve the current card (+1 so the next swipe is instant)
  useEffect(() => {
    if (engine !== "ok") return;
    let dead = false;
    [active, active + 1].forEach((i) => {
      const v = items[i];
      if (!v) return;
      setData((d) => (d[v.videoId] ? d : { ...d, [v.videoId]: { status: "loading" } }));
      apiPlayer(st.cfg, v.videoId)
        .then((p) => {
          if (dead) return;
          const ok = p && p.ok && (p.formats || []).length;
          setData((d) => ({ ...d, [v.videoId]: ok ? { status: "ready", src: p.formats[0].url, video: p.video || {} } : { status: "error" } }));
        })
        .catch(() => { if (!dead) setData((d) => ({ ...d, [v.videoId]: { status: "error" } })); });
    });
    return () => { dead = true; };
  }, [active, items, engine, st.cfg.engineUrl]);

  // play the active one, pause the rest
  useEffect(() => {
    const feed = feedRef.current;
    if (!feed) return;
    const vids = feed.querySelectorAll("video");
    vids.forEach((el) => {
      const card = el.closest(".short-card");
      const on = card && Number(card.dataset.idx) === active;
      if (on) {
        el.muted = muted;
        const pr = el.play && el.play();
        if (pr && pr.catch) pr.catch(() => {});
      } else {
        try { el.pause(); el.currentTime = 0; } catch {}
      }
    });
  }, [active, muted, data, items]);

  const scrollTo = useCallback((i) => {
    const el = cardRefs.current[i];
    if (el && el.scrollIntoView) { try { el.scrollIntoView({ behavior: "smooth", block: "start" }); } catch {} }
  }, []);

  const step = useCallback((dir) => {
    setActive((i) => {
      const n = Math.max(0, Math.min(items.length - 1, i + dir));
      scrollTo(n);
      return n;
    });
  }, [items.length, scrollTo]);

  // switching to the embedded site must not leave a hidden Short playing audio
  useEffect(() => {
    if (mode === "streamvoid") return;
    const vids = document.querySelectorAll(".short-video");
    for (const v of vids) { try { v.pause(); } catch {} }
  }, [mode]);

  useEffect(() => {
    const h = (e) => {
      if (mode !== "streamvoid") return;                      // iframe owns the keyboard
      if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); step(1); }
      else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); step(-1); }
      else if (e.key === "m") setMuted((m) => !m);
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [step, mode]);

  const cur = items[active];

  return (
    <div className="shorts-wrap">
      <div className="shorts-head">
        <div className="shorts-h-title"><span className="shorts-h-ico"><ShortsLogo size={28} /></span> Shorts

        </div>
        <div className="sf-seg" role="tablist">
          <button role="tab" aria-selected={mode === "streamvoid"} className={"sf-seg-btn" + (mode === "streamvoid" ? " on" : "")}
            onClick={() => setMode("streamvoid")}>StreamVoid</button>
          <button role="tab" aria-selected={mode === "shortsfire"} className={"sf-seg-btn" + (mode === "shortsfire" ? " on" : "")}
            onClick={() => setMode("shortsfire")}>ShortsFire</button>
        </div>
        <div className="shorts-h-actions">
          <button className="cp-pill" onClick={() => setNonce((n) => n + 1)}>Refresh</button>
          <button className="cp-pill" onClick={() => setMuted((m) => !m)}>{muted ? "Unmute" : "Mute"}</button>
        </div>
      </div>

      {warn && mode === "streamvoid" && (
        <div className="inline-warn"><span className="warn-ico"><Icon d={I.warn} size={18} /></span><span style={{ flex: 1 }}>{warn}</span>
          <button className="cp-pill" onClick={() => setNonce((n) => n + 1)}>Retry</button></div>
      )}

      {mode === "shortsfire" ? (
        <ShortsFire url={st.cfg.shortsfireUrl} onBack={() => setMode("streamvoid")} />
      ) : loading ? (
        <div className="shorts-feed"><div className="short-card"><div className="short-stage"><div className="skel" style={{ width: "100%", height: "100%" }} /></div></div></div>
      ) : items.length === 0 ? (
        <div className="err-box"><div className="err-ico"><ShortsLogo size={40} /></div><div className="err-msg">Abhi koi Short nahi mila — Refresh try karein</div></div>
      ) : (
        <>
          <div className="shorts-feed" ref={feedRef}>
            {items.map((v, i) => (
              <ShortCard
                key={v.videoId}
                v={v} idx={i} active={i === active} muted={muted} data={data[v.videoId]}
                st={st} onChannel={onChannel} onAddSub={onAddSub}
                cardRef={(el) => { cardRefs.current[i] = el; }}
                onOpenWatch={(meta) => onPlay({ ...meta, isShort: true })}
                onLike={(meta) => st.togFav(meta)}
                onToggleMute={() => setMuted((m) => !m)}
              />
            ))}
          </div>
          <div className="shorts-nav">
            <button className="shorts-nav-btn" onClick={() => step(-1)} disabled={active === 0} title="Previous (↑)">▲</button>
            <button className="shorts-nav-btn" onClick={() => step(1)} disabled={active >= items.length - 1} title="Next (↓)">▼</button>
          </div>
          <div className="shorts-hint">Scroll / ↓ ↑ se next · {cur ? cur.title : ""}</div>
        </>
      )}
    </div>
  );
}

function SearchPage({ query, onPlay, st, engine, onChannel }) {
  const [res, setRes] = useState([]);
  const [token, setToken] = useState(null);
  const [loading, setLoading] = useState(true);
  const [more, setMore] = useState(false);
  const [error, setError] = useState("");
  const [layout, setLayout] = useState("list");
  const [sort, setSort] = useState("relevance");
  const [filter, setFilter] = useState("all");

  useEffect(() => {
    if (!query) return;
    let dead = false;
    setLoading(true); setError(""); setRes([]); setToken(null); setFilter("all"); setSort("relevance");
    if (engine !== "ok") { setLoading(false); setError("engine-offline"); return; }
    apiSearch(st.cfg, query)
      .then((d) => { if (dead) return; setRes(d.items || []); setToken(d.continuation || null); setLoading(false); })
      .catch((e) => { if (!dead) { setError(e.message); setLoading(false); } });
    return () => { dead = true; };
  }, [query, engine, st.cfg.engineUrl]);

  const loadMore = async () => {
    if (!token || more) return;
    setMore(true);
    try {
      const d = await apiSearchMore(st.cfg, query, token);
      setRes((prev) => { const have = new Set(prev.map((v) => v.videoId)); return [...prev, ...(d.items || []).filter((v) => !have.has(v.videoId))]; });
      setToken(null);
    } catch (e) { setError(e.message); }
    setMore(false);
  };

  const sentinel = useRef(null);
  useEffect(() => {
    const el = sentinel.current;
    if (!el || !token || typeof IntersectionObserver === "undefined") return;
    const io = new IntersectionObserver((entries) => { if (entries[0] && entries[0].isIntersecting) loadMore(); }, { rootMargin: "600px" });
    io.observe(el);
    return () => io.disconnect();
  }, [token, more, res.length]);

  const shown = useMemo(() => {
    let list = res.slice();
    if (filter === "live") list = list.filter((v) => v.live);
    if (filter === "shorts") list = list.filter((v) => v.isShort);
    if (filter === "recent") list = list.filter((v) => v.published && Date.now() / 1000 - v.published < 7 * 86400);
    if (sort === "date") list.sort((a, b) => (b.published || 0) - (a.published || 0));
    if (sort === "views") list.sort((a, b) => (b.viewCount || 0) - (a.viewCount || 0));
    return list;
  }, [res, filter, sort]);

  return (
    <div>
      <div className="search-top">
        <span className="search-top-t">Results for “{query}”</span>
        {!loading && <span style={{ fontSize: 13, color: "var(--t3)" }}>{shown.length} videos</span>}
        <div className="search-sort">
          <button className="sort-btn" onClick={() => setLayout(layout === "list" ? "grid" : "list")} title="Toggle layout">
            <Icon d={I.filter} size={18} />{layout === "list" ? "Grid" : "List"}
          </button>
          {[["relevance", "Relevance"], ["date", "Upload date"], ["views", "View count"]].map(([k, l]) => (
            <button key={k} className={"sort-btn" + (sort === k ? " act" : "")} onClick={() => setSort(k)}>{l}</button>
          ))}
        </div>
      </div>
      <div className="search-filters">
        {[["all", "All"], ["recent", "This week"], ["live", "Live"], ["shorts", "Shorts"]].map(([k, l]) => (
          <button key={k} className={"filter-btn" + (filter === k ? " act" : "")} onClick={() => setFilter(k)}>{l}</button>
        ))}
      </div>
      {error && error !== "engine-offline" && (
        <div className="inline-warn"><span className="warn-ico"><Icon d={I.warn} size={18} /></span><span style={{ flex: 1 }}>{error}</span></div>
      )}
      {loading ? <Skels n={6} /> : shown.length === 0 ? (
        <div className="err-box"><div className="err-ico"><Icon d={I.search} size={40} /></div><div className="err-msg">“{query}” ke liye kuch nahi mila</div></div>
      ) : (
        <>
          {layout === "list" ? (
            <div className="search-list">
              {shown.map((v, i) => <VCard key={v.videoId} v={v} onPlay={onPlay} layout="search" st={st} onChannel={onChannel} />)}
            </div>
          ) : (
            <div className="vgrid">
              {shown.map((v, i) => (
                <div key={v.videoId} style={{ animationDelay: `${Math.min(i, 20) * 0.02}s` }}>
                  <VCard v={v} onPlay={onPlay} st={st} onChannel={onChannel} />
                </div>
              ))}
            </div>
          )}
          <div ref={sentinel} />
          {token && <div className="load-more"><button onClick={loadMore}>{more ? "Loading…" : "Show more"}</button></div>}
        </>
      )}
    </div>
  );
}

/* Resolved streams are reused for a few minutes: going back to a video, or the
   next video looping around, starts instantly instead of re-resolving (and a
   fresh resolve is exactly the moment a bot-check can bite). */
const STREAM_TTL = 6 * 60 * 1000;
const STREAM_CACHE = new Map();
const streamKey = (cfg, id) => baseOf(cfg) + "|" + id;
const streamCached = (cfg, id) => {
  const hit = STREAM_CACHE.get(streamKey(cfg, id));
  if (!hit) return null;
  if (Date.now() - hit.at > STREAM_TTL) { STREAM_CACHE.delete(streamKey(cfg, id)); return null; }
  return hit.data;
};
const streamRemember = (cfg, data) => {
  const id = data && data.video && data.video.videoId;
  if (!id || !data.ok) return;
  if (STREAM_CACHE.size > 40) STREAM_CACHE.delete(STREAM_CACHE.keys().next().value);
  STREAM_CACHE.set(streamKey(cfg, id), { at: Date.now(), data });
};
