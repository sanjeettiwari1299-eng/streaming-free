function WatchPage({ video, onPlay, st, engine, onChannel, onAddSub }) {
  const [stream, setStream] = useState(null);
  const [status, setStatus] = useState("loading");
  const [err, setErr] = useState("");
  const [rel, setRel] = useState([]);
  const [descOpen, setDescOpen] = useState(false);
  const [attempt, setAttempt] = useState(0);
  const [diag, setDiag] = useState(null);   // worker's {reason, reasonLabel, hint, needAuth, attempts}
  const [showWhy, setShowWhy] = useState(false);
  const [doctor, setDoctor] = useState(false);
  const [fallback, setFallback] = useState([]);   // endless play: recommendations dead → trending
  const [relTab, setRelTab] = useState("all");
  const [moreOpen, setMoreOpen] = useState(false);
  const [saveOpen, setSaveOpen] = useState(false);
  const [disliked, setDisliked] = useState(false);
  const moreRef = useRef();
  const theater = !!st.cfg.theater;

  useEffect(() => {
    let dead = false;
    setStatus("loading"); setErr(""); setStream(null); setDiag(null); setShowWhy(false);
    if (engine !== "ok") { setStatus("error"); setErr("engine-offline"); return; }
    // a cached stream is exactly what just died — a manual/ladder retry must bypass it
    if (attempt > 0) STREAM_CACHE.delete(streamKey(st.cfg, video.videoId));
    const warm = attempt > 0 ? null : streamCached(st.cfg, video.videoId);
    if (warm) { setStream(warm); setStatus("ready"); return () => { dead = true; }; }
    apiPlayer(st.cfg, video.videoId)
      .then((d) => {
        if (dead) return;
        if (!d || !d.ok || !(d.formats || []).length) {
          setStatus("error");
          setDiag(d || null);
          setErr((d && (d.error || (d.attempts || []).slice(-3).join(" · "))) || "koi playable stream nahi mila");
          return;
        }
        streamRemember(st.cfg, d);
        setStream(d); setStatus("ready");
      })
      .catch((e) => { if (!dead) { setStatus("error"); setErr(e.message); } });
    return () => { dead = true; };
  }, [video.videoId, engine, st.cfg.engineUrl, attempt]);

  useEffect(() => {
    let dead = false;
    setRel([]); setRelTab("all");
    if (engine === "ok") recommendFor(st.cfg, video, st).then((d) => !dead && setRel(d.items || [])).catch(() => {});
    return () => { dead = true; };
  }, [video.videoId, engine, st.cfg.engineUrl]);

  // endless play: a safety queue so "video khatam" never means "app ruk gaya"
  useEffect(() => {
    let dead = false;
    setFallback([]);
    if (engine !== "ok" || st.cfg.endless === false) return;
    apiTrending(st.cfg, st.cfg.region)
      .then((d) => { if (!dead) setFallback((d.items || []).filter((v) => v.videoId !== video.videoId)); })
      .catch(() => {});
    return () => { dead = true; };
  }, [video.videoId, engine, st.cfg.engineUrl, st.cfg.region, st.cfg.endless]);

  const meta = useMemo(() => {
    const m = { ...video };
    if (stream && stream.video) {
      const v = stream.video;
      m.title = v.title || m.title;
      m.author = v.author || m.author;
      m.authorId = v.authorId || m.authorId;
      m.description = v.description || m.description;
      m.viewCount = v.viewCount || m.viewCount;
      m.lengthSeconds = v.lengthSeconds || m.lengthSeconds;
      m.live = v.live || m.live;
      if (!m.thumbnail && v.thumbnails && v.thumbnails.length) m.thumbnail = v.thumbnails[v.thumbnails.length - 1];
    }
    return m;
  }, [video, stream]);

  useEffect(() => {
    if (status === "ready") {
      st.addHist({
        videoId: video.videoId, title: meta.title, author: meta.author, authorId: meta.authorId,
        thumbnail: meta.thumbnail, lengthSeconds: meta.lengthSeconds, viewCount: meta.viewCount, publishedText: meta.publishedText,
      });
    }
  }, [status]);

  // after 12s of watching, quietly resolve the next video so the hand-off is instant
  useEffect(() => {
    if (status !== "ready" || st.cfg.endless === false) return;
    const upcoming = rel.find((v) => v.videoId !== video.videoId) || fallback.find((v) => v.videoId !== video.videoId);
    if (!upcoming || streamCached(st.cfg, upcoming.videoId)) return;
    const t = setTimeout(() => {
      apiPlayer(st.cfg, upcoming.videoId)
        .then((d) => { if (d && d.ok) streamRemember(st.cfg, d); })
        .catch(() => {});
    }, 12000);
    return () => clearTimeout(t);
  }, [status, rel, fallback, video.videoId, engine, st.cfg.engineUrl]);

  useEffect(() => {
    if (!moreOpen) return;
    const h = (e) => { if (moreRef.current && !moreRef.current.contains(e.target)) setMoreOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [moreOpen]);

  const nextVideo = useCallback(() => {
    const n =
      rel.find((v) => v.videoId !== video.videoId) ||
      fallback.find((v) => v.videoId !== video.videoId);
    if (n) { onPlay(n); return true; }
    return false;
  }, [rel, fallback, video.videoId, onPlay]);

  const share = async () => {
    const url = YTW(video.videoId);
    try {
      if (navigator.share) await navigator.share({ title: meta.title, url });
      else { await navigator.clipboard.writeText(url); alert("Link copied ✓"); }
    } catch {}
    setMoreOpen(false);
  };
  const download = () => {
    if (!baseOf(st.cfg)) { alert("Engine URL set nahi hai"); return; }
    window.open(`${baseOf(st.cfg)}/mp4/${video.videoId}.mp4?dl=1`, "_blank");
    setMoreOpen(false);
  };

  const fav = st.isFav(video.videoId), wl = st.isWL(video.videoId);
  const subscribed = st.isSub(meta.authorId);
  const description = meta.description || "";
  const relatedShown = useMemo(
    () => (relTab === "channel" ? rel.filter((v) => v.authorId && v.authorId === meta.authorId) : rel),
    [rel, relTab, meta.authorId]
  );
  const toggleFav = () => { setDisliked(false); st.togFav(meta); };

  return (
    <div className={"watch" + (theater ? " theater" : "")}>
      <div className="watch-main">
        <div className="watch-player">
          {status === "loading" && (
            <div className="cp"><div className="cp-big"><div className="cp-spin" /></div><div className="cp-loadtxt">Stream resolve ho raha hai…</div></div>
          )}
          {status === "error" && (
            <div className="cp">
              <div className="cp-err">
                <div className="pl-badge">{err === "engine-offline" ? "engine" : (diag && diag.reason) || "error"}</div>
                <Icon d={I.warn} size={34} cls="pl-ico-svg" />
                <div className="pl-title">
                  {err === "engine-offline" ? "Engine connect nahi hai" : (diag && diag.reasonLabel) || "Video play nahi ho paya"}
                </div>
                <div className="pl-sub">
                  {err === "engine-offline"
                    ? "Settings → Engine URL set karein (Cloudflare Worker)."
                    : (diag && diag.hint) || err}
                </div>

                {diag && diag.needAuth && (
                  <div className="pl-note">
                    <b>Ye video YouTube ke bot-check me atki hai.</b> Worker me <code>YT_COOKIES</code> (throwaway account)
                    ya <code>PO_TOKEN</code> / <code>POTOKEN_URL</code> secret add karo — uske baad yehi video chal jayegi.
                  </div>
                )}

                {doctor && (
                  <div className="pl-doctor" onClick={(e) => e.stopPropagation()}>
                    <EngineDoctor st={st} videoId={video.videoId} compact />
                  </div>
                )}

                <div className="pl-actions">
                  <button className="cp-pill" onClick={() => setAttempt((a) => a + 1)}>↻ Retry</button>
                  <button className="cp-pill ghost" onClick={() => setAttempt((a) => a + 1)}>Fresh URL</button>
                  <a className="cp-pill ghost" href={`${baseOf(st.cfg)}/mp4/${video.videoId}.mp4?dl=1`} target="_blank" rel="noreferrer">Download MP4</a>
                  <a className="cp-pill ghost" href={YTW(video.videoId)} target="_blank" rel="noreferrer">Open on YouTube</a>
                  <button className="cp-pill ghost" onClick={() => setDoctor(!doctor)}>
                    {doctor ? "Hide doctor" : "Engine doctor"}
                  </button>
                </div>

                {diag && (diag.attempts || []).length > 0 && (
                  <div className="pl-why">
                    <button className="pl-why-btn" onClick={() => setShowWhy((v) => !v)}>
                      {showWhy ? "Hide" : "Why?"} · {diag.attempts.length} attempts tried
                    </button>
                    {showWhy && (
                      <div className="pl-why-body">
                        {(diag.failures && Object.keys(diag.failures).length > 0) && (
                          <div className="pl-why-sum">
                            {Object.entries(diag.failures).map(([k, n]) => <span key={k} className="pl-chip">{k} ×{n}</span>)}
                          </div>
                        )}
                        <ol>{diag.attempts.slice(-14).map((a, i) => <li key={i}>{a}</li>)}</ol>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}
          {status === "ready" && stream && (
            <CPlayer video={meta} formats={stream.formats} st={st}
              onNext={(rel.length || fallback.length || st.cfg.endless !== false) ? nextVideo : null}
              poster={meta.thumbnail || YTT(video.videoId, "hqdefault")} onRefresh={() => setAttempt((a) => a + 1)} />
          )}
        </div>

        <div className="watch-under">
          <h1 className="watch-title">{meta.title}</h1>

          <div className="watch-meta-row">
            <div className="watch-ch-row">
              <div onClick={() => meta.authorId && onChannel(meta.authorId, meta.author)} style={{ cursor: "pointer", lineHeight: 0 }}>
                <Av name={meta.author} size={40} />
              </div>
              <div style={{ minWidth: 0 }}>
                <div className="watch-ch-name" onClick={() => meta.authorId && onChannel(meta.authorId, meta.author)} style={{ cursor: "pointer" }}>

/* ── subscription manager + OPML (RSS standard) ───────────────────────────── */
function SubManager({ st, onAddSub }) {
  const exportOpml = () => {
    const body = st.subs
      .map((s) => `    <outline type="rss" text="${(s.name || s.channelId).replace(/"/g, "&quot;")}" title="${(s.name || s.channelId).replace(/"/g, "&quot;")}" xmlUrl="https://www.youtube.com/feeds/videos.xml?channel_id=${s.channelId}" htmlUrl="https://www.youtube.com/channel/${s.channelId}"/>`)
      .join("\n");
    const opml = `<?xml version="1.0" encoding="UTF-8"?>\n<opml version="2.0">\n<head><title>StreamVoid subscriptions</title></head>\n<body>\n  <outline text="YouTube" title="YouTube">\n${body}\n  </outline>\n</body>\n</opml>\n`;
    const blob = new Blob([opml], { type: "text/x-opml" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "streamvoid-subscriptions.opml";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  const importOpml = async (file) => {
    const text = await file.text();
    const ids = [...text.matchAll(/channel_id=(UC[\w-]{10,})/g)].map((m) => m[1]);
    const extra = [...text.matchAll(/youtube\.com\/channel\/(UC[\w-]{10,})/g)].map((m) => m[1]);
    const all = [...new Set([...ids, ...extra])];
    if (!all.length) return alert("OPML me koi YouTube channel nahi mila");
    st.setSubsRaw([...st.subs, ...all.filter((id) => !st.isSub(id)).map((channelId) => ({ channelId, name: channelId, avatar: "", addedAt: Date.now() }))]);
    alert(`${all.length} channel import hue — names pehli RSS fetch par aa jayenge`);
  };
  return (
    <div>
      <div className="set-blk-title" style={{ fontSize: 15, marginBottom: 8 }}>Subscriptions ({st.subs.length})</div>
      <div className="set-blk-desc" style={{ marginBottom: 10 }}>
        Videos channel ke <b>public feed</b> se aati hain — YouTube ka RSS endpoint Oct 2026 se 404 deta hai, to worker chupchaap channel ke Videos tab (InnerTube) se wahi data laata hai, aur feed wapas aate hi RSS use karne lagta hai. Koi account, koi Google login nahi.
      </div>
      {st.subs.map((s) => (
        <div key={s.channelId} className="sub-row">
          <Av name={s.name} src={s.avatar} size={40} />
          <div style={{ minWidth: 0 }}>
            <div className="sr-name">{s.name || s.channelId}</div>
            <div className="sr-id">{s.channelId}</div>
          </div>
          <div className="sr-actions">
            <a className="sub-chip" href={`https://www.youtube.com/channel/${s.channelId}`} target="_blank" rel="noreferrer">Channel ↗</a>
            <button className="sub-chip" onClick={() => st.removeSub(s.channelId)}>Remove</button>
          </div>
        </div>
      ))}
      <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
        <button className="sub-chip pri" onClick={onAddSub}>＋ Subscribe</button>
        <button className="sub-chip" onClick={exportOpml}>↓ Export OPML</button>
        <label className="sub-chip" style={{ display: "inline-flex", alignItems: "center", cursor: "pointer" }}>
          ↑ Import OPML
          <input type="file" accept=".opml,.xml,text/xml,text/x-opml" style={{ display: "none" }}
            onChange={(e) => e.target.files && e.target.files[0] && importOpml(e.target.files[0])} />
        </label>
      </div>
    </div>
  );
}

/* ── Engine doctor ────────────────────────────────────────────────────────────
   Ek hi request me do sawal: "stream resolve hua?" aur "bytes aa rahe hain?".
   Worker ka /api/selftest?probe=1 verdict deta hai (ok / bot / proxy / resolve /
   geo / age); agar worker purana ho to hum khud /api/player se probe karte hain. */
const VERDICT_META = {
  ok: { t: "Sab theek", c: "#7ee787", i: I.check },
  bot: { t: "YouTube bot-check", c: "#f1c40f", i: I.warn },
  proxy: { t: "Bytes block ho rahe hain", c: "#ff8a65", i: I.warn },
  resolve: { t: "Player resolve nahi hua", c: "#ff8a65", i: I.warn },
  geo: { t: "Region block", c: "#f1c40f", i: I.warn },
  age: { t: "Age-restricted", c: "#f1c40f", i: I.warn },
  old: { t: "Worker purana hai", c: "#f1c40f", i: I.warn },
  fail: { t: "Doctor fail", c: "#ff8a65", i: I.warn },
};

function EngineDoctor({ st, videoId, compact }) {
  const [state, setState] = useState("idle");
  const [res, setRes] = useState(null);
  const [manual, setManual] = useState(() => (videoId || "dQw4w9WgXcQ"));

  const run = async (id) => {
    const vid = String(id || manual || "dQw4w9WgXcQ").trim();
    if (!vid) return;
    setState("run"); setRes(null);
    const url = baseOf(st.cfg) + "/api/selftest?id=" + encodeURIComponent(vid) + "&probe=1";
    try {
      const r = await fetch(url, { headers: { Accept: "application/json" } });
      const text = await r.text();
      let d = null;
      try { d = text ? JSON.parse(text) : null; } catch { throw new Error("worker ne JSON nahi diya — URL/galat route check karein"); }
      if (!d) throw new Error("khali response");
      if (!d.verdict) {
        // purana worker: selftest hai par probe nahi — khud player se bytes check karo
        let extra = null;
        try {
          const p = await apiPlayer(st.cfg, vid);
          const f = (p.formats || [])[0];
          if (f) {
            const m = await fetch(mediaUrl(st.cfg, f.url), { headers: { Range: "bytes=0-2047" } });
            extra = { status: m.status, ok: m.status === 200 || m.status === 206, quality: f.quality, itag: f.itag, bytes: (await m.arrayBuffer()).byteLength };
          }
        } catch (e) { extra = { ok: false, status: 0, note: e.message }; }
        d.verdict = extra
          ? (extra.ok ? { code: "old", hi: "Purana worker (selftest me probe nahi) par bytes aa rahe hain — playback chalni chahiye. Naya worker.js deploy karna behtar hai." }
            : { code: "proxy", hi: "Purana worker aur bytes block ho rahe hain (" + extra.status + "). Naya worker.js deploy karein (~/api/selftest?probe=1)." })
          : { code: "old", hi: "Purana worker — probe support nahi hai. Naya worker.js deploy karein." };
        d.stream = extra;
      }
      setRes(d); setState("done");
    } catch (e) {
      setRes({ ok: false, error: String((e && e.message) || e) });
      setState("error");
    }
  };

  const meta = VERDICT_META[(res && res.verdict && res.verdict.code) || (state === "error" ? "fail" : "ok")] || VERDICT_META.fail;

  return (
    <div className={"doctor" + (compact ? " doctor-compact" : "")}>
      <div className="doctor-row">
        <input value={manual} onChange={(e) => setManual(e.target.value)} placeholder="video id (11 chars)"
          onKeyDown={(e) => e.key === "Enter" && run(manual)} aria-label="Video id for doctor" />
        <button className="set-api-btn" disabled={state === "run"} onClick={() => run(manual)}>
          {state === "run" ? "Checking…" : "Run engine doctor"}
        </button>
        {baseOf(st.cfg) && (
          <a className="setup-link" href={baseOf(st.cfg) + "/api/selftest?id=" + encodeURIComponent(manual || "dQw4w9WgXcQ") + "&probe=1"}
            target="_blank" rel="noreferrer">Raw JSON ↗</a>
        )}
      </div>

      {state === "error" && (
        <div className="doctor-card" style={{ borderColor: "var(--red2)" }}>
          <div className="doctor-t"><Icon d={I.warn} size={18} />Doctor nahi chala</div>
          <div className="doctor-s">{res && res.error}</div>
          <div className="doctor-s">Engine URL: <code>{baseOf(st.cfg) || "(set nahi)"}</code></div>
        </div>
      )}

      {state === "done" && res && (
        <div className="doctor-card" style={{ borderColor: meta.c }}>
          <div className="doctor-t" style={{ color: meta.c }}><Icon d={meta.i} size={18} />{meta.t}{res.verdict && res.verdict.code ? " · " + res.verdict.code : ""}</div>
          <div className="doctor-s">{res.verdict && res.verdict.hi}</div>
          <div className="doctor-grid">
            <span>resolve</span><b>{res.ok ? "ok" : "fail"}</b>
            <span>client</span><b>{res.client || "—"} {res.clientVersion || ""}</b>
            <span>pass</span><b>{res.pass != null ? res.pass : "—"} · {res.ms != null ? res.ms + " ms" : ""}</b>
            <span>formats</span><b>{(res.formats || []).join(", ") || "—"}</b>
            <span>stream</span>
            <b>{res.stream ? (res.stream.ok ? "bytes ✓ " : "fail ") + (res.stream.status || 0) + (res.stream.bytes ? " · " + res.stream.bytes + "B" : "") : "probe nahi chala"}</b>
            {res.stream && res.stream.note && <><span>note</span><b style={{ fontWeight: 400 }}>{res.stream.note}</b></>}
          </div>
          {res.attempts && res.attempts.length > 0 && (
            <details className="doctor-attempts">
              <summary>{res.attempts.length} attempts</summary>
              <ol>{res.attempts.slice(-10).map((a, i) => <li key={i}>{a}</li>)}</ol>
            </details>
          )}
        </div>
      )}
    </div>
  );
}

function CloudStore({ st }) {
  const [copied, setCopied] = useState("");
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState("");
  const [probe, setProbe] = useState(null);
  const [open, setOpen] = useState(false);
  const sync = st.sync || { state: "boot", caps: CAPS };
  const key = st.profileKey ? st.profileKey() : "";
  const masked = key ? key.slice(0, 6) + "…" + key.slice(-4) : "—";

  const copy = async (text, what) => {
    try { await navigator.clipboard.writeText(text); setCopied(what); setTimeout(() => setCopied(""), 2000); }
    catch { setCopied("copy fail"); }
  };
  const exportJson = () => {
    try {
      const dump = st.snapshot();
      const blob = new Blob([JSON.stringify(dump, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "streamvoid-profile-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      setNote("Backup download ho gaya ✓");
    } catch (e) { setNote("Export fail: " + e.message); }
  };
  const importJson = async (file) => {
    if (!file) return;
    setBusy(true); setNote("");
    try {
      const data = JSON.parse(await file.text());
      const r = await st.restore(data);
      setNote("Restore ✓ " + (r && r.imported ? r.imported + " items" : ""));
    } catch (e) { setNote("Import fail: " + e.message); }
    finally { setBusy(false); }
  };
  const testStore = async () => {
    setBusy(true); setProbe(null);
    try { setProbe(await apiStoreProbe(st.cfg, key)); }
    catch (e) { setProbe({ ok: false, error: e.message }); }
    finally { setBusy(false); }
  };
  const clearAll = async () => {
    if (!window.confirm("Cloud store se history, likes, watch later, playlists aur subscriptions — sab clear karein?")) return;
    setBusy(true);
    try { await st.wipeAll(); setNote("Cloud store clear ✓"); }
    catch (e) { setNote("Clear fail: " + e.message); }
    finally { setBusy(false); }
  };

  const stateText =
    sync.state === "ok" ? "Synced" :
    sync.state === "loading" ? "Loading…" :
    sync.state === "local" ? "Worker URL chahiye" :
    sync.state === "boot" ? "Starting…" : "Cloud off";
  const dot = sync.state === "ok" ? "ok" : sync.state === "loading" || sync.state === "boot" ? "wait" : "bad";

  return (
    <div className="set-blk">
      <div className="set-blk-title"><Icon d={I.cloud || I.cast} size={20} /> Cloud store <span className="badge-mini">layerbase libSQL</span></div>
      <div className="set-blk-desc">
        History, likes, watch later, playlists, subscriptions aur settings — sab tumhare <b>Layerbase</b> database me.
        <b> localStorage me kuch nahi</b> likha jata. Har list par cap hai, cap cross hote hi sabse purana item hat jata hai —
        koi TTL nahi, time se kuch expire nahi hota.
      </div>

      <div className="engine-status">
        <span className={"dot " + dot} />
        {stateText}
        {sync.state === "ok" && <span style={{ color: "var(--t3)", marginLeft: 6 }}>· {sync.backend}{sync.stale ? " (stale snapshot)" : ""}</span>}
        {sync.at > 0 && sync.state === "ok" && <span style={{ color: "var(--t3)", marginLeft: 6 }}>· {new Date(sync.at).toLocaleTimeString()}</span>}
        <button className="setup-link" style={{ marginLeft: 8 }} onClick={() => { st.reload(); }}>↻ Sync now</button>
      </div>
      {sync.state === "error" && (
        <div style={{ color: "#ff8a80", fontSize: 12.5, marginTop: 6 }}>
          {sync.error}
          <div style={{ color: "var(--t3)", marginTop: 3 }}>
            Worker secrets me <code>LIBSQL_URL</code> + <code>LIBSQL_TOKEN</code> daalein (Layerbase → database → Connect).
            Tab tak app memory + cookie bootstrap par chalegi.
          </div>
        </div>
      )}
      {sync.stale && <div style={{ color: "#ffd479", fontSize: 12.5, marginTop: 6 }}>Edge snapshot se load hua — {sync.warning || "Layerbase abhi jaga nahi"}.</div>}

      <div className="set-chip-row" style={{ marginTop: 10 }}>
        <button className="set-chip" disabled={busy} onClick={testStore}>{busy ? "Testing…" : "Test Layerbase"}</button>
        <button className="set-chip" onClick={() => setOpen(!open)}>{open ? "▾ Setup chhupaein" : "▸ Layerbase banayein (5 steps)"}</button>
      </div>
      {probe && (
        <div style={{ fontSize: 12.5, marginTop: 8, lineHeight: 1.7, color: probe.ok ? "#7ee787" : "#ff8a80" }}>
          {probe.ok
            ? <>Connected ✓ <span style={{ color: "var(--t3)" }}>· {probe.host} · {probe.latencyMs} ms · sv_store {probe.rows === null ? "ready" : "· " + probe.rows + " rows"} · expiry none{probe.wokeFromSleep ? " · (sleep se jaga)" : ""}</span></>
            : <>✕ {probe.error || "not connected"}</>}
          {!probe.ok && probe.hint && <div style={{ color: "var(--t3)", marginTop: 3 }}>{probe.hint}</div>}
          {!probe.ok && Array.isArray(probe.steps) && (
            <ol style={{ margin: "6px 0 0 18px", color: "var(--t2)" }}>{probe.steps.map((x) => <li key={x}>{x}</li>)}</ol>
          )}
        </div>
      )}

      {open && (
        <div style={{ marginTop: 10, fontSize: 12.5, lineHeight: 1.8, color: "var(--t2)" }}>
          <ol style={{ margin: "0 0 0 18px" }}>
            <li><b>layerbase.com</b> → sign in (free, card nahi chahiye)</li>
            <li><b>New Database</b> → engine <b>libSQL</b> → Free plan → Create (10–60 s me ready)</li>
            <li>DB kholein → <b>Connect / Quick Connect</b> → <code>https://…cloud.layerbase.dev</code> URL aur auth token copy karein</li>
            <li>Cloudflare → Workers → apna worker → <b>Settings → Variables → Add</b>: <code>LIBSQL_URL</code> = wahi URL, <code>LIBSQL_TOKEN</code> = token (dono <b>Secret</b> rakhein) → Save &amp; Deploy</li>
            <li>Yahan <b>Test Layerbase</b> dabaein → "Connected ✓" aana chahiye</li>
          </ol>
          <div style={{ color: "var(--t3)", marginTop: 6 }}>
            Free tier: ₹0, koi expiry nahi, 2 database · 5 GB · 20 connections. 15 min idle par DB so jata hai
            (agli query ~1–5 s me jaga deti hai), 14 din bilkul idle rahe to archive hota hai — dashboard me ek click
            <b> Restore</b>, data safe. Isliye app mahine me kam se kam ek baar kholein.
          </div>
        </div>
      )}

      <div className="set-sub-h">Caps (server-side, client badha nahi sakta)</div>
      <div className="set-chip-row">
        {[["history", "history"], ["subs", "subscriptions"], ["likes", "likes"], ["watchlater", "watch later"], ["playlists", "playlists"]].map(([k, l]) => (

        ))}

      </div>
      <div style={{ color: "var(--t3)", fontSize: 12, marginTop: -2 }}>

        {copied && <span style={{ color: "#7ee787", marginLeft: 6 }}>{copied} ✓</span>}
      </div>

      <div className="set-sub-h">Backup</div>
      <div className="set-chip-row">
        <button className="set-chip" disabled={busy} onClick={exportJson}>↓ Export JSON</button>

}

const TOP_SUGGEST = ["lofi songs", "today news", "cricket highlights", "coding tutorial", "trending music", "study with me", "movie trailer", "standup comedy"];

function Topbar({ onSearch, onNav, open, setOpen, engine, st, onAddSub, theme, onTheme, scrolled }) {
  const [q, setQ] = useState("");
  const [focus, setFocus] = useState(false);
  const [recent, setRecent] = useState(() => { const r = cook("sv_rec", []); return Array.isArray(r) ? r.slice(0, 8) : []; });
  const [menu, setMenu] = useState("");
  const [mobile, setMobile] = useState(false);
  const mref = useRef(null);
  const wrap = useRef(null);
  const focusRef = useRef(null);

  useEffect(() => {
    if (!menu) return;
    const h = (e) => { if (wrap.current && !wrap.current.contains(e.target)) setMenu(""); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [menu]);

  useEffect(() => {
    if (!focus) return;
    const h = (e) => { if (wrap.current && !wrap.current.contains(e.target)) setFocus(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [focus]);

  useEffect(() => { if (mobile && mref.current) mref.current.focus(); }, [mobile]);

  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName || "").toLowerCase();
      const typing = tag === "input" || tag === "textarea" || (e.target && e.target.isContentEditable);
      if (e.key === "/" && !typing) { e.preventDefault(); focusRef.current?.focus(); setFocus(true); }
      if (e.key === "Escape") { setFocus(false); setMenu(""); setMobile(false); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const remember = (term) => {
    const t = String(term || "").trim();
    if (!t) return;
    const next = [t, ...recent.filter((x) => String(x).toLowerCase() !== t.toLowerCase())].slice(0, 8);
    setRecent(next); cookSet("sv_rec", next, 180);
  };
  const go = (e) => {
    e && e.preventDefault();
    const t = q.trim();
    if (!t) return;
    remember(t);
    setFocus(false); setMenu(""); setMobile(false);
    onSearch(t);
    focusRef.current?.blur();
  };
  const pick = (t) => { setQ(t); remember(t); setFocus(false); setMenu(""); setMobile(false); onSearch(t); };
  const rmRecent = (e, t) => {
    e.stopPropagation();
    const next = recent.filter((x) => x !== t);
    setRecent(next); cookSet("sv_rec", next, 180);
  };

  const ql = q.trim().toLowerCase();
  const pool = [...new Set([...recent, ...TOP_SUGGEST])];
  const sugg = (ql ? pool.filter((x) => x.toLowerCase().includes(ql) && x.toLowerCase() !== ql) : pool).slice(0, 9);

  const voice = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setFocus(true); focusRef.current?.focus(); return; }
    try {
      const r = new SR();
      r.lang = "en-IN"; r.interimResults = false;
      r.onresult = (ev) => {
        const t = ev.results && ev.results[0] && ev.results[0][0] ? ev.results[0][0].transcript : "";
        if (t) { setQ(t); remember(t); onSearch(t); }
      };
      r.start();
    } catch { setFocus(true); focusRef.current?.focus(); }
  };

  const newPlaylist = () => {
    const name = typeof window.prompt === "function" ? window.prompt("Playlist ka naam likhein") : "";
    if (name && name.trim()) st.mkPL(name.trim());
    setMenu("");
  };

  const Suggestions = ({ onPick }) => (
    <div className="tb-suggest" onMouseDown={(e) => e.preventDefault()}>
      {sugg.map((t) => {
        const i = q.trim() ? t.toLowerCase().indexOf(q.trim().toLowerCase()) : -1;
        return (
          <div key={t} style={{ display: "flex", alignItems: "center" }}>
            <button className="tb-sg" onClick={() => onPick(t)} style={{ flex: 1 }}>
              <Icon d={I.search} size={20} />
              <span className="txt">
                {i >= 0 ? (
                  <>{t.slice(0, i)}<span className="fill">{t.slice(i, i + q.trim().length)}</span>{t.slice(i + q.trim().length)}</>
                ) : t}
              </span>
            </button>
            {recent.includes(t) && (
              <button className="tb-sg-rm" title="Remove from search history" onClick={(e) => rmRecent(e, t)}><Icon d={I.close} size={16} /></button>
            )}
          </div>
        );
      })}
    </div>
  );

  return (
    <>
      <header className={"topbar" + (scrolled ? " scrolled" : "")}>
        <div className="tb-left">
          <button className="tb-menu-btn" onClick={() => setOpen(!open)} aria-label="Guide"><Icon d={I.menu} size={24} /></button>
          <YtLogo onClick={() => onNav("home")} />
        </div>

        <div className="tb-center">
          <div className="tb-search-wrap" ref={wrap}>
            <form className="tb-search" onSubmit={go}>
              {q && <button type="button" className="tb-clr-btn" onClick={() => { setQ(""); focusRef.current?.focus(); }} aria-label="Clear"><Icon d={I.close} size={20} /></button>}
              <input ref={focusRef} placeholder="Search" value={q} onFocus={() => setFocus(true)}
                onChange={(e) => setQ(e.target.value)} aria-label="Search" />
              <button type="submit" className="tb-go" aria-label="Search"><Icon d={I.search} size={22} /></button>
            </form>
            <button className="tb-mic" title="Search with voice" onClick={voice} aria-label="Voice search"><Icon d={I.mic} size={20} /></button>
            {focus && sugg.length > 0 && <Suggestions onPick={pick} />}
          </div>
        </div>

        <div className="tb-right">
          <button className="tb-icon-btn tb-search-mobile-btn" onClick={() => setMobile(true)} aria-label="Search"><Icon d={I.search} size={24} /></button>

          <span className={"engine-dot " + (engine === "ok" ? "ok" : engine === "checking" ? "wait" : "bad")}
            title={"engine: " + engine} style={{ display: "none" }} />

          <div style={{ position: "relative" }}>
            <button className="tb-create" onClick={() => setMenu(menu === "create" ? "" : "create")} title="Create">
              <Icon d={I.create} size={22} /><span className="tb-create-txt">Create</span>
            </button>
            {menu === "create" && (
              <div className="yt-menu" style={{ right: "auto", left: 0 }}>
                <button className="ym-item" onClick={newPlaylist}><Icon d={I.playlist} size={22} />New playlist</button>
                <button className="ym-item" onClick={() => { setMenu(""); onAddSub(); }}><Icon d={I.subs} size={22} />Subscribe to a channel</button>
                <div className="ym-sep" />
                <a className="ym-item" href="https://studio.youtube.com" target="_blank" rel="noreferrer"><Icon d={I.create} size={22} />Upload a video (YouTube Studio)</a>
                <a className="ym-item" href="https://www.youtube.com/live_dashboard" target="_blank" rel="noreferrer"><Icon d={I.cast} size={22} />Go live</a>
              </div>
            )}
          </div>

          <div style={{ position: "relative" }}>
            <button className="tb-icon-btn" onClick={() => setMenu(menu === "bell" ? "" : "bell")} title="Notifications" aria-label="Notifications">
              <Icon d={I.bell} size={24} />
              {st.subs.length > 0 && <span className="tb-badge">{st.subs.length > 9 ? "9+" : st.subs.length}</span>}
            </button>
            {menu === "bell" && (
              <div className="yt-menu">
                <div className="ym-head" style={{ paddingBottom: 10 }}>
                  <div className="ym-name">Notifications</div>
                </div>
                <div className="ym-sep" />
                {st.subs.length === 0 && (
                  <div className="ym-item" style={{ display: "block", color: "var(--t2)" }}>
                    No new notifications. Subscribe to channels to see their latest uploads here.
                  </div>
                )}
                {st.subs.slice(0, 5).map((s) => (
                  <button key={s.channelId} className="ym-item" onClick={() => { setMenu(""); onNav("subscriptions"); }}>
                    <Av name={s.name} src={s.avatar} size={28} />
                    <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.name || s.channelId}</span>
                    <span className="ym-right">new</span>
                  </button>
                ))}
                <div className="ym-sep" />
                <button className="ym-item" onClick={() => { setMenu(""); onNav("subscriptions"); }}><Icon d={I.subs} size={22} />View subscriptions</button>
              </div>
            )}
          </div>

          <div style={{ position: "relative" }}>
            <button className="tb-avatar" onClick={() => setMenu(menu === "user" ? "" : "user")} title="Account" aria-label="Account">
              <Icon d={I.person} size={20} />
            </button>
            {menu === "user" && (
              <div className="yt-menu" style={{ right: 0 }}>
                <div className="ym-head">
                  <span className="tb-avatar"><Icon d={I.person} size={24} /></span>
                  <div style={{ minWidth: 0 }}>
                    <div className="ym-name">StreamVoid profile</div>
                    <div className="ym-sub">{profileKey()}</div>
                  </div>
                </div>
                <div className="ym-sep" />
                <button className="ym-item" onClick={() => { setMenu(""); onNav("history"); }}><Icon d={I.history} size={22} />Your history</button>
                <button className="ym-item" onClick={() => { setMenu(""); onNav("favorites"); }}><Icon d={I.like} size={22} />Liked videos</button>
                <button className="ym-item" onClick={() => { setMenu(""); onNav("watchlater"); }}><Icon d={I.watchlater} size={22} />Watch later</button>
                <div className="ym-sep" />
                <button className="ym-item" onClick={() => { onTheme(); }}>
                  <Icon d={theme === "dark" ? I.sun : I.moon} size={22} />
                  Appearance<span className="ym-right">{theme === "dark" ? "Light" : "Dark"}</span>
                </button>
                <button className="ym-item" onClick={() => { setMenu(""); onNav("settings"); }}><Icon d={I.gear} size={22} />Settings</button>
                <div className="ym-sep" />
                <div className="ym-item" style={{ display: "block", fontSize: 12, color: "var(--t2)" }}>
                  Engine: <b style={{ color: engine === "ok" ? "#7ee787" : "#f1c40f" }}>{engine}</b>
                  <span style={{ margin: "0 6px" }}>·</span>
                  Cloud store: <b style={{ color: st.sync.state === "ok" ? "#7ee787" : "var(--t1)" }}>{st.sync.state}</b>
                  <div style={{ marginTop: 4 }}>No login. Everything lives in your own database.</div>
                </div>
              </div>
            )}
          </div>
        </div>
      </header>

      {mobile && (
        <div className="tb-mobile-search">
          <button className="tb-menu-btn" onClick={() => setMobile(false)} aria-label="Back"><Icon d={I.back} size={24} /></button>
          <div className="tb-search-wrap" style={{ flex: 1 }}>
            <form className="tb-search" onSubmit={go}>
              {q && <button type="button" className="tb-clr-btn" onClick={() => { setQ(""); mref.current?.focus(); }} aria-label="Clear"><Icon d={I.close} size={20} /></button>}
              <input ref={mref} autoFocus placeholder="Search" value={q} onFocus={() => setFocus(true)}
                onChange={(e) => setQ(e.target.value)} aria-label="Search" />
              <button type="submit" className="tb-go" aria-label="Search"><Icon d={I.search} size={22} /></button>
            </form>
            <button className="tb-mic" onClick={voice} aria-label="Voice search"><Icon d={I.mic} size={20} /></button>
            {focus && sugg.length > 0 && <Suggestions onPick={pick} />}
          </div>
        </div>
      )}
    </>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   APP
   ════════════════════════════════════════════════════════════════════════════ */
function App() {
  const st = useStore();
  const [page, setPage] = useState("home");
  const [searchQ, setSearchQ] = useState("");
  const [curVid, setCurVid] = useState(null);
  const [curChannel, setCurChannel] = useState(null);
  const [open, setOpen] = useState(true);
  const [mini, setMini] = useState(false);
  const [engine, setEngine] = useState("checking");
  const [busy, setBusy] = useState(false);
  const [subModal, setSubModal] = useState(false);
  const [subsKey, setSubsKey] = useState(0);
  const [scrolled, setScrolled] = useState(false);
  const [theme, setTheme] = useState(() => st.cfg.theme || "dark");

  const checkEngine = useCallback(async () => {
    setEngine("checking"); setBusy(true);
    try { const d = await apiHealth(st.cfg); setEngine(d && d.ok ? "ok" : "down"); }
    catch { setEngine("down"); }
    setBusy(false);
  }, [st.cfg.engineUrl, st.cfg.accessKey]);

  useEffect(() => { checkEngine(); }, [st.cfg.engineUrl]);

  useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);
  useEffect(() => { if (st.cfg.theme && st.cfg.theme !== theme) setTheme(st.cfg.theme); }, [st.cfg.theme]);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 2);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  useEffect(() => {
    const onResize = () => {
      const w = window.innerWidth;
      if (w <= 656) { setMini(false); setOpen(false); }
      else if (w <= 1000) { setMini(true); setOpen(true); }
      else { setMini(false); setOpen(true); }
    };
    onResize();
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const nav = (t, q) => {
    if (t === "search" && q) { setSearchQ(q); setPage("search"); }
    else setPage(t);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  const onSearch = (q) => { setSearchQ(q); setPage("search"); window.scrollTo({ top: 0 }); };
  const onPlay = (v) => { setCurVid(v); setPage("watch"); window.scrollTo({ top: 0 }); };
  const onChannel = (id, name) => { if (!id) return; setCurChannel({ id, name }); setPage("channel"); window.scrollTo({ top: 0 }); };
  const toggleGuide = () => {
    if (window.innerWidth <= 656) { setOpen(!open); return; }
    if (mini) setMini(false);
    else if (open) setMini(true);
    else setOpen(true);
  };
  const openSubModal = () => setSubModal(true);
  const afterSubAdd = () => { setSubsKey((k) => k + 1); };
  const toggleTheme = () => {
    const t = theme === "dark" ? "light" : "dark";
    setTheme(t);
    st.updCfg({ theme: t });
  };

  const mainClass = "main" + (mini ? " mini-margin" : "") + (!open && !mini ? " no-margin" : "");
  const needsSetup = engine === "down" && !st.cfg.engineUrl;
  const isWatch = page === "watch";

  return (
    <div className="layout">
      <Topbar onSearch={onSearch} onNav={nav} open={open} setOpen={toggleGuide} engine={engine} st={st}
        onAddSub={openSubModal} theme={theme} onTheme={toggleTheme} scrolled={scrolled} />
      <Sidebar page={page} nav={nav} st={st} open={open} mini={mini} onAddSub={openSubModal} onChannel={onChannel} />
      <div className={mainClass}>
        <div className="main-wrap">
          {needsSetup ? <SetupGate st={st} onRetry={checkEngine} busy={busy} /> : (
            <div className="page">
              <EngineBar status={engine} onSetup={() => nav("settings")} />
              {page === "home" && <HomePage onPlay={onPlay} st={st} engine={engine} onChannel={onChannel} onShorts={() => nav("shorts")} onSearch={onSearch} />}
              {page === "trending" && <HomePage onPlay={onPlay} st={st} engine={engine} onChannel={onChannel} onShorts={() => nav("shorts")} onSearch={onSearch} trending />}
              {page === "shorts" && (
                <ShortsPage st={st} engine={engine} onPlay={onPlay} onChannel={onChannel} onAddSub={openSubModal} />
              )}
              {page === "subscriptions" && (
                <SubsPage st={st} engine={engine} onPlay={onPlay} onChannel={onChannel} onAddSub={openSubModal} refreshKey={subsKey} />
              )}
              {page === "channel" && curChannel && (
                <ChannelPage channelId={curChannel.id} name={curChannel.name} st={st} engine={engine} onPlay={onPlay} onChannel={onChannel} />
              )}
              {page === "search" && <SearchPage query={searchQ} onPlay={onPlay} st={st} engine={engine} onChannel={onChannel} />}
              {isWatch && curVid && (
                <WatchPage video={curVid} onPlay={onPlay} st={st} engine={engine} onChannel={onChannel} onAddSub={openSubModal} />
              )}
              {page === "history" && <HistPage onPlay={onPlay} st={st} onChannel={onChannel} />}
              {page === "favorites" && <FavsPage onPlay={onPlay} st={st} onChannel={onChannel} />}
              {page === "watchlater" && <WLPage onPlay={onPlay} st={st} onChannel={onChannel} />}
              {page === "playlists" && <PLPage onPlay={onPlay} st={st} onChannel={onChannel} />}
              {page === "settings" && <SetPage st={st} engine={engine} onCheck={checkEngine} onAddSub={openSubModal} />}
            </div>
          )}
        </div>
      </div>
      {subModal && <AddSubModal st={st} engine={engine} onClose={() => setSubModal(false)} onAdded={afterSubAdd} />}
      <nav className="mnav">
        <button className={"mnav-item" + (page === "home" ? " act" : "")} onClick={() => nav("home")}>
          <span className="s-ico"><Icon d={I.home} size={24} /></span>Home
        </button>
        <button className={"mnav-item" + (page === "shorts" ? " act" : "")} onClick={() => nav("shorts")}>
          <span className="s-ico"><ShortsLogo size={24} /></span>Shorts
        </button>
        <button className="mnav-item" onClick={openSubModal}>
          <span className="s-ico"><Icon d={I.create} size={26} /></span>Create
        </button>
        <button className={"mnav-item" + (page === "subscriptions" ? " act" : "")} onClick={() => nav("subscriptions")}>
          <span className="s-ico"><Icon d={I.subs} size={24} /></span>Subs
        </button>
        <button className={"mnav-item" + (["settings", "history", "favorites", "watchlater", "playlists"].includes(page) ? " act" : "")} onClick={() => nav("settings")}>
          <span className="s-ico"><Icon d={I.person} size={24} /></span>You
        </button>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
