<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>StreamVoid · YouTube, apne player me</title>
<meta name="description" content="Serverless YouTube front-end: RSS subscriptions, custom player, no ads, no login."/>
<meta name="theme-color" content="#0f0f0f"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;
  --bg2:#181818;
  --bg3:#212121;
  --bg4:#272727;
  --border:#3f3f3f;
  --red:#ff0000;
  --red2:#cc0000;
  --t1:#f1f1f1;
  --t2:#aaa;
  --t3:#717171;
  --chip-bg:#272727;
  --chip-active:#f1f1f1;
  --sw:240px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t1);font-family:'Roboto',sans-serif;font-size:14px;line-height:1.5;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3f3f3f;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#555}
a{color:inherit;text-decoration:none}
button{font-family:'Roboto',sans-serif;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:'Roboto',sans-serif}
img{max-width:100%;display:block}

/* ── LAYOUT ── */
.layout{display:flex;min-height:100vh}
.sidebar{position:fixed;left:0;top:56px;bottom:0;width:var(--sw);background:var(--bg);display:flex;flex-direction:column;z-index:100;overflow-y:auto;overflow-x:hidden;padding:12px 0;transition:transform .2s ease}
.sidebar.mini{width:72px}
.sidebar.closed{transform:translateX(-100%)}
.main{flex:1;margin-left:var(--sw);min-width:0;display:flex;flex-direction:column;transition:margin .2s ease}
.main.mini-margin{margin-left:72px}
.main.no-margin{margin-left:0}

/* ── TOPBAR ── */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--bg);z-index:200;display:flex;align-items:center;padding:0 16px;gap:8px;border-bottom:1px solid transparent}
.tb-left{display:flex;align-items:center;gap:4px;flex-shrink:0}
.tb-menu-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--t1);transition:background .1s}
.tb-menu-btn:hover{background:var(--bg3)}
.tb-logo{display:flex;align-items:center;gap:4px;padding:0 14px}
.tb-logo-icon{background:var(--red);color:#fff;font-weight:900;font-size:18px;padding:2px 6px;border-radius:4px;letter-spacing:-1px}
.tb-logo-name{font-size:14px;font-weight:700;letter-spacing:-.5px;color:var(--t1)}
.tb-logo-in{font-size:9px;color:var(--t2);font-weight:400;align-self:flex-end;margin-bottom:1px}
.tb-search-wrap{flex:1;max-width:600px;margin:0 auto;display:flex;gap:8px}
.tb-search{flex:1;display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:40px 0 0 40px;padding:0 4px 0 16px;height:40px;transition:border-color .15s}
.tb-search:focus-within{border-color:#1c62b9}
.tb-search input{flex:1;background:none;border:none;outline:none;color:var(--t1);font-size:16px;min-width:0}
.tb-search input::placeholder{color:var(--t3)}
.tb-clr-btn{padding:4px 8px;color:var(--t2);font-size:18px;transition:color .1s}
.tb-clr-btn:hover{color:var(--t1)}
.tb-go{height:40px;width:64px;background:var(--bg3);border:1px solid var(--border);border-left:none;border-radius:0 40px 40px 0;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--t2);transition:background .1s}
.tb-go:hover{background:var(--bg4);color:var(--t1)}
.tb-right{margin-left:auto;flex-shrink:0;display:flex;align-items:center;gap:8px}
.tb-icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--t1);transition:background .1s}
.tb-icon-btn:hover{background:var(--bg3)}
.main-wrap{margin-top:56px}

/* ── SIDEBAR ITEMS ── */
.s-group{margin-bottom:10px}
.s-divider{height:1px;background:var(--border);margin:8px 16px}
.s-label{font-size:11px;font-weight:500;color:var(--t3);padding:8px 24px 4px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden}
.sidebar.mini .s-label{display:none}
.s-item{display:flex;align-items:center;gap:24px;padding:0 24px;height:40px;border-radius:10px;margin:0 12px;color:var(--t2);font-size:13.5px;font-weight:400;transition:background .1s;white-space:nowrap;overflow:hidden}
.sidebar.mini .s-item{gap:0;padding:0;justify-content:center;margin:0 4px;border-radius:10px}
.s-item:hover{background:var(--bg3);color:var(--t1)}
.s-item.act{background:var(--bg3);color:var(--t1);font-weight:500}
.s-ico{font-size:20px;flex-shrink:0;width:24px;text-align:center}
.s-lbl{overflow:hidden;text-overflow:ellipsis}
.sidebar.mini .s-lbl{display:none}
.s-cnt{margin-left:auto;font-size:11px;background:var(--bg4);padding:1px 6px;border-radius:10px;color:var(--t3)}
.sidebar.mini .s-cnt{display:none}

/* ── CHIPS (suggestion style) ── */
.chips-bar{display:flex;gap:8px;overflow-x:auto;padding:12px 24px;scrollbar-width:none;position:sticky;top:56px;z-index:90;background:var(--bg)}
.chips-bar::-webkit-scrollbar{display:none}
.chip{padding:0 12px;height:32px;border-radius:8px;font-size:14px;font-weight:500;background:var(--chip-bg);color:var(--t1);white-space:nowrap;flex-shrink:0;transition:background .1s}
.chip:hover{background:#3f3f3f}
.chip.act{background:var(--chip-active);color:#0f0f0f}

/* ── VIDEO GRID ── */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px 8px;padding:8px 24px 40px}
.vlist{display:flex;flex-direction:column;gap:0;padding:8px 24px 40px}

/* ── VIDEO CARD ── */
.vc{cursor:pointer;border-radius:12px;animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.vc:hover .vc-thumb-img{border-radius:0}
.vc-thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--bg3)}
.vc-thumb-img{width:100%;height:100%;object-fit:cover;transition:border-radius .2s,transform .3s}
.vc:hover .vc-thumb-img{transform:scale(1.02)}
.vc-dur{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;padding:2px 4px;border-radius:4px}
.vc-body{display:flex;gap:12px;padding:12px 8px 8px}
.vc-av{width:36px;height:36px;border-radius:50%;background:var(--bg3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--t1)}
.vc-av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.vc-meta{flex:1;min-width:0}
.vc-title{font-size:14px;font-weight:500;line-height:1.4;color:var(--t1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.vc-channel{font-size:13px;color:var(--t2);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vc-info{font-size:13px;color:var(--t2);display:flex;align-items:center;gap:4px}
.vc-dot{margin:0 2px}
.vc-more-btn{opacity:0;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t1);font-size:18px;flex-shrink:0;transition:all .1s;align-self:flex-start;margin-top:8px}
.vc:hover .vc-more-btn{opacity:1}
.vc-more-btn:hover{background:var(--bg3)}
.vc-menu{position:absolute;top:44px;right:8px;background:var(--bg3);border-radius:12px;padding:8px 0;z-index:50;min-width:200px;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.vc-mi{display:flex;align-items:center;gap:16px;padding:8px 16px;font-size:14px;color:var(--t1);transition:background .1s;width:100%}
.vc-mi:hover{background:var(--bg4)}
.vc-mi-ico{font-size:20px;width:24px;text-align:center}

/* LIST ROW */
.vc-row{display:flex;gap:8px;padding:8px;border-radius:12px;transition:background .1s;position:relative}
.vc-row:hover{background:var(--bg3)}
.vc-row .vc-thumb{width:168px;flex-shrink:0;border-radius:8px;aspect-ratio:16/9}
.vc-row .vc-body{flex:1;padding:0;flex-direction:column}
.vc-row .vc-av{display:none}
.vc-row .vc-meta{flex:1}

/* ── SKEL ── */
.skel{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:400px 100%;animation:shim 1.5s infinite;border-radius:4px}
@keyframes shim{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px 8px;padding:8px 24px}

/* ── WATCH PAGE ── */
.watch{display:flex;gap:24px;padding:24px;max-width:1600px;margin:0 auto}
.watch-main{flex:1;min-width:0}
.watch-player{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.watch-player iframe{width:100%;height:100%;border:none;display:block}
/* native player */
.pl-wrap{position:relative;width:100%;height:100%;background:#000}
.pl-video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.pl-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;background:rgba(0,0,0,.72);color:#fff;z-index:2}
.pl-overlay-t{font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px}
.pl-overlay-s{font-size:13px;color:#cfcfcf;max-width:520px;line-height:1.5;word-break:break-word}
.pl-spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#3ea6ff;animation:spn .8s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.pl-ov-btn{padding:0 16px;height:34px;border-radius:18px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;transition:background .1s}
.pl-ov-btn:hover{background:rgba(255,255,255,.26)}
.pl-srcbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 4px 0;font-size:12px;color:var(--t2)}
.pl-src{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:10px;background:var(--bg3);color:var(--t2);font-size:12px}
.pl-src.ok{color:#7ee787;background:rgba(76,175,80,.12)}
.pl-src-mono{font-family:monospace;font-size:11px;color:var(--t3)}
.pl-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;height:100%;color:#ddd;text-align:center;padding:24px;background:#0a0a0a}
.pl-fallback-t{font-size:16px;font-weight:500;color:#fff}
.pl-fallback-s{font-size:13px;color:#9a9a9a;max-width:420px;line-height:1.55}
.pl-fallback-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pl-fb-btn{padding:0 18px;height:38px;border-radius:19px;background:#fff;color:#0f0f0f;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.pl-fb-btn.ghost{background:rgba(255,255,255,.13);color:#fff}
.pl-fb-btn.ghost:hover{background:rgba(255,255,255,.24)}
.watch-title{font-size:20px;font-weight:600;line-height:1.4;margin:12px 0 8px}
.watch-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.watch-info-left{font-size:14px;color:var(--t2)}
.watch-btns{display:flex;gap:8px;flex-wrap:wrap}
.w-btn{display:flex;align-items:center;gap:6px;padding:0 16px;height:36px;border-radius:18px;font-size:14px;font-weight:500;background:var(--bg3);color:var(--t1);transition:background .1s}
.w-btn:hover{background:var(--bg4)}
.w-btn.on{background:var(--t1);color:var(--bg)}
.watch-ch-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:12px}
.watch-ch-av{width:40px;height:40px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.watch-ch-name{font-size:15px;font-weight:500}
.watch-ch-sub{font-size:13px;color:var(--t2)}
.watch-desc-box{background:var(--bg3);border-radius:12px;padding:12px;margin-bottom:12px;cursor:pointer}
.watch-desc-box:hover{background:var(--bg4)}
.watch-desc-short{font-size:14px;color:var(--t1);line-height:1.5}
.watch-desc-full{font-size:14px;color:var(--t1);line-height:1.6;white-space:pre-wrap;margin-top:8px}
.watch-desc-tog{font-size:13px;font-weight:500;margin-top:8px}
.watch-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.watch-tag{color:#3ea6ff;font-size:14px}
.watch-side{flex:0 0 402px;min-width:0}
.watch-side-title{font-size:16px;font-weight:500;margin-bottom:12px}
.watch-side-list{display:flex;flex-direction:column;gap:2px}

/* ── LIBRARY ── */
.lib-pg{padding:24px;max-width:1200px}
.lib-hd{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.lib-title{font-size:20px;font-weight:400;flex:1}
.lib-cnt{font-size:13px;color:var(--t2);background:var(--bg3);padding:2px 10px;border-radius:10px}
.lib-btn{display:flex;align-items:center;gap:6px;padding:0 16px;height:36px;border-radius:18px;font-size:14px;background:var(--bg3);color:var(--t1);transition:background .1s}
.lib-btn:hover{background:var(--bg4)}
.lib-btn.danger:hover{background:#3d1f1f;color:#f28b82}
.lib-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:100px 24px;text-align:center}
.lib-empty-ico{font-size:64px;opacity:.2}
.lib-empty-title{font-size:18px;font-weight:400;color:var(--t2)}
.lib-empty-sub{font-size:14px;color:var(--t3);max-width:280px}
.lib-row{position:relative;display:flex;align-items:flex-start}
.lib-row>*:first-child{flex:1;min-width:0}
.lib-rm{margin:14px 0 0 4px;color:var(--t3);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:all .1s}
.lib-rm:hover{background:var(--bg3);color:var(--t1)}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.pl-card{background:var(--bg2);border-radius:12px;overflow:hidden;cursor:pointer;animation:fadeIn .3s ease both;transition:background .1s;position:relative}
.pl-card:hover{background:var(--bg3)}
.pl-thumb{aspect-ratio:16/9;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;overflow:hidden}
.pl-thumb img{width:100%;height:100%;object-fit:cover;opacity:.8}
.pl-cnt{position:absolute;bottom:4px;right:6px;font-size:12px;font-weight:500;color:#fff;background:rgba(0,0,0,.8);padding:2px 4px;border-radius:4px}
.pl-info{padding:12px}
.pl-name{font-size:14px;font-weight:500;margin-bottom:2px}
.pl-sub{font-size:13px;color:var(--t2)}
.pl-rm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--t2);transition:all .1s;opacity:0}
.pl-card:hover .pl-rm{opacity:1}
.pl-rm:hover{color:#f28b82}
.pl-back{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--t2);padding:0 12px;height:36px;border-radius:18px;transition:background .1s;margin-right:8px}
.pl-back:hover{background:var(--bg3);color:var(--t1)}
.new-pl{display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.new-pl input{background:transparent;border:1px solid var(--border);border-radius:4px;padding:8px 12px;color:var(--t1);font-size:14px;outline:none;width:280px;transition:border-color .15s}
.new-pl input:focus{border-color:#3ea6ff}
.new-pl input::placeholder{color:var(--t3)}

/* ── SETTINGS ── */
.set-pg{padding:24px;max-width:720px}
.set-title{font-size:20px;font-weight:400;margin-bottom:24px}
.set-blk{background:var(--bg2);border-radius:12px;padding:20px;margin-bottom:16px}
.set-blk-title{font-size:16px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.set-blk-desc{font-size:13px;color:var(--t2);margin-bottom:16px;line-height:1.6}
.set-api-row{display:flex;gap:8px;margin-bottom:12px}
.set-api-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px 12px;color:var(--t1);font-size:14px;outline:none;transition:border-color .15s;font-family:monospace}
.set-api-row input:focus{border-color:#3ea6ff}
.set-api-row input::placeholder{color:var(--t3);font-family:'Roboto',sans-serif}
.set-api-btn{padding:0 20px;height:40px;background:#3ea6ff;color:#0f0f0f;border-radius:4px;font-size:14px;font-weight:500;transition:background .1s;white-space:nowrap}
.set-api-btn:hover{background:#65beff}
.set-hint{font-size:13px;color:var(--t3);line-height:1.8}
.set-hint a{color:#3ea6ff}
.tog-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.tog-lbl{font-size:14px;font-weight:500}
.tog-sub{font-size:12px;color:var(--t2);margin-top:1px}
.toggle{width:44px;height:24px;background:var(--bg4);border-radius:12px;position:relative;transition:background .2s;cursor:pointer;flex-shrink:0}
.toggle.on{background:#3ea6ff}
.tok{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.toggle.on .tok{left:22px}
.priv-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.priv-item:last-child{border-bottom:none}
.priv-ico{color:#4caf50;font-size:18px;margin-top:2px;flex-shrink:0}
.priv-name{font-size:14px;font-weight:500;margin-bottom:2px}
.priv-sub{font-size:13px;color:var(--t2);line-height:1.5}
.danger-btn{display:flex;align-items:center;gap:8px;padding:0 16px;height:36px;border-radius:18px;font-size:14px;background:transparent;border:1px solid var(--border);color:#f28b82;transition:all .1s;margin-top:12px}
.danger-btn:hover{background:#3d1f1f;border-color:#f28b82}
.saved-toast{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#4caf50;padding:4px 12px;background:rgba(76,175,80,.1);border-radius:10px;margin-left:12px}

/* ── API BANNER ── */
.api-banner{margin:0 24px 0;padding:12px 16px;background:rgba(62,166,255,.08);border:1px solid rgba(62,166,255,.2);border-radius:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.api-banner.ok{background:rgba(76,175,80,.08);border-color:rgba(76,175,80,.2)}
.api-b-title{font-size:14px;font-weight:500;color:#3ea6ff;margin-bottom:2px}
.api-b-title.ok{color:#4caf50}
.api-b-sub{font-size:12px;color:var(--t2)}
.api-b-inp{flex:2;min-width:200px;display:flex;gap:8px}
.api-b-inp input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:8px 12px;color:var(--t1);font-size:13px;outline:none;transition:border-color .15s}
.api-b-inp input:focus{border-color:#3ea6ff}
.api-b-inp input::placeholder{color:var(--t3)}
.api-b-btn{padding:0 14px;height:36px;background:#3ea6ff;color:#0f0f0f;border-radius:4px;font-size:13px;font-weight:500;white-space:nowrap;transition:background .1s}
.api-b-btn:hover{background:#65beff}

/* ── STATES ── */
.err-box{display:flex;flex-direction:column;align-items:center;gap:16px;padding:80px 24px;text-align:center}
.err-ico{font-size:48px;opacity:.4}
.err-msg{font-size:14px;color:var(--t2);max-width:360px;line-height:1.6}

/* ══ CUSTOM PLAYER (YouTube-accurate) ═══════════════════════════════════════ */
.cp{position:relative;width:100%;height:100%;background:#000;overflow:hidden;user-select:none;outline:none;
  --cp-btn:48px; --cp-ico:26px}
.cp.cp-hide-cursor{cursor:none}
.cp video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.cp-stage{position:absolute;inset:0;z-index:2;background:transparent}

/* top gradient */
.cp-top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px 34px;background:linear-gradient(rgba(0,0,0,.72),transparent);
  opacity:1;transition:opacity .2s;pointer-events:none}
.cp-top.hidden{opacity:0}
.cp-title{flex:1;min-width:0;color:#fff;font-size:18px;font-weight:500;line-height:1.35;
  text-shadow:0 1px 3px rgba(0,0,0,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-top-actions{display:flex;align-items:center;gap:4px;pointer-events:auto}
.cp-top-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;background:rgba(0,0,0,.28);transition:background .12s,transform .12s}
.cp-top-btn:hover{background:rgba(0,0,0,.6);transform:scale(1.05)}
.cp-top-btn svg{fill:#fff}

/* bottom gradient */
.cp-ui{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:28px 12px 8px;
  background:linear-gradient(transparent,rgba(0,0,0,.5) 30%,rgba(0,0,0,.86));
  opacity:1;transition:opacity .2s}
.cp-ui.hidden{opacity:0;pointer-events:none}

/* progress */
.cp-bar{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.cp-bar-track{position:relative;height:4px;width:100%;background:rgba(255,255,255,.3);border-radius:2px;transition:height .1s}
.cp-bar:hover .cp-bar-track{height:6px}
.cp-buf{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.45);border-radius:2px}
.cp-played{position:absolute;left:0;top:0;bottom:0;background:#f00;border-radius:2px;transition:width .08s linear}
.cp-knob{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#f00;
  transform:translate(-50%,-50%) scale(0);transition:transform .1s;box-shadow:0 0 6px rgba(0,0,0,.6)}
.cp-bar:hover .cp-knob{transform:translate(-50%,-50%) scale(1)}
.cp-tip{position:absolute;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,.92);color:#fff;
  font-size:12px;font-weight:500;padding:3px 7px;border-radius:4px;pointer-events:none;white-space:nowrap}

/* control row — YouTube metrics */
.cp-row{display:flex;align-items:center;gap:2px;height:var(--cp-btn);margin-top:2px}
.cp-btn{width:var(--cp-btn);height:var(--cp-btn);border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:#fff;opacity:.98;transition:background .12s,transform .1s}
.cp-btn:hover{background:rgba(255,255,255,.16)}
.cp-btn:active{transform:scale(.94)}
.cp-btn svg{fill:#fff}
.cp-ico{fill:currentColor}
.cp-btn.on{background:rgba(255,255,255,.18)}
.cp-btn-main svg{margin-left:1px}
.cp-time{font-size:13px;color:#fff;font-variant-numeric:tabular-nums;margin:0 10px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cp-time-sep{opacity:.55;margin:0 2px}
.cp-badge{font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border-radius:4px;padding:3px 7px;margin-left:4px}
.cp-spacer{flex:1}
.cp-vol-wrap{display:flex;align-items:center}
.cp-vol{width:0;overflow:hidden;transition:width .18s ease;display:flex;align-items:center}
.cp-vol-wrap:hover .cp-vol,.cp-vol.open{width:84px}
.cp-vol input{width:78px;accent-color:#fff;cursor:pointer}

/* centre play + loading */
.cp-big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:none}
.cp-bigplay{pointer-events:auto;width:82px;height:82px;border-radius:50%;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s}
.cp-bigplay:hover{background:#f00;transform:scale(1.06)}
.cp-bigplay svg{fill:#fff;margin-left:5px}
.cp-big-icon{width:84px;height:84px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;animation:cpPop .45s ease forwards}
.cp-big-icon svg{fill:#fff}
@keyframes cpPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.cp-spin{width:56px;height:56px;border:4px solid rgba(255,255,255,.22);border-top-color:#f00;border-radius:50%;animation:cpSpn .8s linear infinite}
@keyframes cpSpn{to{transform:rotate(360deg)}}
.cp-loadtxt{position:absolute;left:0;right:0;bottom:92px;text-align:center;color:#ccc;font-size:13px;z-index:4}

/* double-tap skip animation (YouTube style) */
.cp-skip-fx{position:absolute;top:0;bottom:0;width:38%;z-index:3;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;pointer-events:none;
  background:radial-gradient(circle at center,rgba(255,255,255,.18),transparent 70%);
  animation:cpSkipFade .7s ease forwards}
.cp-skip-fx.left{left:0;border-radius:0 50% 50% 0}
.cp-skip-fx.right{right:0;border-radius:50% 0 0 50%}
.cp-skip-ring{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;
  color:#fff;animation:cpSkipSpin .7s ease}
.cp-skip-ring svg{fill:#fff}
.cp-skip-txt{color:#fff;font-size:12.5px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.8)}
@keyframes cpSkipSpin{from{transform:scale(.85)}50%{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes cpSkipFade{0%{opacity:0}18%{opacity:1}72%{opacity:1}100%{opacity:0}}

/* settings panel */
.cp-menu{position:absolute;right:12px;bottom:60px;min-width:320px;max-width:min(340px,92vw);
  background:rgba(28,28,28,.97);backdrop-filter:blur(8px);border-radius:12px;padding:8px 0;
  z-index:8;box-shadow:0 12px 40px rgba(0,0,0,.75);max-height:min(72vh,520px);overflow-y:auto}
.cp-menu-title{font-size:15px;font-weight:500;color:#fff;padding:8px 18px 10px}
.cp-menu-head{display:flex;align-items:center;gap:8px;padding:6px 10px 10px;font-size:15px;font-weight:500;color:#fff}
.cp-back{width:34px;height:34px;border-radius:50%;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center}
.cp-back:hover{background:rgba(255,255,255,.12)}
.cp-mi{display:flex;align-items:center;gap:12px;width:100%;padding:10px 18px;min-height:44px;font-size:14.5px;
  color:#eee;text-align:left}
.cp-mi:hover{background:rgba(255,255,255,.1)}
.cp-mi.sel{color:#3ea6ff}
.cp-mi svg{fill:currentColor;flex-shrink:0}
.cp-mi-lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.25}
.cp-mi-sub{font-size:11.5px;color:#9a9a9a;font-weight:400}
.cp-mi.sel .cp-mi-sub{color:#7fb9e8}
.cp-mi-val{margin-left:auto;color:#aaa;font-size:13px;white-space:nowrap}
.cp-check-space{width:18px;flex-shrink:0}
.cp-menu-foot{font-size:11px;color:#8a8a8a;padding:10px 18px 6px;border-top:1px solid rgba(255,255,255,.08);margin-top:6px}
.cp-speed-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:2px 14px 10px}
.cp-speed{font-size:12.5px;padding:9px 0;border-radius:8px;background:rgba(255,255,255,.09);color:#eee;text-align:center;font-variant-numeric:tabular-nums}
.cp-speed:hover{background:rgba(255,255,255,.18)}
.cp-speed.sel{background:#3ea6ff;color:#062033;font-weight:700}
.cp-switch{position:relative;width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,.24);flex-shrink:0;transition:background .15s}
.cp-switch[data-on="1"]{background:#3ea6ff}
.cp-switch-dot{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.cp-switch[data-on="1"] .cp-switch-dot{transform:translateX(16px)}

/* error */
.cp-err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:#0b0b0b;color:#ddd;text-align:center;padding:24px;z-index:7}
.cp-pill{padding:0 16px;height:36px;border-radius:18px;background:#fff;color:#0f0f0f;font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;gap:6px}
.cp-pill.ghost{background:rgba(255,255,255,.14);color:#fff}
.cp-pill.ghost:hover{background:rgba(255,255,255,.24)}

/* fullscreen + theater tuning: bigger hit targets like YouTube */
.cp:fullscreen{--cp-btn:52px}
.cp:fullscreen .cp-row{height:52px}
.cp:fullscreen .cp-title{font-size:20px}
@media (max-width:720px){
  .cp{--cp-btn:42px}
  .cp-row{height:42px;gap:0}
  .cp-time{font-size:12px;margin:0 6px}
  .cp-menu{right:8px;bottom:52px;min-width:0;width:calc(100% - 16px)}
  .cp-menu-title,.cp-mi{font-size:14px}
  .cp-top-btn{width:34px;height:34px}
}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ════════════════════════════════════════════════════════════════════════════
   CONFIG + utils
   ════════════════════════════════════════════════════════════════════════════ */
const DEFAULT_CFG = {
  engineUrl: "",
  accessKey: "",
  autoplay: true,
  showRelated: true,
  theater: false,
  volume: 1,
  muted: false,
  rate: 1,
  zoom: "fit",
  pitch: true,
  region: "IN",
};

// player: 3× top speed, and the fit/zoom presets YouTube offers
const SPEEDS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3];
const ZOOM_LIST = [
  { k: "fit", l: "Fit to screen" },
  { k: "fill", l: "Fill width" },
  { k: "1.25", l: "Zoom 125%" },
  { k: "1.5", l: "Zoom 150%" },
  { k: "2", l: "Zoom 200%" },
];

const ls = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const ss = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const YTT = (id, q) => `https://i.ytimg.com/vi/${id}/${q || "mqdefault"}.jpg`;
const YTW = (id) => `https://www.youtube.com/watch?v=${id}`;
const YTC = (id) => `https://www.youtube.com/channel/${id}`;

const fv = (n) => {
  n = Number(n) || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
};
const fd = (s) => {
  s = Math.max(0, Math.floor(Number(s) || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`;
};
const parseDur = (v) => {
  if (v.lengthSeconds) return v.lengthSeconds;
  const p = String(v.lengthText || "").split(":").map(Number);
  return p.length ? p.reduce((a, b) => a * 60 + b, 0) : 0;
};
const ago = (ts, text) => {
  if (text) return text;
  if (!ts) return "";
  const d = Date.now() / 1000 - ts;
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d / 60) + " min ago";
  if (d < 86400) return Math.floor(d / 3600) + " hours ago";
  if (d < 604800) return Math.floor(d / 86400) + " days ago";
  if (d < 2592000) return Math.floor(d / 604800) + " weeks ago";
  if (d < 31536000) return Math.floor(d / 2592000) + " months ago";
  return Math.floor(d / 31536000) + " years ago";
};
const dayKey = (ts) => {
  if (!ts) return "Earlier";
  const d = new Date(ts * 1000);
  const today = new Date();
  const y = new Date(Date.now() - 86400000);
  if (d.toDateString() === today.toDateString()) return "Today";
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: d.getFullYear() === today.getFullYear() ? undefined : "numeric" });
};
const uid = () => Math.random().toString(36).slice(2, 10);

/* ════════════════════════════════════════════════════════════════════════════
   ENGINE (Cloudflare Worker)
   ════════════════════════════════════════════════════════════════════════════ */
const baseOf = (cfg) => String((cfg && cfg.engineUrl) || "").replace(/\/+$/, "");
const mediaUrl = (cfg, u) => (!u ? "" : /^https?:/i.test(u) ? u : baseOf(cfg) + u);

async function ep(cfg, path, timeout = 25000) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), timeout);
  try {
    const key = String((cfg && cfg.accessKey) || "").trim();
    const withKey = key ? path + (path.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(key) : path;
    const r = await fetch(baseOf(cfg) + withKey, { signal: ac.signal, headers: { Accept: "application/json" } });
    const text = await r.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { throw new Error("engine returned non-JSON (worker URL check karein)"); }
    if (!r.ok) throw new Error((data && (data.error || data.detail)) || "engine HTTP " + r.status);
    return data;
  } finally { clearTimeout(t); }
}

const apiHealth = (cfg) => ep(cfg, "/api/health", 6000);
const apiSearch = (cfg, q) => ep(cfg, "/api/search?q=" + encodeURIComponent(q));
const apiSearchMore = (cfg, q, token) => ep(cfg, "/api/searchmore?q=" + encodeURIComponent(q) + "&token=" + encodeURIComponent(token));
const apiTrending = (cfg, region) => ep(cfg, "/api/trending?region=" + encodeURIComponent(region || "IN"));
const apiRelated = (cfg, id) => ep(cfg, "/api/related?id=" + encodeURIComponent(id));
const apiShorts = (cfg, region) => ep(cfg, "/api/shorts?region=" + encodeURIComponent(region || "IN"), 20000);
const apiPlayer = (cfg, id) => ep(cfg, "/api/player?id=" + encodeURIComponent(id), 30000);
const apiRss = (cfg, ids) => ep(cfg, "/api/rss?channels=" + encodeURIComponent(ids.join(",")), 30000);
const apiChannel = (cfg, q) => ep(cfg, "/api/channel?q=" + encodeURIComponent(q), 20000);


/* ════════════════════════════════════════════════════════════════════════════
   RECOMMENDATION ENGINE — client-side, keyless
   Signals: YouTube's own "next" list · channels you watch (via RSS) ·
            subscriptions · freshness · popularity. No tracking, all local.
   ════════════════════════════════════════════════════════════════════════════ */
const REC_TTL = 5 * 60 * 1000;
const recCache = new Map();

function recAffinity(hist, excludeId) {
  const counts = new Map();
  for (const v of hist || []) {
    if (!v || !v.authorId || v.authorId === excludeId) continue;
    counts.set(v.authorId, (counts.get(v.authorId) || 0) + 1);
  }
  return counts;
}

function recScore(v, ctx) {
  let s = 0;
  const aff = ctx.counts.get(v.authorId) || 0;
  s += Math.min(24, aff * 8); // how often you watch this channel
  if (ctx.subs.has(v.authorId)) s += 10; // explicit intent
  if (v.viewCount > 0) s += Math.min(10, Math.log10(Math.max(10, v.viewCount)) * 2.5);
  if (v.published) {
    const hrs = (Date.now() / 1000 - v.published) / 3600;
    if (hrs >= 0) s += Math.max(0, 12 - hrs / 24); // fresh uploads first
  }
  if (v.isShort) s -= 6; // keep the watch-page rail long-form
  return s;
}

function recMerge(groups, ctx, exclude, limit = 20) {
  const out = new Map();
  for (const g of groups) {
    for (const v of g.items || []) {
      if (!v || !v.videoId || exclude.has(v.videoId)) continue;
      const score = g.base + recScore(v, ctx);
      const prev = out.get(v.videoId);
      if (prev && prev.__score >= score) continue;
      out.set(v.videoId, {
        ...v,
        recReason: typeof g.reason === "function" ? g.reason(v) : g.reason,
        __score: score,
      });
    }
  }
  return [...out.values()]
    .sort((a, b) => b.__score - a.__score)
    .slice(0, limit)
    .map(({ __score, ...v }) => v);
}

async function recommendFor(cfg, video, st) {
  const hit = recCache.get("v:" + video.videoId);
  if (hit && Date.now() - hit.ts < REC_TTL) return hit.data;

  const counts = recAffinity(st.hist, null);
  const subs = new Set((st.subs || []).map((x) => x.channelId));
  const ctx = { counts, subs };
  const top = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([id]) => id);
  const feedIds = [...new Set([video.authorId, ...top].filter(Boolean))].slice(0, 8);

  const [rel, feed, trend] = await Promise.all([
    apiRelated(cfg, video.videoId).then((d) => d.items || []).catch(() => []),
    feedIds.length ? apiRss(cfg, feedIds).then((d) => d.items || []).catch(() => []) : [],
    (st.hist || []).length === 0 ? apiTrending(cfg, cfg.region).then((d) => d.items || []).catch(() => []) : [],
  ]);

  const items = recMerge(
    [
      { items: rel, base: 58, reason: (v) => (subs.has(v.authorId) ? "From a channel you follow" : "Related to this video") },
      { items: feed.filter((v) => v.authorId && v.authorId !== video.authorId), base: 44, reason: (v) => "Because you watch " + (v.author || "this channel") },
      { items: feed.filter((v) => v.authorId && v.authorId === video.authorId), base: 52, reason: (v) => "More from " + (v.author || video.author || "this channel") },
      { items: trend, base: 20, reason: "Trending now" },
    ],
    ctx,
    new Set([video.videoId]),
    20
  );

  const data = { items, affinity: top.slice(0, 3) };
  recCache.set("v:" + video.videoId, { ts: Date.now(), data });
  return data;
}

async function recommendHome(cfg, st) {
  const hit = recCache.get("home");
  if (hit && Date.now() - hit.ts < REC_TTL) return hit.data;

  const counts = recAffinity(st.hist, null);
  const subs = new Set((st.subs || []).map((x) => x.channelId));
  const ids = [...new Set([...subs, ...[...counts.entries()].sort((a, b) => b[1] - a[1]).map(([id]) => id)])].slice(0, 8);

  const [feed, trend] = await Promise.all([
    ids.length ? apiRss(cfg, ids).then((d) => d.items || []).catch(() => []) : [],
    apiTrending(cfg, cfg.region).then((d) => d.items || []).catch(() => []),
  ]);

  const items = recMerge(
    [
      { items: feed, base: 40, reason: (v) => (subs.has(v.authorId) ? "New from " + (v.author || "a channel you follow") : "Because you watch " + (v.author || "this channel")) },
      { items: trend, base: 18, reason: "Trending now" },
    ],
    { counts, subs },
    new Set(),
    12
  );

  const data = { items };
  recCache.set("home", { ts: Date.now(), data });
  return data;
}

/* ════════════════════════════════════════════════════════════════════════════
   ICONS
   ════════════════════════════════════════════════════════════════════════════ */
const I = {
  play: "M8 5v14l11-7z",
  pause: "M6 19h4V5H6v14zm8-14v14h4V5h-4z",

/* ════════════════════════════════════════════════════════════════════════════
   STORE
   ════════════════════════════════════════════════════════════════════════════ */
function useStore() {
  const [hist, setHist] = useState(() => ls("sv_h", []));
  const [favs, setFavs] = useState(() => ls("sv_f", []));
  const [wl, setWl] = useState(() => ls("sv_w", []));
  const [pls, setPls] = useState(() => ls("sv_p", []));
  const [subs, setSubs] = useState(() => ls("sv_subs", []));
  const [cfg, setCfg] = useState(() => ({ ...DEFAULT_CFG, ...ls("sv_cfg", {}) }));

  const addHist = useCallback((v) => {
    setHist((h) => { const n = [v, ...h.filter((x) => x.videoId !== v.videoId)].slice(0, 300); ss("sv_h", n); return n; });
  }, []);
  const clrHist = () => { setHist([]); ss("sv_h", []); };
  const rmHist = (id) => setHist((h) => { const n = h.filter((v) => v.videoId !== id); ss("sv_h", n); return n; });
  const togFav = (v) => setFavs((f) => { const n = f.some((x) => x.videoId === v.videoId) ? f.filter((x) => x.videoId !== v.videoId) : [v, ...f]; ss("sv_f", n); return n; });
  const isFav = (id) => favs.some((v) => v.videoId === id);
  const togWL = (v) => setWl((w) => { const n = w.some((x) => x.videoId === v.videoId) ? w.filter((x) => x.videoId !== v.videoId) : [v, ...w]; ss("sv_w", n); return n; });
  const isWL = (id) => wl.some((v) => v.videoId === id);
  const mkPL = (nm) => setPls((p) => { const n = [...p, { id: uid(), name: nm, videos: [] }]; ss("sv_p", n); return n; });
  const rmPL = (id) => setPls((p) => { const n = p.filter((x) => x.id !== id); ss("sv_p", n); return n; });

  /* ── subscriptions (channel metadata cached locally, videos from RSS) ── */
  const addSub = (ch) => setSubs((s) => {
    if (!ch || !ch.channelId || s.some((x) => x.channelId === ch.channelId)) return s;
    const n = [...s, { channelId: ch.channelId, name: ch.name || ch.channelId, avatar: ch.avatar || "", addedAt: Date.now() }];
    ss("sv_subs", n); return n;
  });
  const removeSub = (id) => setSubs((s) => { const n = s.filter((x) => x.channelId !== id); ss("sv_subs", n); return n; });
  const isSub = (id) => !!id && subs.some((x) => x.channelId === id);
  const setSubsRaw = (list) => { ss("sv_subs", list); setSubs(list); };

  const updCfg = useCallback((patch) => setCfg((c) => { const n = { ...c, ...patch }; ss("sv_cfg", n); return n; }), []);
  return {
    hist, addHist, clrHist, rmHist, favs, togFav, isFav, wl, togWL, isWL, pls, mkPL, rmPL,
    subs, addSub, removeSub, isSub, setSubsRaw, cfg, updCfg,
  };
}

const AV_COLORS = ["#ff4e45", "#ff8c00", "#ffd600", "#4caf50", "#2196f3", "#9c27b0", "#e91e63", "#00bcd4"];
const avColor = (name) => AV_COLORS[(String(name || "A").charCodeAt(0) || 65) % AV_COLORS.length];

function Av({ name, src, size = 36, cls = "" }) {
  return (
    <div className={"av " + cls} style={{ width: size, height: size, background: src ? "var(--bg3)" : avColor(name), fontSize: Math.round(size * 0.42) }}>

/* ════════════════════════════════════════════════════════════════════════════
   VIDEO CARD
   ════════════════════════════════════════════════════════════════════════════ */
function VCard({ v, onPlay, layout = "grid", st, onChannel, showAv = true }) {
  const [menu, setMenu] = useState(false);
  const menuRef = useRef();
  useEffect(() => {
    if (!menu) return;
    const h = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenu(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [menu]);
  if (!v || !v.videoId) return null;
  const row = layout === "list";
  const dur = parseDur(v);
  const thumb = v.thumbnail || YTT(v.videoId);
  const fav = st.isFav(v.videoId), wl = st.isWL(v.videoId);
  const act = (e, a) => { e.stopPropagation(); a === "fav" ? st.togFav(v) : st.togWL(v); setMenu(false); };

  return (
    <div className={"vc" + (row ? " vc-row" : "")} onClick={() => onPlay(v)}>
      <div className="vc-thumb">
        <img className="vc-thumb-img" src={thumb} alt="" loading="lazy" onError={(e) => { e.currentTarget.src = YTT(v.videoId); }} />
        {dur > 0 && <span className="vc-dur">{fd(dur)}</span>}
        {v.live && <span className="vc-live">LIVE</span>}
        {v.isShort && !v.live && <span className="vc-short">Shorts</span>}
      </div>
      <div className="vc-body">
        {!row && showAv && (
          <div className="vc-av-wrap" onClick={(e) => { if (onChannel && v.authorId) { e.stopPropagation(); onChannel(v.authorId, v.author); } }}>
            <Av name={v.author} size={36} />
          </div>
        )}
        <div className="vc-meta">
          <div className="vc-title">{v.title}</div>
          <div className="vc-channel" onClick={(e) => { if (onChannel && v.authorId) { e.stopPropagation(); onChannel(v.authorId, v.author); } }}>{v.author}</div>
          <div className="vc-info">
            {v.viewCount > 0 && <span>{fv(v.viewCount)} views</span>}
            {(v.viewCount > 0 && (v.publishedText || v.published)) && <span className="vc-dot">•</span>}
            {(v.publishedText || v.published) && <span>{ago(v.published, v.publishedText)}</span>}
          </div>
          {v.recReason && <div className="vc-reason">{v.recReason}</div>}
        </div>
        <button className="vc-more-btn" onClick={(e) => { e.stopPropagation(); setMenu(!menu); }} aria-label="Menu">⋮</button>
      </div>
      {menu && (
        <div className="vc-menu" ref={menuRef} onClick={(e) => e.stopPropagation()}>
          <button className="vc-mi" onClick={(e) => act(e, "wl")}><span className="vc-mi-ico">🕓</span>{wl ? "Remove from Watch later" : "Save to Watch later"}</button>
          <button className="vc-mi" onClick={(e) => act(e, "fav")}><Icon d={I.like} size={16} />{fav ? "Remove from Liked" : "Add to Liked videos"}</button>
          <a className="vc-mi" href={YTW(v.videoId)} target="_blank" rel="noreferrer"><Icon d={I.share} size={16} />Open on YouTube</a>
        </div>
      )}
    </div>
  );
}

function Skels({ n = 12 }) {
  return (
    <div className="skel-grid">
      {Array(n).fill(0).map((_, i) => (
        <div key={i}>
          <div className="skel" style={{ width: "100%", aspectRatio: "16/9", borderRadius: 12 }} />
          <div style={{ display: "flex", gap: 12, padding: "12px 8px" }}>
            <div className="skel" style={{ width: 36, height: 36, borderRadius: "50%", flexShrink: 0 }} />
            <div style={{ flex: 1 }}>
              <div className="skel" style={{ height: 14, marginBottom: 8, borderRadius: 4 }} />
              <div className="skel" style={{ height: 13, width: "70%", marginBottom: 6, borderRadius: 4 }} />
              <div className="skel" style={{ height: 13, width: "50%", borderRadius: 4 }} />
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   CUSTOM PLAYER — YouTube-accurate chrome
   48px controls · double-tap skip · nested settings (speed / quality / zoom)
   ════════════════════════════════════════════════════════════════════════════ */
const SkipIco = ({ dir, size = 24 }) => (

      fill="currentColor"
      d={dir < 0

        : "M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"}
    />
  </svg>
);

const ZOOM_MODES = [
  { k: "fit", l: "Fit to screen", d: "Poora video, letterbox ke saath" },
  { k: "fill", l: "Fill width", d: "Frame bhar do — kinare crop honge" },
  { k: "1.25", l: "Zoom 125%" },
  { k: "1.5", l: "Zoom 150%" },
  { k: "2", l: "Zoom 200%" },
];

function CPlayer({ video, formats, st, onNext, poster, onRefresh }) {

  const tapT = useRef(null), tapAt = useRef(0);
  const [qi, setQi] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [time, setTime] = useState(0), [dur, setDur] = useState(0), [buf, setBuf] = useState(0);
  const [vol, setVol] = useState(st.cfg.volume ?? 1), [muted, setMuted] = useState(!!st.cfg.muted);
  const [full, setFull] = useState(false), [theater, setTheater] = useState(!!st.cfg.theater);
  const [ui, setUi] = useState(true), [hoverX, setHoverX] = useState(null), [drag, setDrag] = useState(false);
  const [menu, setMenu] = useState(null), [rate, setRate] = useState(st.cfg.rate || 1);
  const [zoom, setZoom] = useState(st.cfg.zoom || "fit");
  const [pitch, setPitch] = useState(st.cfg.pitch !== false);
  const [waiting, setWaiting] = useState(true), [err, setErr] = useState(""), [flash, setFlash] = useState(null);

  const refreshTries = useRef(0);
  const firstRender = useRef(true);
  const barRef = useRef(null);

  const list = formats && formats.length ? formats : [];
  const cur = list[Math.min(qi, list.length - 1)];
  const src = cur ? mediaUrl(st.cfg, cur.url) : "";

  useEffect(() => {
    if (firstRender.current) { firstRender.current = false; return; }
    const el = vidRef.current;
    if (!el) return;
    pendingSeek.current = el.currentTime || 0;
    setWaiting(true);
  }, [qi]);

  useEffect(() => {
    const el = vidRef.current;
    if (!el) return;
    el.volume = muted ? 0 : vol;
    el.muted = muted;
    try { el.playbackRate = rate; } catch {}
    try {
      el.preservesPitch = pitch;
      el.mozPreservesPitch = pitch;
      el.webkitPreservesPitch = pitch;
    } catch {}

  }, [vol, muted, rate, zoom, pitch]);

  useEffect(() => {
    const onFs = () => setFull(!!(document.fullscreenElement && wrapRef.current && document.fullscreenElement === wrapRef.current));

    return () => document.removeEventListener("fullscreenchange", onFs);
  }, []);

  const bump = useCallback(() => {
    setUi(true);
    clearTimeout(hideT.current);
    hideT.current = setTimeout(() => setUi(false), 3200);
  }, []);
  useEffect(() => { bump(); return () => { clearTimeout(hideT.current); clearTimeout(tapT.current); }; }, [bump]);

  const toggle = useCallback(() => {
    const el = vidRef.current;
    if (!el) return;
    if (el.paused || el.ended) { const p = el.play(); if (p && p.catch) p.catch(() => {}); setFlash("play"); }

    el.currentTime = Math.max(0, Math.min(d || t, t));
    setTime(el.currentTime);
    bump();
  }, [dur, bump]);

  const showSkip = useCallback((dir, secs = 10) => {

  const skip = useCallback((s) => {

  const toggleTheater = () => { const t = !theater; setTheater(t); st.updCfg({ theater: t }); };

  const bumpRate = useCallback((dir) => {
    setRate((r) => {

  const zoomLabel = (ZOOM_MODES.find((z) => z.k === zoom) || ZOOM_MODES[0]).l;

  const shareVideo = async () => {
    const url = YTW(video.videoId);

  useEffect(() => {

      if (!el) return;

      else if (k === "l") skip(10);
      else if (k === "arrowright") { e.preventDefault(); skip(5); }
      else if (k === "arrowleft") { e.preventDefault(); skip(-5); }
      else if (k === "arrowup") { e.preventDefault(); setV(vol + 0.1); }
      else if (k === "arrowdown") { e.preventDefault(); setV(vol - 0.1); }

    const r = stage.getBoundingClientRect ? stage.getBoundingClientRect() : { left: 0, width: 1 };

          setTime(e.currentTarget.currentTime || 0);
          setWaiting(false);
          if (pendingSeek.current != null) { e.currentTarget.currentTime = pendingSeek.current; pendingSeek.current = null; }
          if (st.cfg.autoplay) { const p = e.currentTarget.play(); if (p && p.catch) p.catch(() => {}); }
        }}
        onProgress={(e) => { const b = e.currentTarget.buffered; if (b.length) setBuf(b.end(b.length - 1)); }}
        onWaiting={() => setWaiting(true)}
        onPlaying={() => { setWaiting(false); setErr(""); }}
        onCanPlay={() => setWaiting(false)}
        onEnded={() => { setPlaying(false); if (st.cfg.autoplay && onNext) onNext(); }}
        onError={(e) => {
          if (onRefresh && refreshTries.current < 2) {
            refreshTries.current += 1;
            pendingSeek.current = vidRef.current?.currentTime || 0;
            setWaiting(true); setErr("");
            onRefresh();
            return;
          }
          setErr(fmtErr(e.currentTarget));
          setWaiting(false);
        }}
      />

      {/* tap layer: single / double tap behaviour */}
      <div className="cp-stage" onClick={stageTap} />

      {/* double-tap ripple */}
      {skipFx && (
        <div className={"cp-skip-fx " + (skipFx.dir < 0 ? "left" : "right")} key={skipFx.id}>
          <div className="cp-skip-ring">
            <SkipIco dir={skipFx.dir} size={34} />
          </div>
          <div className="cp-skip-txt">{skipFx.secs} seconds</div>
        </div>
      )}

      {/* top gradient: title + actions */}
      <div className={"cp-top" + (hideUI ? " hidden" : "")}>
        <div className="cp-title">{video.title}</div>
        <div className="cp-top-actions">
          <button className="cp-top-btn" title="Save to Watch later" onClick={(e) => { e.stopPropagation(); st.togWL(video); }}>
            <Icon d={I.save} size={22} />
          </button>
          <button className="cp-top-btn" title="Share" onClick={(e) => { e.stopPropagation(); shareVideo(); }}>
            <Icon d={I.share} size={22} />
          </button>
          <a className="cp-top-btn" href={YTW(video.videoId)} target="_blank" rel="noreferrer" title="Open on YouTube">
            <Icon d={I.more} size={22} />
          </a>
        </div>
      </div>

      {waiting && !err && <div className="cp-big"><div className="cp-spin" /></div>}

      {!playing && !waiting && !err && (
        <div className="cp-big">
          <button className="cp-bigplay" onClick={(e) => { e.stopPropagation(); toggle(); }} aria-label="Play">
            <Icon d={I.play} size={40} />
          </button>
        </div>
      )}
      {flash && <div className="cp-big"><div className="cp-big-icon"><Icon d={flash === "play" ? I.play : I.pause} /></div></div>}

      {err && (
        <div className="cp-err" onClick={(e) => e.stopPropagation()}>
          <div style={{ fontSize: 34 }}>⚠️</div>
          <div style={{ fontSize: 16, fontWeight: 500, color: "#fff" }}>Video play nahi ho paya</div>
          <div style={{ fontSize: 13, color: "#aaa", maxWidth: 420, lineHeight: 1.6 }}>{err}</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", justifyContent: "center" }}>
            <button className="cp-pill" onClick={() => { setErr(""); setWaiting(true); vidRef.current?.load(); }}>Retry</button>
            {list.length > 1 && <button className="cp-pill ghost" onClick={() => setQi((qi + 1) % list.length)}>Try another quality</button>}
            <a className="cp-pill ghost" href={YTW(video.videoId)} target="_blank" rel="noreferrer">Open on YouTube</a>
          </div>
        </div>
      )}

      {/* ── bottom chrome ─────────────────────────────────────────────────── */}
      <div className={"cp-ui" + (hideUI ? " hidden" : "")} onClick={(e) => e.stopPropagation()}>
        <div className="cp-bar" ref={barRef}
          onMouseMove={(e) => setHoverX(posFromEvent(e))} onMouseLeave={() => setHoverX(null)}
          onPointerDown={(e) => { try { e.currentTarget.setPointerCapture?.(e.pointerId); } catch {} setDrag(true); seekTo(posFromEvent(e) * dur); }}
          onPointerMove={(e) => { if (drag) seekTo(posFromEvent(e) * dur); }}
          onPointerUp={(e) => { setDrag(false); seekTo(posFromEvent(e) * dur); }}>
          <div className="cp-bar-track">
            <div className="cp-buf" style={{ width: bufPct + "%" }} />
            <div className="cp-played" style={{ width: pct + "%" }} />
            <div className="cp-knob" style={{ left: pct + "%" }} />
          </div>
          {hoverX != null && <div className="cp-tip" style={{ left: hoverX * 100 + "%" }}>{fd(hoverX * dur)}</div>}
        </div>

        <div className="cp-row">
          <button className="cp-btn" onClick={() => skip(-10)} title="Back 10s (j)"><SkipIco dir={-1} /></button>
          <button className="cp-btn cp-btn-main" onClick={toggle} title={playing ? "Pause (k)" : "Play (k)"}>
            <Icon d={playing ? I.pause : I.play} size={26} />
          </button>
          <button className="cp-btn" onClick={() => skip(10)} title="Forward 10s (l)"><SkipIco dir={1} /></button>
          {onNext && <button className="cp-btn" onClick={onNext} title="Next (n)"><Icon d={I.next} size={24} /></button>}

          <div className="cp-vol-wrap">
            <button className="cp-btn" onClick={() => setMuted(!muted)} title="Mute (m)"><Icon d={muted || vol === 0 ? I.mute : I.vol} size={24} /></button>
            <div className="cp-vol"><input type="range" min="0" max="1" step="0.02" value={muted ? 0 : vol} onChange={(e) => setV(e.target.value)} aria-label="Volume" /></div>
          </div>

          <span className="cp-time">{fd(time)} <span className="cp-time-sep">/</span> {fd(dur)}</span>

          {rate !== 1 && <span className="cp-badge">{rate}×</span>}
          {zoom !== "fit" && <span className="cp-badge">{zoom === "fill" ? "Fill" : zoom + "×"}</span>}

          <div className="cp-spacer" />

          <button className={"cp-btn" + (menu ? " on" : "")} onClick={() => setMenu(menu ? null : "main")} title="Settings">
            <Icon d={I.gear} size={24} />
          </button>
          <button className="cp-btn" onClick={cycleZoom} title={"Zoom: " + zoomLabel + " (z)"}><Icon d={I.zoom} size={23} /></button>
          <button className="cp-btn" onClick={toggleTheater} title="Theater (t)"><Icon d={I.theater} size={24} /></button>
          <button className="cp-btn" onClick={toggleFull} title="Fullscreen (f)"><Icon d={full ? I.fsExit : I.fs} size={24} /></button>
        </div>

        {/* ── settings panel (YouTube-style, nested) ──────────────────────── */}
        {menu && (
          <div className="cp-menu" onClick={(e) => e.stopPropagation()}>
            {menu === "main" && (
              <>
                <div className="cp-menu-title">Settings</div>
                <button className="cp-mi" onClick={() => setMenu("speed")}>
                  <span className="cp-mi-lbl">Playback speed</span>
                  <span className="cp-mi-val">{rate === 1 ? "Normal" : rate + "×"}</span>
                </button>
                <button className="cp-mi" onClick={() => setMenu("quality")}>
                  <span className="cp-mi-lbl">Quality</span>
                  <span className="cp-mi-val">{cur ? cur.quality : "Auto"}</span>
                </button>
                <button className="cp-mi" onClick={() => setMenu("zoom")}>
                  <span className="cp-mi-lbl">Zoom</span>
                  <span className="cp-mi-val">{zoomLabel}</span>
                </button>
                <button className="cp-mi" onClick={() => setPitch((v) => !v)}>
                  <span className="cp-mi-lbl">Preserve pitch</span>
                  <span className="cp-switch" data-on={pitch ? "1" : "0"}><span className="cp-switch-dot" /></span>
                </button>
                <div className="cp-menu-foot">&lt; &gt; speed · z zoom · j/l ±10s</div>
              </>
            )}

            {menu === "speed" && (
              <>
                <div className="cp-menu-head">
                  <button className="cp-back" onClick={() => setMenu("main")} aria-label="Back">←</button>
                  <span>Playback speed</span>
                </div>
                <div className="cp-speed-grid">
                  {SPEEDS.map((r) => (
                    <button key={r} className={"cp-speed" + (r === rate ? " sel" : "")} onClick={() => setRate(r)}>
                      {r === 1 ? "Normal" : r + "×"}
                    </button>
                  ))}
                </div>
                <button className="cp-mi" onClick={() => setPitch((v) => !v)}>
                  <span className="cp-mi-lbl">Preserve pitch</span>
                  <span className="cp-switch" data-on={pitch ? "1" : "0"}><span className="cp-switch-dot" /></span>
                </button>
                <div className="cp-menu-foot">{pitch ? "Awaaz natural rahegi har speed par" : "Varispeed — pitch bhi badhega"}</div>
              </>
            )}

            {menu === "quality" && (
              <>
                <div className="cp-menu-head">
                  <button className="cp-back" onClick={() => setMenu("main")} aria-label="Back">←</button>
                  <span>Quality</span>
                </div>
                <button className={"cp-mi" + (qi === 0 ? " sel" : "")} onClick={() => { setQi(0); setMenu("main"); }}>
                  {qi === 0 ? <Icon d={I.check} size={18} /> : <span className="cp-check-space" />}
                  <span className="cp-mi-lbl">Auto <span className="cp-mi-sub">{cur ? cur.quality : ""}</span></span>
                </button>
                {list.map((f, i) => (
                  <button key={f.itag || i} className={"cp-mi" + (i === qi ? " sel" : "")} onClick={() => { setQi(i); setMenu("main"); }}>
                    {i === qi ? <Icon d={I.check} size={18} /> : <span className="cp-check-space" />}
                    <span className="cp-mi-lbl">{f.quality}{f.itag ? <span className="cp-mi-sub">itag {f.itag}</span> : null}</span>
                  </button>
                ))}
                <div className="cp-menu-foot">{list.length} muxed stream{list.length === 1 ? "" : "s"} available</div>
              </>
            )}

            {menu === "zoom" && (
              <>
                <div className="cp-menu-head">
                  <button className="cp-back" onClick={() => setMenu("main")} aria-label="Back">←</button>
                  <span>Zoom</span>
                </div>
                {ZOOM_MODES.map((z) => (
                  <button key={z.k} className={"cp-mi" + (z.k === zoom ? " sel" : "")} onClick={() => { setZoom(z.k); setMenu("main"); }}>
                    {z.k === zoom ? <Icon d={I.check} size={18} /> : <span className="cp-check-space" />}
                    <span className="cp-mi-lbl">{z.l}{z.d ? <span className="cp-mi-sub">{z.d}</span> : null}</span>
                  </button>
                ))}
                <div className="cp-menu-foot">z key se cycle karein</div>
              </>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   SUBSCRIBE MODAL + ENGINE BAR + SETUP
   ════════════════════════════════════════════════════════════════════════════ */
function AddSubModal({ st, engine, onClose, onAdded }) {
  const [q, setQ] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [found, setFound] = useState(null);

  const lookup = async () => {
    const val = q.trim();
    if (!val) return;
    if (engine !== "ok") { setErr("Engine connect nahi hai — pehle worker URL set karein."); return; }
    setBusy(true); setErr(""); setFound(null);
    try {
      const r = await apiChannel(st.cfg, val);
      if (!r || !r.channelId) throw new Error("channel nahi mila");
      setFound(r);
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };
  const save = () => {
    if (!found) return;
    st.addSub(found);
    onAdded && onAdded(found);
    onClose();
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h3>Subscribe to a channel</h3>
        <p>Channel URL, @handle, ya <code>UC…</code> id paste karein. Videos channel feed se aayengi — koi login nahi, koi notification nahi.</p>
        <input autoFocus placeholder="https://youtube.com/@LofiGirl  ·  @mkbhd  ·  UCxxxxxxx" value={q}
          onChange={(e) => setQ(e.target.value)} onKeyDown={(e) => e.key === "Enter" && lookup()} />
        <div className="modal-err">{err}</div>
        {found && (
          <div className="sub-row" style={{ borderBottom: "none" }}>
            <Av name={found.name} src={found.avatar} size={40} />
            <div><div className="sr-name">{found.name || found.channelId}</div><div className="sr-id">{found.channelId}</div></div>
          </div>
        )}
        <div className="modal-row">
          <button className="btn-ghost" onClick={onClose}>Cancel</button>
          {!found && <button className="btn-pri" disabled={busy} onClick={lookup}>{busy ? "Looking up…" : "Find channel"}</button>}
          {found && <button className="btn-pri" onClick={save}>Subscribe</button>}
        </div>
      </div>
    </div>
  );
}

function EngineBar({ status, onSetup }) {
  if (status === "ok") return null;
  return (
    <div className="engine-bar">
      <span>{status === "checking" ? "⏳" : "⚠️"}</span>
      <div style={{ flex: 1, minWidth: 200 }}>
        <div className="engine-bar-t">{status === "checking" ? "Engine check ho raha hai…" : "YouTube engine connected nahi hai"}</div>
        <div className="engine-bar-s">Search/playback ke liye worker.js deploy karke URL daalein</div>
      </div>
      <button className="engine-bar-btn" onClick={onSetup}>Setup</button>
    </div>
  );
}

function SetupGate({ st, onRetry, busy }) {
  const [url, setUrl] = useState(st.cfg.engineUrl || "");
  const [key, setKey] = useState(st.cfg.accessKey || "");
  const [copied, setCopied] = useState("");
  const copyWorker = async () => {
    try {
      const r = await fetch("./worker.js");
      await navigator.clipboard.writeText(await r.text());
      setCopied("Worker code copied — Cloudflare → Workers → paste → Deploy");
    } catch { setCopied("Copy nahi hua — repo me worker.js se manually copy karein"); }
  };
  return (
    <div className="setup">
      <div className="setup-card">
        <div className="setup-badge">ONE-TIME SETUP · 2 MIN</div>
        <h1 className="setup-h1">YouTube engine connect karein</h1>
        <p className="setup-p">Browser se YouTube direct nahi khulta (CORS + IP-bound URLs). Ek <b>Cloudflare Worker</b> ye handle karta hai — free, serverless.</p>
        <ol className="setup-steps">
          <li><a href="https://dash.cloudflare.com/?to=/:account/workers-and-pages" target="_blank" rel="noreferrer">dash.cloudflare.com</a> → Workers &amp; Pages → <b>Create Worker</b></li>
          <li><button className="setup-link" onClick={copyWorker}>worker.js copy karein</button> → paste → <b>Deploy</b></li>
          <li>Worker URL yahan daalein</li>
        </ol>
        {copied && <div className="setup-note ok">{copied}</div>}
        <div className="setup-row">
          <input className="setup-input" type="password" placeholder="Access key (only if SV_KEY set)" value={key}
            onChange={(e) => setKey(e.target.value)} onKeyDown={(e) => e.key === "Enter" && st.updCfg({ accessKey: key.trim() })} />
        </div>
        <div className="setup-row">
          <input className="setup-input" placeholder="https://your-worker.workers.dev" value={url}
            onChange={(e) => setUrl(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && st.updCfg({ engineUrl: url.trim(), accessKey: key.trim() })} />
          <button className="setup-btn" disabled={busy} onClick={() => st.updCfg({ engineUrl: url.trim(), accessKey: key.trim() })}>
            {busy ? "Checking…" : "Connect"}
          </button>
        </div>
        <div className="setup-row" style={{ justifyContent: "space-between" }}>
          <button className="setup-link" onClick={onRetry}>↻ Retry</button>
          <a className="setup-link" href="./worker.js" target="_blank" rel="noreferrer">View worker.js</a>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   HOME
   ════════════════════════════════════════════════════════════════════════════ */
const CHIPS = ["All", "Music", "Gaming", "News", "Movies", "Live", "Cricket", "Podcasts", "Science", "Comedy"];

function HomePage({ onPlay, st, engine, onChannel, onShorts }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [warn, setWarn] = useState("");
  const [chip, setChip] = useState("All");
  const [nonce, setNonce] = useState(0);

  useEffect(() => {
    let dead = false;
    setLoading(true); setWarn("");
    (async () => {
      if (engine !== "ok") { if (!dead) { setItems([]); setLoading(false); } return; }
      try {
        let list;
        if (chip === "All") {
          const d = await apiTrending(st.cfg, st.cfg.region);
          list = d.items || [];
        } else {
          const d = await apiSearch(st.cfg, chip + (chip === "Music" ? " songs" : ""));
          list = d.items || [];
          if (chip === "Live") list = list.filter((v) => v.live);
        }
        if (!dead) setItems(list);
      } catch (e) { if (!dead) setWarn(e.message); }
      if (!dead) setLoading(false);
    })();
    return () => { dead = true; };
  }, [chip, nonce, engine, st.cfg.engineUrl, st.cfg.region]);

  return (
    <div>
      <div className="chips-bar">
        {CHIPS.map((c) => <button key={c} className={"chip" + (chip === c ? " act" : "")} onClick={() => setChip(c)}>{c}</button>)}
      </div>
      {warn && (
        <div className="inline-warn"><span>⚠️</span><span style={{ flex: 1 }}>{warn}</span>
          <button className="cp-pill" onClick={() => setNonce((n) => n + 1)}>Retry</button></div>
      )}
      {chip === "All" && <RecShelf st={st} engine={engine} onPlay={onPlay} />}
      {chip === "All" && <ShortsShelf st={st} engine={engine} onOpen={() => onShorts()} />}
      {loading ? <Skels /> : items.length === 0 ? (
        <div className="err-box"><div className="err-ico">📭</div><div className="err-msg">Kuch nahi mila — engine connect karein ya chips try karein</div></div>
      ) : (
        <div className="vgrid">
          {items.map((v, i) => (
            <div key={v.videoId || i} style={{ animationDelay: `${Math.min(i, 16) * 0.03}s` }}>
              <VCard v={v} onPlay={onPlay} st={st} onChannel={onChannel} />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   SUBSCRIPTIONS (RSS)
   ════════════════════════════════════════════════════════════════════════════ */
function SubsPage({ st, engine, onPlay, onChannel, onAddSub, refreshKey }) {
  const [feed, setFeed] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");
  const [nonce, setNonce] = useState(0);
  const ids = useMemo(() => st.subs.map((s) => s.channelId), [st.subs]);

  useEffect(() => {
    let dead = false;
    if (!ids.length) { setFeed({ items: [], channels: [], errors: [] }); setLoading(false); return; }
    if (engine !== "ok") { setErr("engine-offline"); setLoading(false); return; }
    setLoading(true); setErr("");
    apiRss(st.cfg, ids)
      .then((d) => {
        if (dead) return;
        setFeed(d);
        setLoading(false);
        // keep channel names/avatars fresh
        (d.channels || []).forEach((ch) => {
          const local = st.subs.find((s) => s.channelId === ch.channelId);
          if (local && ch.name && (local.name !== ch.name || !local.avatar)) {
            st.setSubsRaw(st.subs.map((s) => (s.channelId === ch.channelId ? { ...s, name: ch.name || s.name } : s)));
          }
        });
      })
      .catch((e) => { if (!dead) { setErr(e.message); setLoading(false); } });
    return () => { dead = true; };
  }, [ids.join(","), engine, st.cfg.engineUrl, nonce, refreshKey]);

  const grouped = useMemo(() => {
    const groups = [];
    const map = new Map();
    (feed && feed.items ? feed.items : []).forEach((v) => {
      const k = dayKey(v.published);
      if (!map.has(k)) { map.set(k, []); groups.push(k); }
      map.get(k).push(v);
    });
    return groups.map((k) => ({ day: k, items: map.get(k) }));
  }, [feed]);

  const itemById = useMemo(() => {
    const m = new Map();
    (feed && feed.items ? feed.items : []).forEach((v) => { if (v.authorId) m.set(v.videoId, v); });
    return m;
  }, [feed]);

  return (
    <div>
      <div className="ch-rail">
        {st.subs.map((s) => {
          const name = s.name || s.channelId;
          return (
            <div key={s.channelId} className="ch-card" onClick={() => onChannel(s.channelId, name)}>
              <div className="ch-av">{s.avatar ? <img src={s.avatar} alt="" onError={(e) => { e.currentTarget.remove(); }} /> : (name || "?")[0].toUpperCase()}</div>
              <div className="ch-name" title={name}>{name}</div>
            </div>
          );
        })}
        <div className="ch-card new" onClick={onAddSub}>
          <div className="ch-av">＋</div>
          <div className="ch-name">Add channel</div>
        </div>
      </div>

      <div className="sub-head">
        <h2>Subscriptions</h2>
        <div className="sub-actions">
          <button className="sub-chip" onClick={() => setNonce((n) => n + 1)}>↻ Refresh</button>
          <a className="sub-chip" href={YTW("")} onClick={(e) => e.preventDefault()} style={{ display: "none" }} />
          <button className="sub-chip pri" onClick={onAddSub}>＋ Subscribe</button>
        </div>
      </div>

      {err === "engine-offline" && <div className="inline-warn" style={{ marginTop: 8 }}><span>⚠️</span><span>Engine connect karein — channel feeds worker se aati hain</span></div>}
      {err && err !== "engine-offline" && (
        <div className="inline-warn" style={{ marginTop: 8 }}><span>⚠️</span><span style={{ flex: 1 }}>{err}</span>
          <button className="cp-pill" onClick={() => setNonce((n) => n + 1)}>Retry</button></div>
      )}
      {feed && feed.errors && feed.errors.length > 0 && (
        <div className="inline-warn" style={{ marginTop: 8 }}>
          <span>⚠️</span><span style={{ flex: 1 }}>{feed.errors.length} channel feed(s) load nahi hui — baaki dikha rahe hain</span>
        </div>
      )}

      {!st.subs.length ? (
        <div className="lib-empty">
          <div className="lib-empty-ico">📡</div>
          <div className="lib-empty-title">Koi subscription nahi</div>
          <div className="lib-empty-sub">Channel add karein — unki nayi videos yahan aayengi, bina login ke</div>
          <button className="btn-pri" onClick={onAddSub}>＋ Subscribe to a channel</button>
        </div>
      ) : loading ? <Skels n={8} /> : (
        <>
          {grouped.map((g) => (
            <div key={g.day}>
              <div className="day-head">{g.day}</div>
              <div className="vlist" style={{ padding: "0 24px" }}>
                {g.items.map((v) => (
                  <div key={v.videoId} className="lib-row">
                    <VCard v={v} onPlay={onPlay} layout="list" st={st} onChannel={onChannel} />
                    <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", paddingTop: 12, gap: 4 }}>
                      <span className="sr-id" style={{ fontSize: 11, color: "var(--t3)" }}>{ago(v.published)}</span>
                      {v.viewCount > 0 && <span className="sr-id" style={{ fontSize: 11, color: "var(--t3)" }}>{fv(v.viewCount)} views</span>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

function ChannelPage({ channelId, name, st, engine, onPlay, onChannel }) {
  const [feed, setFeed] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");
  const [nonce, setNonce] = useState(0);

      .catch((e) => { if (!dead) { setErr(e.message); setLoading(false); } });

    <div>
