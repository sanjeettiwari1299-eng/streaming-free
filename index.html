<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>StreamVoid · YouTube, apne player me</title>
<meta name="description" content="Serverless YouTube front-end: RSS subscriptions, custom player, no ads, no login."/>
<meta name="theme-color" content="#0f0f0f"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;
  --bg2:#181818;
  --bg3:#272727;
  --bg4:#3f3f3f;
  --border:#303030;
  --border2:#3f3f3f;
  --red:#ff0033;
  --red2:#ff0000;
  --t1:#f1f1f1;
  --t2:#aaa;
  --t3:#717171;
  --chip-bg:#272727;
  --chip-hover:#3f3f3f;
  --chip-active:#f1f1f1;
  --chip-active-t:#0f0f0f;
  --hover:rgba(255,255,255,.1);
  --menu:#282828;
  --blue:#3ea6ff;
  --sw:240px;
  --th:56px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#fff;
  --bg2:#f9f9f9;
  --bg3:#f2f2f2;
  --bg4:#e5e5e5;
  --border:#e5e5e5;
  --border2:#ccc;
  --t1:#0f0f0f;
  --t2:#606060;
  --t3:#909090;
  --chip-bg:#f2f2f2;
  --chip-hover:#e5e5e5;
  --chip-active:#0f0f0f;
  --chip-active-t:#fff;
  --hover:rgba(0,0,0,.06);
  --menu:#fff;
  --blue:#065fd4;
  color-scheme:light;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t1);font-family:Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#606060;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#909090}
a{color:inherit;text-decoration:none}
button{font-family:Roboto,Arial,sans-serif;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:Roboto,Arial,sans-serif}
img{max-width:100%;display:block}
svg{flex-shrink:0}

/* ── LAYOUT ── */
.layout{display:flex;min-height:100vh}
.main{flex:1;margin-left:var(--sw);min-width:0;display:flex;flex-direction:column;transition:margin .18s ease}
.main.mini-margin{margin-left:72px}
.main.no-margin{margin-left:0}
.main-wrap{margin-top:var(--th)}
.page{max-width:2140px;margin:0 auto}

/* ── TOPBAR (YouTube layout) ── */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--th);background:var(--bg);z-index:210;display:flex;align-items:center;gap:16px;padding:0 16px}
.topbar.scrolled{box-shadow:0 1px 0 var(--border)}
.tb-left{display:flex;align-items:center;gap:2px;flex-shrink:0}
.tb-menu-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t1)}
.tb-menu-btn:hover{background:var(--hover)}
.yt-logo{display:flex;align-items:center;gap:5px;height:40px;padding:0 16px 0 8px;border-radius:8px}
.yt-mark{width:30px;height:21px;border-radius:5px;background:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s}
.yt-logo:hover .yt-mark{transform:scale(1.04)}
.yt-mark svg{width:11px;height:11px;fill:#fff;margin-left:1px}
.yt-word{font-size:19px;font-weight:700;letter-spacing:-.9px;line-height:1;color:var(--t1)}
.yt-country{font-size:9px;color:var(--t2);align-self:flex-start;margin:5px 0 0 0;letter-spacing:.3px}
.tb-center{flex:1;display:flex;justify-content:center;min-width:0}
.tb-search-wrap{display:flex;align-items:center;gap:8px;width:100%;max-width:640px;position:relative}
.tb-search{flex:1;display:flex;align-items:center;height:40px;border:1px solid var(--border2);border-radius:20px;background:rgba(0,0,0,.16);padding-left:16px;min-width:0}
:root[data-theme="light"] .tb-search{background:#fff}
.tb-search:focus-within{border-color:#1c62b9;box-shadow:inset 0 0 0 1px #1c62b9}
.tb-search input{flex:1;min-width:0;height:100%;background:none;border:none;outline:none;color:var(--t1);font-size:15px;padding:0}
.tb-search input::placeholder{color:var(--t3)}
.tb-clr-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t2);flex-shrink:0}
.tb-clr-btn:hover{background:var(--hover);color:var(--t1)}
.tb-go{width:64px;height:38px;border-left:1px solid var(--border2);border-radius:0 19px 19px 0;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--t1);flex-shrink:0;margin:0 -1px 0 0}
.tb-go:hover{background:var(--bg4)}
.tb-mic{width:40px;height:40px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--t1);flex-shrink:0}
.tb-mic:hover{background:var(--bg4)}
.tb-search-mobile-btn{display:none}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb-icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t1);position:relative}
.tb-icon-btn:hover{background:var(--hover)}
.tb-create{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 10px;border-radius:18px;background:var(--bg3);font-size:14px;font-weight:500;color:var(--t1)}
.tb-create:hover{background:var(--bg4)}
.tb-badge{position:absolute;top:5px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--red2);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tb-avatar-wrap{position:relative;display:flex}
.tb-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7b2ff7,#3ea6ff);color:#fff;font-size:14px;font-weight:600;letter-spacing:.3px}
.tb-avatar:hover{box-shadow:0 0 0 4px var(--hover)}

/* topbar dropdowns */
.yt-menu{position:absolute;top:48px;right:0;min-width:280px;max-width:340px;background:var(--menu);border:1px solid var(--border);border-radius:12px;padding:8px 0;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:240;overflow:hidden}
.ym-head{display:flex;align-items:center;gap:12px;padding:12px 16px 14px}
.ym-head .tb-avatar{width:40px;height:40px;font-size:16px}
.ym-name{font-size:15px;font-weight:500}
.ym-sub{font-size:12px;color:var(--t2);word-break:break-all}
.ym-sep{height:1px;background:var(--border);margin:6px 0}
.ym-item{display:flex;align-items:center;gap:16px;width:100%;padding:9px 16px;font-size:14px;color:var(--t1);text-align:left}
.ym-item:hover{background:var(--hover)}
.ym-item .ym-right{margin-left:auto;font-size:12px;color:var(--t3)}

/* search suggestions */
.tb-suggest{position:absolute;top:46px;left:0;right:0;background:var(--menu);border:1px solid var(--border);border-radius:12px;padding:8px 0;z-index:235;box-shadow:0 12px 40px rgba(0,0,0,.5);max-height:70vh;overflow-y:auto}
.tb-sg{display:flex;align-items:center;gap:16px;width:100%;min-height:38px;padding:0 16px;font-size:15px;text-align:left;color:var(--t1)}
.tb-sg:hover{background:var(--hover)}
.tb-sg .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-sg .fill{font-weight:600}
.tb-sg-rm{color:var(--t3);display:flex;align-items:center;padding:4px}
.tb-sg-rm:hover{color:var(--t1)}
.tb-mobile-search{position:fixed;top:0;left:0;right:0;height:var(--th);background:var(--bg);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:260}

/* ── SIDEBAR ── */
.sidebar{position:fixed;left:0;top:var(--th);bottom:0;width:var(--sw);background:var(--bg);overflow-y:auto;overflow-x:hidden;padding:12px 0 24px;z-index:180;transition:transform .18s ease}
.sidebar.closed{transform:translateX(-100%)}
.sidebar.mini{width:72px;padding-top:4px}
.s-group{padding-bottom:8px}
.s-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;font-weight:500;color:var(--t1);padding:10px 24px 4px}
.s-label button{color:var(--t2);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.s-label button:hover{background:var(--hover);color:var(--t1)}
.s-divider{height:1px;background:var(--border);margin:10px 12px}
.s-item{display:flex;align-items:center;gap:22px;min-height:40px;padding:0 12px;margin:0 12px;border-radius:10px;color:var(--t1);font-size:14px;transition:background .1s;width:calc(100% - 24px);text-align:left}
.s-item:hover{background:var(--hover)}
.s-item.act{background:var(--hover);font-weight:500}
.s-ico{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--t1)}
.s-ico svg{fill:currentColor}
.s-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.s-cnt{margin-left:auto;font-size:12px;color:var(--t2);flex-shrink:0}
.sidebar.mini .s-lbl,.sidebar.mini .s-cnt,.sidebar.mini .s-divider,.sidebar.mini .s-label,.sidebar.mini .side-foot,.sidebar.mini .subs-empty,.sidebar.mini .s-more{display:none}
.sidebar.mini .s-item{flex-direction:column;justify-content:center;gap:6px;padding:14px 0 12px;margin:0 4px;min-height:68px;width:calc(100% - 8px);border-radius:10px;font-size:10px}
.sidebar.mini .s-item .s-lbl{display:block;flex:0;font-size:10px;line-height:1;font-weight:400}
.sidebar.mini .s-ico{width:24px;height:24px}
.sidebar.mini .side-sub{display:none !important}
.side-sub{display:flex;align-items:center;gap:22px}
.side-sub .s-av{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;overflow:hidden;background:var(--bg4)}
.side-sub .s-av img{width:100%;height:100%;object-fit:cover}
.subs-empty{padding:6px 24px 10px;font-size:13px;color:var(--t3);line-height:1.5}
.side-foot{padding:16px 24px 0;font-size:12.5px;color:var(--t3);line-height:1.7}
.side-foot-links{display:flex;flex-wrap:wrap;gap:2px 8px;padding:8px 24px 0;font-size:12.5px;color:var(--t2)}
.side-foot-links button{font-size:12.5px;color:inherit;text-align:left}
.side-foot-links button:hover{color:var(--t1)}
.s-more{padding:0 24px 4px;font-size:13px;color:var(--t2);display:flex;align-items:center;gap:6px}
.s-more:hover{color:var(--t1)}

/* ── CHIPS ── */
.chips-bar{display:flex;gap:12px;overflow-x:auto;padding:12px 24px;scrollbar-width:none;position:sticky;top:var(--th);z-index:120;background:var(--bg)}
.chips-bar::-webkit-scrollbar{display:none}
.chip{padding:0 12px;height:32px;border-radius:8px;font-size:14px;font-weight:500;background:var(--chip-bg);color:var(--t1);white-space:nowrap;flex-shrink:0;transition:background .1s}
.chip:hover{background:var(--chip-hover)}
.chip.act{background:var(--chip-active);color:var(--chip-active-t)}

/* ── VIDEO GRID ── */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px 16px;padding:24px}
.vlist{display:flex;flex-direction:column;gap:16px;padding:24px}

/* ── VIDEO CARD ── */
.vc{position:relative;cursor:pointer;min-width:0;display:flex;flex-direction:column;animation:fadeIn .25s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.vc-thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--bg3)}
.vc-thumb-img{width:100%;height:100%;object-fit:cover;display:block}
.vc-dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;padding:1px 4px;border-radius:4px;letter-spacing:.2px}
.vc-live{position:absolute;bottom:8px;right:8px;background:#f00;color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;letter-spacing:.3px}
.vc-short{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:600;letter-spacing:.3px;padding:2px 6px;border-radius:4px;display:flex;align-items:center;gap:4px}
.vc-short:before{content:"";width:9px;height:9px;background:#fff;border-radius:2px;clip-path:polygon(0 0,100% 50%,0 100%)}
.vc-hact{position:absolute;top:4px;right:4px;display:flex;gap:2px;opacity:0;transition:opacity .12s}
.vc:hover .vc-hact{opacity:1}
.vc-hact button{width:30px;height:30px;border-radius:6px;background:rgba(0,0,0,.8);color:#fff;display:flex;align-items:center;justify-content:center}
.vc-hact button:hover{background:rgba(0,0,0,.95)}
.vc-hact button.on{color:#ff4e45}
.vc-body{display:flex;gap:12px;padding:12px 0 0;align-items:flex-start}
.vc-av-wrap{flex-shrink:0;line-height:0;cursor:pointer;border-radius:50%}
.vc-av{width:36px;height:36px;border-radius:50%;background:var(--bg3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--t1);overflow:hidden;line-height:1}
.av{display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;flex-shrink:0;color:#fff;font-weight:600;line-height:1}
.av img{width:100%;height:100%;object-fit:cover}
.vc-meta{flex:1;min-width:0}
.vc-title{font-size:14px;font-weight:500;line-height:20px;color:var(--t1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px;word-break:break-word}
.vc-channel{font-size:12px;color:var(--t2);line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.vc-channel:hover{color:var(--t1)}
.vc-info{font-size:12px;color:var(--t2);line-height:18px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.vc-dot{margin:0 1px}
.vc-reason{font-size:12px;color:var(--t3);line-height:17px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.vc-more-btn{opacity:0;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t1);flex-shrink:0;transition:opacity .1s,background .1s;margin:-6px -6px 0 0}
.vc:hover .vc-more-btn,.vc-more-btn:focus{opacity:1}
.vc-more-btn:hover{background:var(--hover)}
.vc-menu{position:absolute;top:34px;right:-4px;background:var(--menu);border:1px solid var(--border);border-radius:12px;padding:8px 0;z-index:50;min-width:220px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.vc-mi{display:flex;align-items:center;gap:16px;padding:9px 16px;font-size:14px;color:var(--t1);transition:background .1s;width:100%;text-align:left}
.vc-mi:hover{background:var(--hover)}
.vc-mi-ico{font-size:20px;width:24px;text-align:center;display:flex;align-items:center;justify-content:center;color:var(--t1)}
.vc-mi-ico svg{fill:currentColor}
.vc-snippet{font-size:12px;color:var(--t2);line-height:18px;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* LIST ROW (watch rail) */
.vc-row{display:flex;gap:8px;align-items:flex-start;padding:0;border-radius:0;position:relative}
.vc-row .vc-thumb{width:168px;flex:0 0 168px;border-radius:8px}
.vc-row .vc-body{padding:0;flex:1;flex-direction:column;gap:0}
.vc-row .vc-av-wrap{display:none}
.vc-row .vc-meta{flex:1}
.vc-row .vc-title{font-size:14px;line-height:20px;margin-bottom:4px}
.vc-row .vc-more-btn{position:absolute;top:-6px;right:-6px}
.vc-row .vc-hact{display:none}

/* SEARCH RESULT ROW */
.vc-search{display:flex;gap:16px;align-items:flex-start;padding:0 0 16px;position:relative}
.vc-search .vc-thumb{width:360px;flex:0 0 360px;border-radius:12px}
.vc-search .vc-body{padding:0;flex:1;flex-direction:column;gap:0;min-width:0}
.vc-search .vc-av-wrap{display:none}
.vc-search .vc-title{font-size:20px;line-height:26px;font-weight:400;margin-bottom:2px}
.vc-search .vc-channel{font-size:12px;margin:5px 0;gap:8px}
.vc-search .vc-info{font-size:12px;color:var(--t2)}
.vc-search .vc-more-btn{position:absolute;top:-8px;right:-8px}
.vc-search .vc-hact{display:none}

/* ── SKEL ── */
.skel{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:400px 100%;animation:shim 1.5s infinite;border-radius:6px}
@keyframes shim{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px 16px;padding:24px}

/* ── WATCH PAGE ── */
.watch{display:flex;gap:24px;padding:24px 24px 40px;max-width:1754px;margin:0 auto}
.watch-main{flex:1;min-width:0;max-width:1284px}
.watch-player{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.watch-player iframe{width:100%;height:100%;border:none;display:block}
/* native player */
.pl-wrap{position:relative;width:100%;height:100%;background:#000}
.pl-video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.pl-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;background:rgba(0,0,0,.72);color:#fff;z-index:2}
.pl-overlay-t{font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px}
.pl-overlay-s{font-size:13px;color:#cfcfcf;max-width:520px;line-height:1.5;word-break:break-word}
.pl-spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#3ea6ff;animation:spn .8s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.pl-ov-btn{padding:0 16px;height:34px;border-radius:18px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;transition:background .1s}
.pl-ov-btn:hover{background:rgba(255,255,255,.26)}
.pl-srcbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 4px 0;font-size:12px;color:var(--t2)}
.pl-src{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:10px;background:var(--bg3);color:var(--t2);font-size:12px}
.pl-src.ok{color:#7ee787;background:rgba(76,175,80,.12)}
.pl-src-mono{font-family:monospace;font-size:11px;color:var(--t3)}
.pl-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;height:100%;color:#ddd;text-align:center;padding:24px;background:#0a0a0a}
.pl-fallback-t{font-size:16px;font-weight:500;color:#fff}
.pl-fallback-s{font-size:13px;color:#9a9a9a;max-width:420px;line-height:1.55}
.pl-fallback-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pl-fb-btn{padding:0 18px;height:38px;border-radius:19px;background:#fff;color:#0f0f0f;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.pl-fb-btn.ghost{background:rgba(255,255,255,.13);color:#fff}
.pl-fb-btn.ghost:hover{background:rgba(255,255,255,.24)}
.watch-title{font-size:20px;font-weight:700;line-height:28px;margin:12px 0 8px;letter-spacing:-.1px}
.watch-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.watch-info-left{font-size:14px;color:var(--t2)}
.watch-btns{display:flex;gap:8px;flex-wrap:wrap}
.w-btn{display:flex;align-items:center;gap:6px;padding:0 16px;height:36px;border-radius:18px;font-size:14px;font-weight:500;background:var(--bg3);color:var(--t1);transition:background .1s}
.w-btn:hover{background:var(--bg4)}
.w-btn.on{background:var(--t1);color:var(--bg)}
.watch-ch-row{display:flex;align-items:center;gap:12px;padding:0;border-bottom:none;margin-bottom:0;flex-wrap:nowrap;min-width:0}
.watch-ch-av{width:40px;height:40px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.watch-ch-name{font-size:16px;font-weight:500;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch-ch-name:hover{color:var(--t1)}
.watch-ch-sub{font-size:12px;color:var(--t2);line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch-desc-box{background:var(--bg3);border-radius:12px;padding:12px;margin:12px 0 0;cursor:pointer;font-size:14px;transition:background .1s}
.watch-desc-box:hover{background:var(--bg4)}
:root[data-theme="light"] .watch-desc-box{background:#f2f2f2}
:root[data-theme="light"] .watch-desc-box:hover{background:#e5e5e5}
.watch-desc-head{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;line-height:20px;flex-wrap:wrap}
.watch-desc-short{font-size:14px;color:var(--t1);line-height:20px}
.watch-desc-full{font-size:14px;color:var(--t1);line-height:20px;white-space:pre-wrap;margin-top:8px;word-break:break-word}
.watch-desc-tog{font-size:13px;font-weight:500;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
.watch-desc-tog:hover{color:var(--t1)}
.watch-chips{display:flex;gap:8px;margin:20px 0 4px;overflow-x:auto;scrollbar-width:none}
.watch-chips::-webkit-scrollbar{display:none}
.watch-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.watch-tag{color:var(--blue);font-size:14px}
.watch-side{flex:0 0 402px;min-width:0;max-width:402px}
.watch-side-title{font-size:16px;font-weight:500;margin-bottom:12px}
.watch-side-list{display:flex;flex-direction:column;gap:8px}
.watch.theater{max-width:100%;flex-direction:column;padding:0 0 24px}
.watch.theater .watch-main{max-width:100%}
.watch.theater .watch-player{border-radius:0}
.watch.theater .watch-under{max-width:1284px;margin:0 auto;padding:0 24px}
.watch.theater .watch-side{display:none}
.watch-under{min-width:0}

/* ── LIBRARY ── */

.lib-pg{padding:24px;max-width:1200px}
.lib-hd{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.lib-title{font-size:20px;font-weight:400;flex:1}
.lib-cnt{font-size:13px;color:var(--t2);background:var(--bg3);padding:2px 10px;border-radius:10px}
.lib-btn{display:flex;align-items:center;gap:6px;padding:0 16px;height:36px;border-radius:18px;font-size:14px;background:var(--bg3);color:var(--t1);transition:background .1s}
.lib-btn:hover{background:var(--bg4)}
.lib-btn.danger:hover{background:#3d1f1f;color:#f28b82}
.lib-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:100px 24px;text-align:center}
.lib-empty-ico{font-size:64px;opacity:.2}
.lib-empty-title{font-size:18px;font-weight:400;color:var(--t2)}
.lib-empty-sub{font-size:14px;color:var(--t3);max-width:280px}
.lib-row{position:relative;display:flex;align-items:flex-start}
.lib-row>*:first-child{flex:1;min-width:0}
.lib-rm{margin:14px 0 0 4px;color:var(--t3);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:all .1s}
.lib-rm:hover{background:var(--bg3);color:var(--t1)}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.pl-card{background:var(--bg2);border-radius:12px;overflow:hidden;cursor:pointer;animation:fadeIn .3s ease both;transition:background .1s;position:relative}
.pl-card:hover{background:var(--bg3)}
.pl-thumb{aspect-ratio:16/9;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;overflow:hidden}
.pl-thumb img{width:100%;height:100%;object-fit:cover;opacity:.8}
.pl-cnt{position:absolute;bottom:4px;right:6px;font-size:12px;font-weight:500;color:#fff;background:rgba(0,0,0,.8);padding:2px 4px;border-radius:4px}
.pl-info{padding:12px}
.pl-name{font-size:14px;font-weight:500;margin-bottom:2px}
.pl-sub{font-size:13px;color:var(--t2)}
.pl-rm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--t2);transition:all .1s;opacity:0}
.pl-card:hover .pl-rm{opacity:1}
.pl-rm:hover{color:#f28b82}
.pl-back{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--t2);padding:0 12px;height:36px;border-radius:18px;transition:background .1s;margin-right:8px}
.pl-back:hover{background:var(--bg3);color:var(--t1)}
.new-pl{display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.new-pl input{background:transparent;border:1px solid var(--border);border-radius:4px;padding:8px 12px;color:var(--t1);font-size:14px;outline:none;width:280px;transition:border-color .15s}
.new-pl input:focus{border-color:#3ea6ff}
.new-pl input::placeholder{color:var(--t3)}

/* ── SETTINGS ── */
.set-pg{padding:24px;max-width:720px}
.set-title{font-size:20px;font-weight:400;margin-bottom:24px}
.set-blk{background:var(--bg2);border-radius:12px;padding:20px;margin-bottom:16px}
.set-blk-title{font-size:16px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.set-blk-desc{font-size:13px;color:var(--t2);margin-bottom:16px;line-height:1.6}
.set-api-row{display:flex;gap:8px;margin-bottom:12px}
.set-api-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px 12px;color:var(--t1);font-size:14px;outline:none;transition:border-color .15s;font-family:monospace}
.set-api-row input:focus{border-color:#3ea6ff}
.set-api-row input::placeholder{color:var(--t3);font-family:'Roboto',sans-serif}
.set-api-btn{padding:0 20px;height:40px;background:#3ea6ff;color:#0f0f0f;border-radius:4px;font-size:14px;font-weight:500;transition:background .1s;white-space:nowrap}
.set-api-btn:hover{background:#65beff}
.set-hint{font-size:13px;color:var(--t3);line-height:1.8}
.set-hint a{color:#3ea6ff}
.tog-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.tog-lbl{font-size:14px;font-weight:500}
.tog-sub{font-size:12px;color:var(--t2);margin-top:1px}
.toggle{width:44px;height:24px;background:var(--bg4);border-radius:12px;position:relative;transition:background .2s;cursor:pointer;flex-shrink:0}
.toggle.on{background:#3ea6ff}
.tok{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.toggle.on .tok{left:22px}
.priv-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.priv-item:last-child{border-bottom:none}
.priv-ico{color:#4caf50;font-size:18px;margin-top:2px;flex-shrink:0}
.priv-name{font-size:14px;font-weight:500;margin-bottom:2px}
.priv-sub{font-size:13px;color:var(--t2);line-height:1.5}
.danger-btn{display:flex;align-items:center;gap:8px;padding:0 16px;height:36px;border-radius:18px;font-size:14px;background:transparent;border:1px solid var(--border);color:#f28b82;transition:all .1s;margin-top:12px}
.danger-btn:hover{background:#3d1f1f;border-color:#f28b82}
.saved-toast{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#4caf50;padding:4px 12px;background:rgba(76,175,80,.1);border-radius:10px;margin-left:12px}

/* ── API BANNER ── */
.api-banner{margin:0 24px 0;padding:12px 16px;background:rgba(62,166,255,.08);border:1px solid rgba(62,166,255,.2);border-radius:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.api-banner.ok{background:rgba(76,175,80,.08);border-color:rgba(76,175,80,.2)}
.api-b-title{font-size:14px;font-weight:500;color:#3ea6ff;margin-bottom:2px}
.api-b-title.ok{color:#4caf50}
.api-b-sub{font-size:12px;color:var(--t2)}
.api-b-inp{flex:2;min-width:200px;display:flex;gap:8px}
.api-b-inp input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:8px 12px;color:var(--t1);font-size:13px;outline:none;transition:border-color .15s}
.api-b-inp input:focus{border-color:#3ea6ff}
.api-b-inp input::placeholder{color:var(--t3)}
.api-b-btn{padding:0 14px;height:36px;background:#3ea6ff;color:#0f0f0f;border-radius:4px;font-size:13px;font-weight:500;white-space:nowrap;transition:background .1s}
.api-b-btn:hover{background:#65beff}

/* ── STATES ── */
.err-box{display:flex;flex-direction:column;align-items:center;gap:16px;padding:80px 24px;text-align:center}
.err-ico{font-size:48px;opacity:.4}
.err-msg{font-size:14px;color:var(--t2);max-width:360px;line-height:1.6}
.err-btn{padding:0 20px;height:36px;background:var(--bg3);border-radius:18px;font-size:14px;color:var(--t1);transition:background .1s}
.err-btn:hover{background:var(--bg4)}
.load-more{display:flex;justify-content:center;padding:24px 0}
.load-more button{padding:0 24px;height:36px;background:var(--bg3);border-radius:18px;font-size:14px;font-weight:500;color:var(--t1);transition:background .1s}
.load-more button:hover{background:var(--bg4)}

/* ── SEARCH INPUT BAR ── */
.search-hero{display:flex;align-items:center;gap:8px;padding:12px 24px 0;font-size:14px;color:var(--t2);border-bottom:1px solid var(--border);margin-bottom:0;padding-bottom:0}
.search-hero strong{color:var(--t1)}
.search-sort{margin-left:auto;display:flex;gap:6px;align-items:center}
.sort-btn{height:32px;padding:0 12px;border-radius:8px;font-size:13px;background:var(--bg3);color:var(--t2);transition:all .1s}
.sort-btn:hover{background:var(--bg4);color:var(--t1)}
.sort-btn.act{background:var(--t1);color:var(--bg);font-weight:500}

@media(max-width:1200px){.watch{flex-direction:column}.watch-side{flex:none;width:100%}}
@media(max-width:900px){
  .sidebar{width:72px}.sidebar .s-lbl,.sidebar .s-label,.sidebar .s-cnt{display:none}
  .sidebar .s-item{gap:0;padding:0;justify-content:center;margin:0 4px}
  .main{margin-left:72px}
}
@media(max-width:600px){
  :root{--sw:0px}
  .sidebar{transform:translateX(-100%);width:240px}
  .sidebar.open{transform:translateX(0)}
  .sidebar .s-lbl,.sidebar .s-label,.sidebar .s-cnt{display:block}
  .sidebar .s-item{gap:24px;padding:0 24px;justify-content:flex-start;margin:0 12px}
  .main{margin-left:0}
  .vgrid{padding:4px 12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 4px}
  .vgrid .vc-body{padding:8px 4px 4px}
  .vgrid .vc-av{display:none}
  .watch{padding:0}.watch-main{border-radius:0}
  .watch-player{border-radius:0}
  .chips-bar{padding:8px 12px}
  .lib-pg,.set-pg{padding:12px}
  .skel-grid{padding:4px 12px}
}

/* ══ CUSTOM PLAYER (YouTube-accurate) ═══════════════════════════════════════ */
.cp{position:relative;width:100%;height:100%;background:#000;overflow:hidden;user-select:none;outline:none;
  --cp-btn:48px; --cp-ico:26px}
.cp.cp-hide-cursor{cursor:none}
.cp video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.cp-stage{position:absolute;inset:0;z-index:2;background:transparent}

/* top gradient */
.cp-top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px 34px;background:linear-gradient(rgba(0,0,0,.72),transparent);
  opacity:1;transition:opacity .2s;pointer-events:none}
.cp-top.hidden{opacity:0}
.cp-title{flex:1;min-width:0;color:#fff;font-size:18px;font-weight:500;line-height:1.35;
  text-shadow:0 1px 3px rgba(0,0,0,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-top-actions{display:flex;align-items:center;gap:4px;pointer-events:auto}
.cp-top-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;background:rgba(0,0,0,.28);transition:background .12s,transform .12s}
.cp-top-btn:hover{background:rgba(0,0,0,.6);transform:scale(1.05)}
.cp-top-btn svg{fill:#fff}

/* bottom gradient */
.cp-ui{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:28px 12px 8px;
  background:linear-gradient(transparent,rgba(0,0,0,.5) 30%,rgba(0,0,0,.86));
  opacity:1;transition:opacity .2s}
.cp-ui.hidden{opacity:0;pointer-events:none}

/* progress */
.cp-bar{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.cp-bar-track{position:relative;height:4px;width:100%;background:rgba(255,255,255,.3);border-radius:2px;transition:height .1s}
.cp-bar:hover .cp-bar-track{height:6px}
.cp-buf{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.45);border-radius:2px}
.cp-played{position:absolute;left:0;top:0;bottom:0;background:#f00;border-radius:2px;transition:width .08s linear}
.cp-knob{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#f00;
  transform:translate(-50%,-50%) scale(0);transition:transform .1s;box-shadow:0 0 6px rgba(0,0,0,.6)}
.cp-bar:hover .cp-knob{transform:translate(-50%,-50%) scale(1)}
.cp-tip{position:absolute;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,.92);color:#fff;
  font-size:12px;font-weight:500;padding:3px 7px;border-radius:4px;pointer-events:none;white-space:nowrap}

/* control row — YouTube metrics */
.cp-row{display:flex;align-items:center;gap:2px;height:var(--cp-btn);margin-top:2px}
.cp-btn{width:var(--cp-btn);height:var(--cp-btn);border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:#fff;opacity:.98;transition:background .12s,transform .1s}
.cp-btn:hover{background:rgba(255,255,255,.16)}
.cp-btn:active{transform:scale(.94)}
.cp-btn svg{fill:#fff}
.cp-ico{fill:currentColor}
.cp-btn.on{background:rgba(255,255,255,.18)}
.cp-btn-main svg{margin-left:1px}
.cp-time{font-size:13px;color:#fff;font-variant-numeric:tabular-nums;margin:0 10px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cp-time-sep{opacity:.55;margin:0 2px}
.cp-badge{font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border-radius:4px;padding:3px 7px;margin-left:4px}
.cp-spacer{flex:1}
.cp-vol-wrap{display:flex;align-items:center}
.cp-vol{width:0;overflow:hidden;transition:width .18s ease;display:flex;align-items:center}
.cp-vol-wrap:hover .cp-vol,.cp-vol.open{width:84px}
.cp-vol input{width:78px;accent-color:#fff;cursor:pointer}

/* centre play + loading */
.cp-big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:none}
.cp-bigplay{pointer-events:auto;width:82px;height:82px;border-radius:50%;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s}
.cp-bigplay:hover{background:#f00;transform:scale(1.06)}
.cp-bigplay svg{fill:#fff;margin-left:5px}
.cp-big-icon{width:84px;height:84px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;animation:cpPop .45s ease forwards}
.cp-big-icon svg{fill:#fff}
@keyframes cpPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.cp-spin{width:56px;height:56px;border:4px solid rgba(255,255,255,.22);border-top-color:#f00;border-radius:50%;animation:cpSpn .8s linear infinite}
@keyframes cpSpn{to{transform:rotate(360deg)}}
.cp-loadtxt{position:absolute;left:0;right:0;bottom:92px;text-align:center;color:#ccc;font-size:13px;z-index:4}

/* double-tap skip animation (YouTube style) */
.cp-skip-fx{position:absolute;top:0;bottom:0;width:38%;z-index:3;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;pointer-events:none;
  background:radial-gradient(circle at center,rgba(255,255,255,.18),transparent 70%);
  animation:cpSkipFade .7s ease forwards}
.cp-skip-fx.left{left:0;border-radius:0 50% 50% 0}
.cp-skip-fx.right{right:0;border-radius:50% 0 0 50%}
.cp-skip-ring{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;
  color:#fff;animation:cpSkipSpin .7s ease}
.cp-skip-ring svg{fill:#fff}
.cp-skip-txt{color:#fff;font-size:12.5px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.8)}
@keyframes cpSkipSpin{from{transform:scale(.85)}50%{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes cpSkipFade{0%{opacity:0}18%{opacity:1}72%{opacity:1}100%{opacity:0}}

/* settings panel */
.cp-menu{position:absolute;right:12px;bottom:60px;min-width:320px;max-width:min(340px,92vw);
  background:rgba(28,28,28,.97);backdrop-filter:blur(8px);border-radius:12px;padding:8px 0;
  z-index:8;box-shadow:0 12px 40px rgba(0,0,0,.75);max-height:min(72vh,520px);overflow-y:auto}
.cp-menu-title{font-size:15px;font-weight:500;color:#fff;padding:8px 18px 10px}
.cp-menu-head{display:flex;align-items:center;gap:8px;padding:6px 10px 10px;font-size:15px;font-weight:500;color:#fff}
.cp-back{width:34px;height:34px;border-radius:50%;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center}
.cp-back:hover{background:rgba(255,255,255,.12)}
.cp-mi{display:flex;align-items:center;gap:12px;width:100%;padding:10px 18px;min-height:44px;font-size:14.5px;
  color:#eee;text-align:left}
.cp-mi:hover{background:rgba(255,255,255,.1)}
.cp-mi.sel{color:#3ea6ff}
.cp-mi svg{fill:currentColor;flex-shrink:0}
.cp-mi-lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.25}
.cp-mi-sub{font-size:11.5px;color:#9a9a9a;font-weight:400}
.cp-mi.sel .cp-mi-sub{color:#7fb9e8}
.cp-mi-val{margin-left:auto;color:#aaa;font-size:13px;white-space:nowrap}
.cp-check-space{width:18px;flex-shrink:0}
.cp-menu-foot{font-size:11px;color:#8a8a8a;padding:10px 18px 6px;border-top:1px solid rgba(255,255,255,.08);margin-top:6px}
.cp-speed-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:2px 14px 10px}
.cp-speed{font-size:12.5px;padding:9px 0;border-radius:8px;background:rgba(255,255,255,.09);color:#eee;text-align:center;font-variant-numeric:tabular-nums}
.cp-speed:hover{background:rgba(255,255,255,.18)}
.cp-speed.sel{background:#3ea6ff;color:#062033;font-weight:700}
.cp-switch{position:relative;width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,.24);flex-shrink:0;transition:background .15s}
.cp-switch[data-on="1"]{background:#3ea6ff}
.cp-switch-dot{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.cp-switch[data-on="1"] .cp-switch-dot{transform:translateX(16px)}

/* error */
.cp-err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:#0b0b0b;color:#ddd;text-align:center;padding:24px;z-index:7}
.cp-pill{padding:0 16px;height:36px;border-radius:18px;background:#fff;color:#0f0f0f;font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;gap:6px}
.cp-pill.ghost{background:rgba(255,255,255,.14);color:#fff}
.cp-pill.ghost:hover{background:rgba(255,255,255,.24)}

/* fullscreen + theater tuning: bigger hit targets like YouTube */
.cp:fullscreen{--cp-btn:52px}
.cp:fullscreen .cp-row{height:52px}
.cp:fullscreen .cp-title{font-size:20px}
@media (max-width:720px){
  .cp{--cp-btn:42px}
  .cp-row{height:42px;gap:0}
  .cp-time{font-size:12px;margin:0 6px}
  .cp-menu{right:8px;bottom:52px;min-width:0;width:calc(100% - 16px)}
  .cp-menu-title,.cp-mi{font-size:14px}
  .cp-top-btn{width:34px;height:34px}
}

/* ══ WATCH PAGE EXTRAS ═════════════════════════════════════════════════════ */
.watch.theater .watch-side{display:none}
.watch.theater .watch-main{max-width:100%}
.watch-meta-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:12px 0 8px}
.watch-meta-row .watch-ch-row{margin:0;flex:1 1 280px}
.watch-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill-group{display:flex;background:var(--bg3);border-radius:18px;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:18px;background:var(--bg3);color:var(--t1);font-size:13.5px;font-weight:500;transition:background .12s}
.pill:hover{background:var(--bg4)}
.pill.on{background:var(--t1);color:var(--bg)}
.pill svg{fill:currentColor}
.pill-group .pill{border-radius:0;background:transparent}
.pill-group .pill:hover{background:var(--bg4)}
.sub-btn{height:36px;padding:0 16px;border-radius:18px;background:var(--t1);color:var(--bg);font-size:13.5px;font-weight:500;margin-left:auto}
.sub-btn.on{background:var(--bg3);color:var(--t2)}
.side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:16px;font-weight:500}
.auto-tog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t2);cursor:pointer;font-weight:400}
.side-empty{font-size:12.5px;color:var(--t3);padding:8px 0}
.tag-mini{margin-left:8px;font-size:11px;color:var(--t3);background:var(--bg3);padding:1px 7px;border-radius:8px}
.toggle.sm{width:34px;height:18px}
.toggle.sm .tok{width:14px;height:14px}
.toggle.sm.on .tok{left:18px}
.vc-live{position:absolute;bottom:6px;right:8px;background:#f00;color:#fff;font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:3px;letter-spacing:.5px}
.side-foot{padding:16px 24px;font-size:11.5px;color:var(--t3)}

/* ══ ENGINE / SETUP ════════════════════════════════════════════════════════ */
.inline-warn{margin:0 24px 12px;padding:10px 14px;border-radius:10px;background:rgba(255,152,0,.08);border:1px solid rgba(255,152,0,.22);display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--t2)}
.engine-bar{margin:12px 24px 4px;padding:12px 16px;border-radius:12px;background:rgba(62,166,255,.07);border:1px solid rgba(62,166,255,.2);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.engine-bar-t{font-size:13.5px;font-weight:500;color:#3ea6ff}
.engine-bar-s{font-size:12px;color:var(--t2)}
.engine-bar-btn{padding:0 14px;height:34px;border-radius:17px;background:#3ea6ff;color:#0f0f0f;font-size:13px;font-weight:600}
.engine-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.ok,.engine-dot.ok{background:#2ecc71;box-shadow:0 0 6px rgba(46,204,113,.7)}
.dot.wait,.engine-dot.wait{background:#f1c40f}
.dot.bad,.engine-dot.bad{background:#e74c3c}
.engine-status{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--t2);margin:10px 0 6px;flex-wrap:wrap}
.badge-mini{font-size:10.5px;font-weight:600;color:#3ea6ff;background:rgba(62,166,255,.14);padding:2px 8px;border-radius:9px;text-transform:uppercase;letter-spacing:.5px}
.setup{padding:40px 24px 80px;display:flex;justify-content:center}
.setup-card{max-width:640px;width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:28px}
.setup-badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1px;color:#3ea6ff;background:rgba(62,166,255,.12);padding:3px 10px;border-radius:10px;margin-bottom:14px}
.setup-h1{font-size:24px;font-weight:600;margin-bottom:10px}
.setup-p{font-size:13.5px;color:var(--t2);line-height:1.65;margin-bottom:16px}
.setup-steps{margin:0 0 14px 18px;font-size:13.5px;color:var(--t2);line-height:1.9}
.setup-steps li{padding-left:4px}
.setup-steps b{color:var(--t1)}
.setup-steps code{background:var(--bg4);padding:1px 6px;border-radius:4px;font-size:12px;color:#9fd0ff}
.setup-link{color:#3ea6ff;font-size:13px;text-decoration:none;background:none;padding:0}
.setup-link:hover{text-decoration:underline}
.setup-note{margin-bottom:12px;font-size:12.5px;color:var(--t2);background:var(--bg3);border-radius:8px;padding:8px 12px}
.setup-note.ok{color:#7ee787}
.setup-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.setup-input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--t1);font-size:13.5px;outline:none}
.setup-input:focus{border-color:#3ea6ff}
.setup-btn{padding:0 18px;height:40px;border-radius:8px;background:#3ea6ff;color:#0f0f0f;font-size:13.5px;font-weight:600}
.setup-btn:disabled{opacity:.6}

/* ══ v5 additions: subscriptions / RSS ══════════════════════════════════════ */
.side-sub{display:flex;align-items:center;gap:8px}
.side-sub .s-av{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;overflow:hidden}
.side-sub .s-av img{width:100%;height:100%;object-fit:cover}
.s-live{width:6px;height:6px;border-radius:50%;background:#f00;margin-left:auto;flex-shrink:0}
.subs-empty{padding:8px 24px 4px;font-size:12.5px;color:var(--t3)}
.sub-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px 4px}
.sub-head h2{font-size:20px;font-weight:600}
.sub-actions{display:flex;gap:8px;flex-wrap:wrap}
.sub-chip{padding:0 14px;height:34px;border-radius:17px;background:var(--bg3);color:var(--t1);font-size:13px;font-weight:500}
.sub-chip:hover{background:var(--bg4)}
.sub-chip.pri{background:#3ea6ff;color:#0f0f0f}
.ch-rail{display:flex;gap:14px;overflow-x:auto;padding:12px 24px 4px;scrollbar-width:none}
.ch-rail::-webkit-scrollbar{display:none}
.ch-card{display:flex;flex-direction:column;align-items:center;gap:6px;width:78px;flex-shrink:0;cursor:pointer}
.ch-card .ch-av{width:56px;height:56px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;overflow:hidden;border:2px solid transparent;transition:border-color .12s}
.ch-card:hover .ch-av{border-color:var(--t1)}
.ch-card .ch-av img{width:100%;height:100%;object-fit:cover}
.ch-card .ch-name{font-size:11.5px;color:var(--t2);text-align:center;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-card.new .ch-av{background:var(--bg2);border:2px dashed var(--border);font-size:22px;color:var(--t2)}
.sub-btn{height:36px;padding:0 16px;border-radius:18px;background:var(--t1);color:var(--bg);font-size:13.5px;font-weight:500;margin-left:auto;white-space:nowrap}
.sub-btn.on{background:var(--bg3);color:var(--t2)}
.sub-btn.small{height:32px;padding:0 12px;font-size:12.5px;margin:0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .12s ease}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:460px;padding:22px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.modal h3{font-size:17px;font-weight:600;margin-bottom:6px}
.modal p{font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:14px}
.modal input,.modal textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--t1);font-size:13.5px;outline:none;font-family:inherit}
.modal input:focus,.modal textarea:focus{border-color:#3ea6ff}
.modal-row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.modal-err{color:#f28b82;font-size:12.5px;margin-top:8px;min-height:16px}
.btn-ghost{height:36px;padding:0 16px;border-radius:18px;background:var(--bg3);color:var(--t1);font-size:13.5px}
.btn-ghost:hover{background:var(--bg4)}
.btn-pri{height:36px;padding:0 18px;border-radius:18px;background:#3ea6ff;color:#0f0f0f;font-size:13.5px;font-weight:600}
.sub-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--bg3)}
.sub-row:last-child{border-bottom:none}
.sub-row .sr-av{width:40px;height:40px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0}
.sub-row .sr-av img{width:100%;height:100%;object-fit:cover}
.sub-row .sr-name{font-size:14px;font-weight:500}
.sub-row .sr-id{font-size:11.5px;color:var(--t3);font-family:monospace}
.sub-row .sr-actions{margin-left:auto;display:flex;gap:6px}
.day-head{font-size:13px;font-weight:600;color:var(--t2);padding:18px 24px 6px;letter-spacing:.3px;text-transform:uppercase}
.new-dot{width:6px;height:6px;border-radius:50%;background:#3ea6ff;display:inline-block;margin-right:6px}

/* avatar + channel header */
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.vc-av-wrap{cursor:pointer}
.ch-head{display:flex;align-items:center;gap:20px;padding:24px;flex-wrap:wrap}
.ch-title{font-size:26px;font-weight:700;line-height:1.2}
.ch-meta{font-size:13px;color:var(--t2);margin-top:4px}


/* ════════════════ SHORTS ════════════════ */
.shorts-wrap{display:flex;flex-direction:column;gap:12px}
.shorts-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.shorts-h-title{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700}
.shorts-h-ico{color:var(--red);font-size:20px}
.shorts-h-count{font-size:13px;font-weight:500;color:var(--t2);background:var(--bg4);border-radius:999px;padding:4px 10px}
.shorts-h-actions{display:flex;gap:8px}
.shorts-feed{height:calc(100vh - 200px);min-height:420px;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:16px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none;overscroll-behavior:contain}
.shorts-feed::-webkit-scrollbar{display:none}
.short-card{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;min-height:0}
.short-stage{position:relative;height:100%;max-width:100%;aspect-ratio:9/16;background:#000;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.short-video,.short-poster{width:100%;height:100%;object-fit:cover;background:#000;display:block}
.short-video{cursor:pointer}
.short-spin{position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sv-spin .8s linear infinite}
@keyframes sv-spin{to{transform:rotate(360deg)}}
.short-err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:14px;background:rgba(0,0,0,.55);text-align:center;padding:20px}
.short-ov{position:absolute;left:0;right:0;bottom:0;padding:14px 12px 16px;background:linear-gradient(transparent,rgba(0,0,0,.82))}
.short-who{display:flex;align-items:center;gap:10px;min-width:0}
.short-av{border-radius:50%;overflow:hidden;flex-shrink:0;line-height:0;cursor:pointer}
.short-txt{flex:1;min-width:0;color:#fff}
.short-ch{font-size:13px;font-weight:600}
.short-title{font-size:14px;font-weight:500;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.short-views{font-size:12px;color:rgba(255,255,255,.72);margin-top:3px}
.short-sub{flex-shrink:0;padding:7px 14px!important;font-size:12px!important;background:#fff!important;color:#0f0f0f!important;border-radius:999px!important}
.short-sub.on{background:rgba(255,255,255,.18)!important;color:#fff!important}
.short-side{position:absolute;right:10px;bottom:96px;display:flex;flex-direction:column;gap:10px}
.short-btn{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.12);transition:background .15s,transform .15s}
.short-btn:hover{background:rgba(0,0,0,.7);transform:scale(1.06)}
.short-btn.on{color:var(--red)}
.shorts-nav{display:flex;gap:8px;justify-content:center}
.shorts-nav-btn{width:40px;height:34px;border-radius:10px;background:var(--bg3);color:var(--t1);font-size:12px}
.shorts-nav-btn:disabled{opacity:.35;cursor:default}

/* ── "never stops" recovery pill ── */
.cp-recover{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:8px;
  padding:7px 14px;border-radius:999px;background:rgba(15,15,15,.86);border:1px solid #3a3a3a;color:#e8e8e8;font-size:12.5px;
  backdrop-filter:blur(6px);pointer-events:none;animation:cp-fade .18s ease}
.cp-recover-dot{width:8px;height:8px;border-radius:50%;background:#3ea6ff;animation:cp-pulse 1s infinite ease-in-out}
@keyframes cp-pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}

/* ── ShortsFire (second site, embedded inside Shorts) ── */
.sf-seg{display:flex;gap:4px;background:var(--bg3);padding:3px;border-radius:999px;margin-left:12px}
.sf-seg-btn{padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--t2);white-space:nowrap}
.sf-seg-btn.on{background:var(--bg1);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sf-wrap{display:flex;flex-direction:column;gap:8px}
.sf-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;font-size:13px;flex-wrap:wrap}
.sf-dot{width:8px;height:8px;border-radius:50%;background:#ff4e45;box-shadow:0 0 8px #ff4e45;flex:0 0 auto}
.sf-url{color:var(--t3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}
.sf-frame{width:100%;height:calc(100vh - 214px);min-height:460px;border:0;border-radius:14px;background:#0f0f0f;display:block}
.sf-note{font-size:12px;color:var(--t3)}
a.cp-pill{text-decoration:none;display:inline-flex;align-items:center}
@media (max-width:900px){.sf-frame{height:calc(100vh - 258px);min-height:420px}.sf-url{display:none}}
.shorts-hint{text-align:center;color:var(--t3);font-size:12px}
.shorts-shelf{margin-bottom:20px}
.shelf-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.shelf-ico{color:var(--red)}
.shelf-title{font-size:18px;font-weight:700}
.shelf-more{margin-left:auto;color:var(--t2);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--bg3)}
.shelf-more:hover{background:var(--bg4)}
.shelf-rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.shelf-card{flex:0 0 auto;width:150px;text-align:left;cursor:pointer}
.shelf-card img{width:150px;height:200px;object-fit:cover;border-radius:12px;background:var(--bg3);display:block}
.shelf-card-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;font-weight:500;margin-top:8px;line-height:1.35}
.shelf-card-v{font-size:12px;color:var(--t3);margin-top:2px}
.vc-short{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:700;letter-spacing:.3px;padding:3px 7px;border-radius:5px;display:flex;align-items:center;gap:4px}
.vc-short:before{content:"⚡";font-size:10px}
@media (max-width:640px){
  .shorts-feed{height:calc(100vh - 232px)}
  .short-stage{aspect-ratio:9/16;width:100%;border-radius:0}
  .shelf-card,.shelf-card img{width:124px}
  .shelf-card img{height:168px}
}

/* ── speed / pitch / zoom ─────────────────────────────────────────────── */
.cp-rate-badge{position:absolute;right:14px;top:12px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:600;padding:3px 7px;border-radius:4px;border:1px solid rgba(255,255,255,.18)}
.cp-zoom-badge{right:64px}
.cp-top{display:flex;align-items:center;gap:8px}
.cp-top .cp-title{flex:1;min-width:0}
.cp-speed-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px 12px 6px}
.cp-speed{font-size:12px;padding:6px 0;border-radius:6px;background:rgba(255,255,255,.09);color:#eee;text-align:center}
.cp-speed:hover{background:rgba(255,255,255,.18)}
.cp-speed.sel{background:#3ea6ff;color:#062033;font-weight:700}
.cp-switch{position:relative;width:34px;height:18px;border-radius:9px;background:rgba(255,255,255,.24);flex-shrink:0;transition:background .15s}
.cp-switch[data-on="1"]{background:#3ea6ff}
.cp-switch-dot{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.cp-switch[data-on="1"] .cp-switch-dot{transform:translateX(16px)}

/* ── recommendation shelves ───────────────────────────────────────────── */
.rec-shelf{margin-bottom:22px}
.rec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rec-title{font-size:18px;font-weight:700}
.rec-sub{font-size:12px;color:var(--t3);margin-left:2px}
.rec-rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.rec-card{flex:0 0 auto;width:236px;text-align:left;cursor:pointer}
.rec-card img{width:236px;height:133px;object-fit:cover;border-radius:12px;background:var(--bg3);display:block}
.rec-card-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:500;margin-top:8px;line-height:1.35}
.rec-card-m{font-size:12px;color:var(--t3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-sub{font-size:11px;font-weight:400;color:var(--t3);background:var(--bg3);border-radius:4px;padding:1px 6px;margin-left:8px;text-transform:none;letter-spacing:0}
.rec-reason{display:inline-block;font-size:11px;color:var(--t2);background:var(--bg3);border-radius:4px;padding:1px 6px;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vc-reason{font-size:11.5px;color:var(--t3);margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:640px){ .rec-card,.rec-card img{width:180px} .rec-card img{height:101px} }

.set-sub-h{font-size:12px;color:var(--t2);font-weight:600;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.5px}
.set-chip-row{display:flex;gap:6px;flex-wrap:wrap}
.set-chip{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--bg3);color:var(--t1)}
.set-chip:hover{background:var(--bg4)}
.set-chip.on{background:#3ea6ff;color:#062033;font-weight:600}
.keys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px}
.key-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t2)}
.key-row kbd{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--t1);font-family:ui-monospace,monospace;white-space:nowrap}

/* ── playback diagnosis panel ─────────────────────────────────────────── */
.pl-badge{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;
  color:#bbb;background:rgba(255,255,255,.08);border-radius:5px;padding:3px 8px}
.pl-ico{font-size:32px;line-height:1}
.pl-title{font-size:17px;font-weight:600;color:#fff}
.pl-sub{font-size:13px;color:#aaa;max-width:520px;line-height:1.6}
.pl-note{font-size:12.5px;color:#ffd79a;background:rgba(255,180,60,.1);border:1px solid rgba(255,180,60,.28);
  border-radius:10px;padding:9px 12px;max-width:520px;line-height:1.6;text-align:left}
.pl-note code{background:rgba(0,0,0,.35);border-radius:4px;padding:1px 5px;font-size:11.5px}
.pl-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:2px}

/* ════════════════════════════════════════════════════════════════════════════
   STORAGE — cloud-first. NOTHING goes into localStorage.
   All lists (history, subscriptions, likes, watch later, playlists, settings)
   live in the worker's Layerbase libSQL database. The browser keeps only:
     · sv_p  — the profile key cookie (22 chars, 10 years, no expiry)
     · sv_cfg — a bootstrap copy of the engine URL, because a database cannot
                tell you its own address before you have connected to it
   Every list is capped server-side: "aage ka yaad, peeche ka bhool".
   ════════════════════════════════════════════════════════════════════════════ */
const CAPS = { history: 300, subs: 150, likes: 500, watchlater: 300, playlists: 50, cfg: 1 };
const KEY_RE = /^[A-Za-z0-9_-]{16,64}$/;

const cook = (k, d) => {
  try {
    const m = document.cookie.match(new RegExp("(?:^|; )" + k + "=([^;]*)"));
    if (!m) return d;
    const raw = decodeURIComponent(m[1]);
    return raw ? JSON.parse(raw) : d;
  } catch { return d; }
};
const cookSet = (k, v, days) => {
  try {
    document.cookie = k + "=" + encodeURIComponent(JSON.stringify(v)) + "; path=/; max-age=" + Math.round(days * 86400) + "; SameSite=Lax";
    return true;
  } catch { return false; }
};
const randKey = () => {
  const b = new Uint8Array(18);
  try { crypto.getRandomValues(b); } catch { for (let i = 0; i < b.length; i++) b[i] = Math.floor(Math.random() * 256); }
  let str = "";
  for (let i = 0; i < b.length; i++) str += String.fromCharCode(b[i]);
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
};
const hashKey = () => { try { const m = String(location.hash || "").match(/[#&]p=([A-Za-z0-9_-]{16,64})/); return m ? m[1] : ""; } catch { return ""; } };
let PROFILE = "";
function profileKey() {
  if (PROFILE) return PROFILE;
  const fromHash = hashKey();
  const stored = cook("sv_p", "");
  const keep = KEY_RE.test(fromHash) ? fromHash : KEY_RE.test(String(stored || "")) ? String(stored) : "";
  PROFILE = keep || randKey();
  if (!keep || fromHash) cookSet("sv_p", PROFILE, 3650);   // only write when new or switched by a link
  return PROFILE;
}
const profileLink = () => {
  try { const u = new URL(location.href); u.hash = "p=" + profileKey(); return u.toString(); } catch { return "#p=" + profileKey(); }
};
const bootCfg = () => ({ ...DEFAULT_CFG, ...(cook("sv_cfg", {}) || {}) });
const ensureSlot = (map, kind) => {
  if (!map.has(kind)) map.set(kind, { kind, upsert: new Map(), del: new Set(), clear: false });
  return map.get(kind);
};

const fv = (n) => {
  n = Number(n) || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
};
const fd = (s) => {
  s = Math.max(0, Math.floor(Number(s) || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`;
};
const parseDur = (v) => {
  if (v.lengthSeconds) return v.lengthSeconds;
  const p = String(v.lengthText || "").split(":").map(Number);
  return p.length ? p.reduce((a, b) => a * 60 + b, 0) : 0;
};
const ago = (ts, text) => {
  if (text) return text;
  if (!ts) return "";
  const d = Date.now() / 1000 - ts;
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d / 60) + " min ago";
  if (d < 86400) return Math.floor(d / 3600) + " hours ago";
  if (d < 604800) return Math.floor(d / 86400) + " days ago";
  if (d < 2592000) return Math.floor(d / 604800) + " weeks ago";
  if (d < 31536000) return Math.floor(d / 2592000) + " months ago";
  return Math.floor(d / 31536000) + " years ago";
};
const dayKey = (ts) => {
  if (!ts) return "Earlier";
  const d = new Date(ts * 1000);
  const today = new Date();
  const y = new Date(Date.now() - 86400000);
  if (d.toDateString() === today.toDateString()) return "Today";
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: d.getFullYear() === today.getFullYear() ? undefined : "numeric" });
};

/* ════════════════════════════════════════════════════════════════════════════
   ENGINE (Cloudflare Worker)
   ════════════════════════════════════════════════════════════════════════════ */
const baseOf = (cfg) => String((cfg && cfg.engineUrl) || "").replace(/\/+$/, "");
const mediaUrl = (cfg, u) => (!u ? "" : /^https?:/i.test(u) ? u : baseOf(cfg) + u);

async function ep(cfg, path, timeout = 25000, opts = {}) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), timeout);
  try {
    const key = String((cfg && cfg.accessKey) || "").trim();
    const withKey = key ? path + (path.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(key) : path;
    const init = { method: opts.method || "GET", signal: ac.signal, headers: { Accept: "application/json" } };
    if (opts.body !== undefined) {
      init.body = JSON.stringify(opts.body);
      init.headers["content-type"] = "application/json";
    }
    const r = await fetch(baseOf(cfg) + withKey, init);
    const text = await r.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { throw new Error("engine returned non-JSON (worker URL check karein)"); }
    if (!r.ok) throw new Error((data && (data.error || data.detail)) || "engine HTTP " + r.status);
    return data;
  } finally { clearTimeout(t); }
}

/* ════════════════════════════════════════════════════════════════════════════
   RECOMMENDATION ENGINE — client-side, keyless
   Signals: YouTube's own "next" list · channels you watch (via RSS) ·
            subscriptions · freshness · popularity. No tracking, all local.
   ════════════════════════════════════════════════════════════════════════════ */
const REC_TTL = 5 * 60 * 1000;
const recCache = new Map();

function recAffinity(hist, excludeId) {
  const counts = new Map();
  for (const v of hist || []) {
    if (!v || !v.authorId || v.authorId === excludeId) continue;
    counts.set(v.authorId, (counts.get(v.authorId) || 0) + 1);
  }
  return counts;
}

function recScore(v, ctx) {
  let s = 0;
  const aff = ctx.counts.get(v.authorId) || 0;
  s += Math.min(24, aff * 8); // how often you watch this channel
  if (ctx.subs.has(v.authorId)) s += 10; // explicit intent
  if (v.viewCount > 0) s += Math.min(10, Math.log10(Math.max(10, v.viewCount)) * 2.5);
  if (v.published) {
    const hrs = (Date.now() / 1000 - v.published) / 3600;
    if (hrs >= 0) s += Math.max(0, 12 - hrs / 24); // fresh uploads first
  }
  if (v.isShort) s -= 6; // keep the watch-page rail long-form
  return s;
}

function recMerge(groups, ctx, exclude, limit = 20) {
  const out = new Map();
  for (const g of groups) {
    for (const v of g.items || []) {
      if (!v || !v.videoId || exclude.has(v.videoId)) continue;
      const score = g.base + recScore(v, ctx);
      const prev = out.get(v.videoId);
      if (prev && prev.__score >= score) continue;
      out.set(v.videoId, {
        ...v,
        recReason: typeof g.reason === "function" ? g.reason(v) : g.reason,
        __score: score,
      });
    }
  }
  return [...out.values()]
    .sort((a, b) => b.__score - a.__score)
    .slice(0, limit)
    .map(({ __score, ...v }) => v);
}

async function recommendFor(cfg, video, st) {
  const hit = recCache.get("v:" + video.videoId);
  if (hit && Date.now() - hit.ts < REC_TTL) return hit.data;

  const counts = recAffinity(st.hist, null);
  const subs = new Set((st.subs || []).map((x) => x.channelId));
  const ctx = { counts, subs };
  const top = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([id]) => id);
  const feedIds = [...new Set([video.authorId, ...top].filter(Boolean))].slice(0, 8);

  const [rel, feed, trend] = await Promise.all([
    apiRelated(cfg, video.videoId).then((d) => d.items || []).catch(() => []),
    feedIds.length ? apiRss(cfg, feedIds).then((d) => d.items || []).catch(() => []) : [],
    (st.hist || []).length === 0 ? apiTrending(cfg, cfg.region).then((d) => d.items || []).catch(() => []) : [],
  ]);

  const items = recMerge(
    [
      { items: rel, base: 58, reason: (v) => (subs.has(v.authorId) ? "From a channel you follow" : "Related to this video") },
      { items: feed.filter((v) => v.authorId && v.authorId !== video.authorId), base: 44, reason: (v) => "Because you watch " + (v.author || "this channel") },
      { items: feed.filter((v) => v.authorId && v.authorId === video.authorId), base: 52, reason: (v) => "More from " + (v.author || video.author || "this channel") },
      { items: trend, base: 20, reason: "Trending now" },
    ],
    ctx,
    new Set([video.videoId]),
    20
  );

  const data = { items, affinity: top.slice(0, 3) };
  recCache.set("v:" + video.videoId, { ts: Date.now(), data });
  return data;
}

async function recommendHome(cfg, st) {
  const hit = recCache.get("home");
  if (hit && Date.now() - hit.ts < REC_TTL) return hit.data;

  const counts = recAffinity(st.hist, null);
  const subs = new Set((st.subs || []).map((x) => x.channelId));
  const ids = [...new Set([...subs, ...[...counts.entries()].sort((a, b) => b[1] - a[1]).map(([id]) => id)])].slice(0, 8);

  const [feed, trend] = await Promise.all([
    ids.length ? apiRss(cfg, ids).then((d) => d.items || []).catch(() => []) : [],
    apiTrending(cfg, cfg.region).then((d) => d.items || []).catch(() => []),
  ]);

  const items = recMerge(
    [
      { items: feed, base: 40, reason: (v) => (subs.has(v.authorId) ? "New from " + (v.author || "a channel you follow") : "Because you watch " + (v.author || "this channel")) },
      { items: trend, base: 18, reason: "Trending now" },
    ],
    { counts, subs },
    new Set(),
    12
  );

  const data = { items };
  recCache.set("home", { ts: Date.now(), data });
  return data;
}
