function ShortCard({ v, idx, active, muted, data, st, onChannel, onAddSub, onOpenWatch, onLike, onToggleMute, cardRef }) {
  const vidRef = useRef(null);
  const meta = { ...v, ...((data && data.video) || {}) };
  const subscribed = st.isSub(meta.authorId);
  const fav = st.isFav(v.videoId);
  const share = async () => {
    const url = YTW(v.videoId);
    try {
      if (navigator.share) await navigator.share({ title: meta.title, url });
      else { await navigator.clipboard.writeText(url); alert("Link copied"); }
    } catch {}
  };
  return (
    <div className="short-card" data-idx={idx} ref={cardRef}>
      <div className="short-stage">
        {data && data.src ? (
          <video
            ref={vidRef}
            className="short-video"
            src={data.src}
            poster={v.thumbnail}
            loop
            playsInline
            muted={muted || !active}
            autoPlay={active}
            preload={Math.abs(idx - active) <= 1 ? "auto" : "none"}
            onClick={() => { const el = vidRef.current; if (!el) return; if (el.paused) el.play().catch(() => {}); else el.pause(); }}
          />
        ) : (
          <img className="short-poster" src={v.thumbnail} alt="" />
        )}
        {data && data.status === "loading" && <div className="short-spin" />}
        {data && data.status === "error" && (
          <div className="short-err">
            <div>Stream nahi mila</div>
            <a href={YTW(v.videoId)} target="_blank" rel="noreferrer" className="cp-pill">Open on YouTube</a>
          </div>
        )}

        <div className="short-ov">
          <div className="short-who">
            <button className="short-av" onClick={() => meta.authorId && onChannel(meta.authorId, meta.author)} title={meta.author}>
              <Av name={meta.author} src={meta.avatar} size={38} />
            </button>
            <div className="short-txt">
              <div className="short-ch">{meta.author || "Shorts"}</div>
              <div className="short-title">{meta.title}</div>
              {meta.viewCount > 0 && <div className="short-views">{fv(meta.viewCount)} views</div>}
            </div>
            <button
              className={"sub-btn short-sub" + (subscribed ? " on" : "")}
              onClick={() => {
                if (subscribed) st.removeSub(meta.authorId);
                else if (meta.authorId) st.addSub({ channelId: meta.authorId, name: meta.author });
                else onAddSub();
              }}
            >
              {subscribed ? "Subscribed" : "Subscribe"}
            </button>
          </div>
        </div>

        <div className="short-side">
          <button className={"short-btn" + (fav ? " on" : "")} title="Like" onClick={() => onLike(meta)}>
            <Icon d={I.like} size={22} />
          </button>
          <button className="short-btn" title={muted ? "Unmute" : "Mute"} onClick={() => onToggleMute()}>
            <Icon d={muted ? I.mute : I.vol} size={22} />
          </button>
          <button className="short-btn" title="Watch page" onClick={() => onOpenWatch(meta)}>
            <Icon d={I.play} size={22} />
          </button>
          <button className="short-btn" title="Share" onClick={share}>
            <Icon d={I.share} size={20} />
          </button>
        </div>
      </div>
    </div>
  );
}

function ShortsPage({ st, engine, onPlay, onChannel, onAddSub }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [warn, setWarn] = useState("");
  const [active, setActive] = useState(0);
  const [muted, setMuted] = useState(true);
  const [nonce, setNonce] = useState(0);
  const [data, setData] = useState({});   // videoId -> {status, src, video}
  const feedRef = useRef(null);
  const cardRefs = useRef([]);

  useEffect(() => {
    let dead = false;
    setLoading(true); setWarn(""); setActive(0); setData({});
    if (engine !== "ok") {
      if (!dead) { setItems([]); setLoading(false); if (engine === "down") setWarn("Engine connect nahi hai — Settings me worker URL daalein"); }
      return () => { dead = true; };
    }
    apiShorts(st.cfg, st.cfg.region)
      .then((d) => {
        if (dead) return;
        const list = d.items || [];
        setItems(list);
        if (!list.length) setWarn("Shorts nahi mile — Retry karein");
      })
      .catch((e) => { if (!dead) setWarn(e.message); })
      .then(() => { if (!dead) setLoading(false); });
    return () => { dead = true; };
  }, [engine, st.cfg.engineUrl, st.cfg.region, nonce]);

  // resolve the current card (+1 so the next swipe is instant)
  useEffect(() => {
    if (engine !== "ok") return;
    let dead = false;
    [active, active + 1].forEach((i) => {
      const v = items[i];
      if (!v) return;
      setData((d) => (d[v.videoId] ? d : { ...d, [v.videoId]: { status: "loading" } }));
      apiPlayer(st.cfg, v.videoId)
        .then((p) => {
          if (dead) return;
          const ok = p && p.ok && (p.formats || []).length;
          setData((d) => ({ ...d, [v.videoId]: ok ? { status: "ready", src: p.formats[0].url, video: p.video || {} } : { status: "error" } }));
        })
        .catch(() => { if (!dead) setData((d) => ({ ...d, [v.videoId]: { status: "error" } })); });
    });
    return () => { dead = true; };
  }, [active, items, engine, st.cfg.engineUrl]);

  // play the active one, pause the rest
  useEffect(() => {
    const feed = feedRef.current;
    if (!feed) return;
    const vids = feed.querySelectorAll("video");
    vids.forEach((el) => {
      const card = el.closest(".short-card");
      const on = card && Number(card.dataset.idx) === active;
      if (on) {
        el.muted = muted;
        const pr = el.play && el.play();
        if (pr && pr.catch) pr.catch(() => {});
      } else {
        try { el.pause(); el.currentTime = 0; } catch {}
      }
    });
  }, [active, muted, data, items]);

  const scrollTo = useCallback((i) => {
    const el = cardRefs.current[i];
    if (el && el.scrollIntoView) { try { el.scrollIntoView({ behavior: "smooth", block: "start" }); } catch {} }
  }, []);

  const step = useCallback((dir) => {
    setActive((i) => {
      const n = Math.max(0, Math.min(items.length - 1, i + dir));
      scrollTo(n);
      return n;
    });
  }, [items.length, scrollTo]);

  useEffect(() => {
    const h = (e) => {
      if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); step(1); }
      else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); step(-1); }
      else if (e.key === "m") setMuted((m) => !m);
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [step]);

  const cur = items[active];

  return (
    <div className="shorts-wrap">
      <div className="shorts-head">
        <div className="shorts-h-title"><span className="shorts-h-ico">⚡</span> Shorts
          {items.length > 0 && <span className="shorts-h-count">{active + 1} / {items.length}</span>}
        </div>
        <div className="shorts-h-actions">
          <button className="cp-pill" onClick={() => setNonce((n) => n + 1)}>Refresh</button>
          <button className="cp-pill" onClick={() => setMuted((m) => !m)}>{muted ? "🔇 Unmute" : "🔊 Mute"}</button>
        </div>
      </div>

      {warn && (
        <div className="inline-warn"><span>⚠️</span><span style={{ flex: 1 }}>{warn}</span>
          <button className="cp-pill" onClick={() => setNonce((n) => n + 1)}>Retry</button></div>
      )}

      {loading ? (
        <div className="shorts-feed"><div className="short-card"><div className="short-stage"><div className="skel" style={{ width: "100%", height: "100%" }} /></div></div></div>
      ) : items.length === 0 ? (
        <div className="err-box"><div className="err-ico">⚡</div><div className="err-msg">Abhi koi Short nahi mila — Refresh try karein</div></div>
      ) : (
        <>
          <div className="shorts-feed" ref={feedRef}>
            {items.map((v, i) => (
              <ShortCard
                key={v.videoId}
                v={v} idx={i} active={i === active} muted={muted} data={data[v.videoId]}
                st={st} onChannel={onChannel} onAddSub={onAddSub}
                cardRef={(el) => { cardRefs.current[i] = el; }}
                onOpenWatch={(meta) => onPlay({ ...meta, isShort: true })}
                onLike={(meta) => st.togFav(meta)}
                onToggleMute={() => setMuted((m) => !m)}
              />
            ))}
          </div>
          <div className="shorts-nav">
            <button className="shorts-nav-btn" onClick={() => step(-1)} disabled={active === 0} title="Previous (↑)">▲</button>
            <button className="shorts-nav-btn" onClick={() => step(1)} disabled={active >= items.length - 1} title="Next (↓)">▼</button>
          </div>
          <div className="shorts-hint">Scroll / ↓ ↑ se next · {cur ? cur.title : ""}</div>
        </>
      )}
    </div>
  );
}

function SearchPage({ query, onPlay, st, engine, onChannel }) {
  const [res, setRes] = useState([]);
  const [token, setToken] = useState(null);
  const [loading, setLoading] = useState(true);
  const [more, setMore] = useState(false);
  const [error, setError] = useState("");
  const [layout, setLayout] = useState("grid");

  useEffect(() => {
    if (!query) return;
    let dead = false;
    setLoading(true); setError(""); setRes([]); setToken(null);
    if (engine !== "ok") { setLoading(false); setError("engine-offline"); return; }
    apiSearch(st.cfg, query)
      .then((d) => { if (dead) return; setRes(d.items || []); setToken(d.continuation || null); setLoading(false); })
      .catch((e) => { if (!dead) { setError(e.message); setLoading(false); } });
    return () => { dead = true; };
  }, [query, engine, st.cfg.engineUrl]);

  const loadMore = async () => {
    if (!token || more) return;
    setMore(true);
    try {
      const d = await apiSearchMore(st.cfg, query, token);
      setRes((prev) => { const have = new Set(prev.map((v) => v.videoId)); return [...prev, ...(d.items || []).filter((v) => !have.has(v.videoId))]; });
      setToken(null);
    } catch (e) { setError(e.message); }
    setMore(false);
  };

  return (
    <div>
      <div className="search-hero" style={{ padding: "12px 24px", borderBottom: "1px solid var(--border)", marginBottom: 8 }}>
        <span>Results for <strong>“{query}”</strong></span>
        {!loading && <span style={{ marginLeft: 8, fontSize: 12, color: "var(--t3)" }}>{res.length} videos</span>}
        <div className="search-sort">
          <button className={"sort-btn" + (layout === "grid" ? " act" : "")} onClick={() => setLayout("grid")}>⊞ Grid</button>
          <button className={"sort-btn" + (layout === "list" ? " act" : "")} onClick={() => setLayout("list")}>☰ List</button>
        </div>
      </div>
      {error && error !== "engine-offline" && <div className="inline-warn"><span>⚠️</span><span style={{ flex: 1 }}>{error}</span></div>}
      {loading ? <Skels n={8} /> : res.length === 0 ? (
        <div className="err-box"><div className="err-ico">🔍</div><div className="err-msg">“{query}” ke liye kuch nahi mila</div></div>
      ) : (
        <>
          <div className={layout === "grid" ? "vgrid" : "vlist"}>
            {res.map((v, i) => (
              <div key={v.videoId} style={{ animationDelay: `${Math.min(i, 20) * 0.025}s` }}>
                <VCard v={v} onPlay={onPlay} layout={layout} st={st} onChannel={onChannel} />
              </div>
            ))}
          </div>
          {token && <div className="load-more"><button onClick={loadMore}>{more ? "Loading…" : "Show more"}</button></div>}
        </>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   WATCH
   ════════════════════════════════════════════════════════════════════════════ */
function WatchPage({ video, onPlay, st, engine, onChannel, onAddSub }) {
  const [stream, setStream] = useState(null);
  const [status, setStatus] = useState("loading");
  const [err, setErr] = useState("");
  const [rel, setRel] = useState([]);
  const [descOpen, setDescOpen] = useState(false);
  const [attempt, setAttempt] = useState(0);
  const [diag, setDiag] = useState(null);   // worker's {reason, reasonLabel, hint, needAuth, attempts}
  const [showWhy, setShowWhy] = useState(false);

  useEffect(() => {
    let dead = false;
    setStatus("loading"); setErr(""); setStream(null); setDiag(null); setShowWhy(false);
    if (engine !== "ok") { setStatus("error"); setErr("engine-offline"); return; }
    apiPlayer(st.cfg, video.videoId)
      .then((d) => {
        if (dead) return;
        if (!d || !d.ok || !(d.formats || []).length) {
          setStatus("error");
          setDiag(d || null);
          setErr((d && (d.error || (d.attempts || []).slice(-3).join(" · "))) || "koi playable stream nahi mila");
          return;
        }
        setStream(d); setStatus("ready");
      })
      .catch((e) => { if (!dead) { setStatus("error"); setErr(e.message); } });
    return () => { dead = true; };
  }, [video.videoId, engine, st.cfg.engineUrl, attempt]);

  useEffect(() => {
    let dead = false;
    setRel([]);
    if (engine === "ok") recommendFor(st.cfg, video, st).then((d) => !dead && setRel(d.items || [])).catch(() => {});
    return () => { dead = true; };
  }, [video.videoId, engine, st.cfg.engineUrl]);

  const meta = useMemo(() => {
    const m = { ...video };
    if (stream && stream.video) {
      const v = stream.video;
      m.title = v.title || m.title;
      m.author = v.author || m.author;
      m.authorId = v.authorId || m.authorId;
      m.description = v.description || m.description;
      m.viewCount = v.viewCount || m.viewCount;
      m.lengthSeconds = v.lengthSeconds || m.lengthSeconds;
      m.live = v.live || m.live;
      if (!m.thumbnail && v.thumbnails && v.thumbnails.length) m.thumbnail = v.thumbnails[v.thumbnails.length - 1];
    }
    return m;
  }, [video, stream]);

  useEffect(() => {
    if (status === "ready") {
      st.addHist({
        videoId: video.videoId, title: meta.title, author: meta.author, authorId: meta.authorId,
        thumbnail: meta.thumbnail, lengthSeconds: meta.lengthSeconds, viewCount: meta.viewCount, publishedText: meta.publishedText,
      });
    }
  }, [status]);

  const nextVideo = useCallback(() => {
    const n = rel.find((v) => v.videoId !== video.videoId);
    if (n) onPlay(n);
  }, [rel, video.videoId, onPlay]);

  const share = async () => {
    const url = YTW(video.videoId);
    try {
      if (navigator.share) await navigator.share({ title: meta.title, url });
      else { await navigator.clipboard.writeText(url); alert("Link copied ✓"); }
    } catch {}
  };
  const download = () => {
    if (!baseOf(st.cfg)) { alert("Engine URL set nahi hai"); return; }
    window.open(`${baseOf(st.cfg)}/mp4/${video.videoId}.mp4?dl=1`, "_blank");
  };

  const fav = st.isFav(video.videoId), wl = st.isWL(video.videoId);
  const subscribed = st.isSub(meta.authorId);

  return (
    <div className={"watch" + (st.cfg.theater ? " theater" : "")}>
      <div className="watch-main">
        <div className="watch-player">
          {status === "loading" && (
            <div className="cp"><div className="cp-big"><div className="cp-spin" /></div><div className="cp-loadtxt">Stream resolve ho raha hai…</div></div>
          )}
          {status === "error" && (
            <div className="cp">
              <div className="cp-err">
                <div className="pl-badge">{err === "engine-offline" ? "engine" : (diag && diag.reason) || "error"}</div>
                <div className="pl-ico">⚠️</div>
                <div className="pl-title">
                  {err === "engine-offline" ? "Engine connect nahi hai" : (diag && diag.reasonLabel) || "Video play nahi ho paya"}
                </div>
                <div className="pl-sub">
                  {err === "engine-offline"
                    ? "Settings → Engine URL set karein (Cloudflare Worker)."
                    : (diag && diag.hint) || err}
                </div>

                {diag && diag.needAuth && (
                  <div className="pl-note">
                    <b>Ye video YouTube ke bot-check me atki hai.</b> Worker me <code>YT_COOKIES</code> (throwaway account)
                    ya <code>PO_TOKEN</code> / <code>POTOKEN_URL</code> secret add karo — uske baad yehi video chal jayegi.
                  </div>
                )}

                <div className="pl-actions">
                  <button className="cp-pill" onClick={() => setAttempt((a) => a + 1)}>↻ Retry</button>
                  <button className="cp-pill ghost" onClick={() => setAttempt((a) => a + 1)}>Fresh URL</button>
                  <a className="cp-pill ghost" href={`${baseOf(st.cfg)}/mp4/${video.videoId}.mp4?dl=1`} target="_blank" rel="noreferrer">Download MP4</a>
                  <a className="cp-pill ghost" href={YTW(video.videoId)} target="_blank" rel="noreferrer">Open on YouTube</a>
                </div>

                {diag && (diag.attempts || []).length > 0 && (
                  <div className="pl-why">
                    <button className="pl-why-btn" onClick={() => setShowWhy((v) => !v)}>
                      {showWhy ? "Hide" : "Why?"} · {diag.attempts.length} attempts tried
                    </button>
                    {showWhy && (
                      <div className="pl-why-body">

/* ── subscription manager + OPML (RSS standard) ───────────────────────────── */
function SubManager({ st, onAddSub }) {
  const exportOpml = () => {
    const body = st.subs
      .map((s) => `    <outline type="rss" text="${(s.name || s.channelId).replace(/"/g, "&quot;")}" title="${(s.name || s.channelId).replace(/"/g, "&quot;")}" xmlUrl="https://www.youtube.com/feeds/videos.xml?channel_id=${s.channelId}" htmlUrl="https://www.youtube.com/channel/${s.channelId}"/>`)
      .join("\n");
    const opml = `<?xml version="1.0" encoding="UTF-8"?>\n<opml version="2.0">\n<head><title>StreamVoid subscriptions</title></head>\n<body>\n  <outline text="YouTube" title="YouTube">\n${body}\n  </outline>\n</body>\n</opml>\n`;
    const blob = new Blob([opml], { type: "text/x-opml" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "streamvoid-subscriptions.opml";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  const importOpml = async (file) => {
    const text = await file.text();
    const ids = [...text.matchAll(/channel_id=(UC[\w-]{10,})/g)].map((m) => m[1]);
    const extra = [...text.matchAll(/youtube\.com\/channel\/(UC[\w-]{10,})/g)].map((m) => m[1]);
    const all = [...new Set([...ids, ...extra])];
    if (!all.length) return alert("OPML me koi YouTube channel nahi mila");
    st.setSubsRaw([...st.subs, ...all.filter((id) => !st.isSub(id)).map((channelId) => ({ channelId, name: channelId, avatar: "", addedAt: Date.now() }))]);
    alert(`${all.length} channel import hue — names pehli RSS fetch par aa jayenge`);
  };
  return (
    <div>
      <div className="set-blk-title" style={{ fontSize: 15, marginBottom: 8 }}>Subscriptions ({st.subs.length})</div>
      <div className="set-blk-desc" style={{ marginBottom: 10 }}>
        Videos channel ke <b>public feed</b> se aati hain — YouTube ka RSS endpoint Oct 2026 se 404 deta hai, to worker chupchaap channel ke Videos tab (InnerTube) se wahi data laata hai, aur feed wapas aate hi RSS use karne lagta hai. Koi account, koi Google login nahi.
      </div>
      {st.subs.map((s) => (
        <div key={s.channelId} className="sub-row">
          <Av name={s.name} src={s.avatar} size={40} />
          <div style={{ minWidth: 0 }}>
            <div className="sr-name">{s.name || s.channelId}</div>
            <div className="sr-id">{s.channelId}</div>
          </div>
          <div className="sr-actions">
            <a className="sub-chip" href={`https://www.youtube.com/channel/${s.channelId}`} target="_blank" rel="noreferrer">Channel ↗</a>
            <button className="sub-chip" onClick={() => st.removeSub(s.channelId)}>Remove</button>
          </div>
        </div>
      ))}
      <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
        <button className="sub-chip pri" onClick={onAddSub}>＋ Subscribe</button>
        <button className="sub-chip" onClick={exportOpml}>⬇ Export OPML</button>
        <label className="sub-chip" style={{ display: "inline-flex", alignItems: "center", cursor: "pointer" }}>
          ⬆ Import OPML
          <input type="file" accept=".opml,.xml,text/xml,text/x-opml" style={{ display: "none" }}
            onChange={(e) => e.target.files && e.target.files[0] && importOpml(e.target.files[0])} />
        </label>
      </div>
    </div>
  );
}

      <div className="tb-search-wrap">
        <form className="tb-search" onSubmit={go} style={{ flex: 1, display: "flex", alignItems: "center" }}>
          {q && <button type="button" className="tb-clr-btn" onClick={() => { setQ(""); ref.current?.focus(); }}>✕</button>}
          <input ref={ref} placeholder="Search" value={q} onChange={(e) => setQ(e.target.value)}
            style={{ flex: 1, background: "none", border: "none", outline: "none", color: "var(--t1)", fontSize: 16, padding: "0 8px", minWidth: 0 }} />
        </form>
        <button className="tb-go" onClick={go} aria-label="Search">🔍</button>
      </div>
      <div className="tb-right">
        <span className={"engine-dot " + (engine === "ok" ? "ok" : engine === "checking" ? "wait" : "bad")} title={"engine: " + engine} />
        <button className="tb-icon-btn" title="Subscriptions" onClick={() => onNav("subscriptions")}><Icon d={I.rss} size={20} /></button>
        <button className="tb-icon-btn" title="Add channel" onClick={onAddSub}>＋</button>
        <button className="tb-icon-btn" style={{ background: "var(--red)", color: "#fff", fontSize: 14, fontWeight: 700 }}>U</button>
      </div>
    </header>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   APP
   ════════════════════════════════════════════════════════════════════════════ */
function App() {
  const st = useStore();
  const [page, setPage] = useState("home");
  const [searchQ, setSearchQ] = useState("");
  const [curVid, setCurVid] = useState(null);
  const [curChannel, setCurChannel] = useState(null);
  const [open, setOpen] = useState(true);
  const [mini, setMini] = useState(false);
  const [engine, setEngine] = useState("checking");
  const [busy, setBusy] = useState(false);
  const [subModal, setSubModal] = useState(false);
  const [subsKey, setSubsKey] = useState(0);

  const checkEngine = useCallback(async () => {
    setEngine("checking"); setBusy(true);
    try { const d = await apiHealth(st.cfg); setEngine(d && d.ok ? "ok" : "down"); }
    catch { setEngine("down"); }
    setBusy(false);
  }, [st.cfg.engineUrl, st.cfg.accessKey]);

  useEffect(() => { checkEngine(); }, [st.cfg.engineUrl]);

  useEffect(() => {
    const onResize = () => {
      const w = window.innerWidth;
      if (w <= 640) { setOpen(false); setMini(false); }
      else if (w <= 960) { setOpen(true); setMini(true); }
      else { setOpen(true); setMini(false); }
    };
    onResize();
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const nav = (t, q) => {
    if (t === "search" && q) { setSearchQ(q); setPage("search"); }
    else setPage(t);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  const onSearch = (q) => { setSearchQ(q); setPage("search"); window.scrollTo({ top: 0 }); };
  const onPlay = (v) => { setCurVid(v); setPage("watch"); window.scrollTo({ top: 0 }); };
  const onChannel = (id, name) => { if (!id) return; setCurChannel({ id, name }); setPage("channel"); window.scrollTo({ top: 0 }); };
  const openSubModal = () => setSubModal(true);
  const afterSubAdd = () => { setSubsKey((k) => k + 1); };

  const mainClass = "main" + (mini ? " mini-margin" : "") + (!open && !mini ? " no-margin" : "");
  const needsSetup = engine === "down" && !st.cfg.engineUrl;

  return (
    <div className="layout">
      <Topbar onSearch={onSearch} onNav={nav} open={open} setOpen={setOpen} engine={engine} st={st} onAddSub={openSubModal} />
      <Sidebar page={page} nav={nav} st={st} open={open} mini={mini} onAddSub={openSubModal} onChannel={onChannel} />
      <div className={mainClass}>
        <div className="main-wrap">
          {needsSetup ? <SetupGate st={st} onRetry={checkEngine} busy={busy} /> : (
            <>
              <EngineBar status={engine} onSetup={() => nav("settings")} />
              {page === "home" && <HomePage onPlay={onPlay} st={st} engine={engine} onChannel={onChannel} onShorts={() => nav("shorts")} />}
              {page === "trending" && <HomePage onPlay={onPlay} st={st} engine={engine} onChannel={onChannel} onShorts={() => nav("shorts")} />}
              {page === "shorts" && (
                <ShortsPage st={st} engine={engine} onPlay={onPlay} onChannel={onChannel} onAddSub={openSubModal} />
              )}
              {page === "subscriptions" && (
                <SubsPage st={st} engine={engine} onPlay={onPlay} onChannel={onChannel} onAddSub={openSubModal} refreshKey={subsKey} />
              )}
              {page === "channel" && curChannel && (
                <ChannelPage channelId={curChannel.id} name={curChannel.name} st={st} engine={engine} onPlay={onPlay} onChannel={onChannel} />
              )}
              {page === "search" && <SearchPage query={searchQ} onPlay={onPlay} st={st} engine={engine} onChannel={onChannel} />}
              {page === "watch" && curVid && (
                <WatchPage video={curVid} onPlay={onPlay} st={st} engine={engine} onChannel={onChannel} onAddSub={openSubModal} />
              )}
              {page === "history" && <HistPage onPlay={onPlay} st={st} onChannel={onChannel} />}
              {page === "favorites" && <FavsPage onPlay={onPlay} st={st} onChannel={onChannel} />}
              {page === "watchlater" && <WLPage onPlay={onPlay} st={st} onChannel={onChannel} />}
              {page === "playlists" && <PLPage onPlay={onPlay} st={st} onChannel={onChannel} />}
              {page === "settings" && <SetPage st={st} engine={engine} onCheck={checkEngine} onAddSub={openSubModal} />}
            </>
          )}
        </div>
      </div>
      {subModal && <AddSubModal st={st} engine={engine} onClose={() => setSubModal(false)} onAdded={afterSubAdd} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
